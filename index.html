  });
  document.querySelectorAll("[data-auto]").forEach(b=>b.onclick=()=>armarAuto(+b.dataset.auto,b));
  document.querySelectorAll("[data-ses]").forEach(b=>b.onclick=()=>{ A.sesionAct=+b.dataset.ses; A.cruce=true; A.sel={bags:[],resto:[]}; pintar(); });
  const act=document.getElementById("activar");
  if(act) act.onclick=async()=>{
    act.disabled=true; act.textContent="Empezando…";

    if(!r.ok){ S.err=r.error; act.disabled=false; pintar(); return; }

async function traerEventos(){
  const r=await api("eventos",{token:tok()});
  A.eventos = (r&&r.ok) ? r.eventos : [];
  pintar();
}
async function abrirEvento(id){
  S.err=""; A.eventos=A.eventos||[];
  const r=await api("abrirEvento",{token:tok(),evento_id:id});
  if(!r.ok){ S.err=r.error; pintar(); return; }
  A.evento=r.evento; A.sesiones=r.sesiones; A.hcpEv=r.hcp||{}; A.hcpAj=r.hcp_ajustado||{}; A.nuevo=false; pintar();
}
async function armarAuto(i,b){
  const s=A.sesiones[i], cupo=s.formato==="SINGLES"?1:2;
  const usados=new Set(); A.sesiones.forEach(x=>x.matches.forEach(m=>m.bags.concat(m.resto).forEach(j=>usados.add(String(j)))));
  const hcp=S.cat.hcp||{};
  const libres=l=>S.cat.jugadores.filter(j=>eqDe(j.id)===l&&!usados.has(String(j.id)))
    .sort((a,c)=>(hcp[String(a.id)]??99)-(hcp[String(c.id)]??99)).map(j=>String(j.id));
  const B=libres("bag"), Rr=libres("resto");
  const n=Math.floor(Math.min(B.length,Rr.length)/cupo);
  if(!n){ S.err="No quedan jugadores libres para armar más cruces"; pintar(); return; }
  const hora=await pedir("Hora de salida del primer cruce","09:00",{tipo:"time",validar:v=>/^\d{1,2}:\d{2}$/.test(v)?"":"Elegí una hora"}); if(hora===null) return;
  if(!await confirmar(`¿Armar ${n} cruces?`,"Se enfrentan por handicap, con salidas cada 10 minutos.")) return;
  b.disabled=true; b.textContent="Armando…";
  const [hh,mm]=hora.split(":").map(Number);
  for(let k=0;k<n;k++){
    const bg=B.slice(k*cupo,k*cupo+cupo), rs=Rr.slice(k*cupo,k*cupo+cupo);
    const t=new Date(2000,0,1,hh,(mm||0)+k*10);
    const h=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    const r=await api("crearMatch",{token:tok(),sesion_id:s.sesion_id,nro:s.matches.length+1,
      bags_1:bg[0]||"",bags_2:bg[1]||"",resto_1:rs[0]||"",resto_2:rs[1]||"",hora:h},"POST");
    if(!r.ok){ S.err=r.error; break; }
    s.matches.push({match_id:r.match_id,bags:bg,resto:rs,hora:h});
  }
  pintar();
}
function ligarCruce(){
  document.querySelectorAll(".jchip").forEach(b=>b.onclick=()=>{
    const l=b.dataset.l, j=b.dataset.j, cupo=A.sesiones[A.sesionAct].formato==="SINGLES"?1:2;
    const arr=A.sel[l], i=arr.indexOf(j);
    if(i>=0) arr.splice(i,1); else { if(arr.length>=cupo) arr.shift(); arr.push(j); }
    pintar();
  });
  document.getElementById("cancelarM").onclick=()=>{ A.cruce=false; A.sel={bags:[],resto:[]}; S.err=""; pintar(); };
  document.querySelectorAll("[data-hj]").forEach(b=>b.onclick=async()=>{ const j=b.dataset.hj;
    const v=Math.max(-10,Math.min(54,Math.round(((+hcpEv(j)||0)+(+b.dataset.d))*10)/10));
    b.disabled=true; if(await fijarHcpEv(j,v)) pintar(); else b.disabled=false; });
  document.querySelectorAll("[data-hvj]").forEach(b=>b.onclick=async()=>{ const j=b.dataset.hvj;
    const v=await pedirHcp("Handicap de "+nom(j)+" para este evento",fmtH(hcpEv(j))); if(v===null) return;
    if(await fijarHcpEv(j,v)) pintar(); });
  const hh=document.getElementById("hh"); if(hh) hh.onchange=()=>{ A.hora=hh.value; };
  const g=document.getElementById("guardarM");
  if(g) g.onclick=async()=>{
    const s=A.sesiones[A.sesionAct], hora=document.getElementById("hh").value;
    g.disabled=true; g.textContent="Guardando…";
    const r=await api("crearMatch",{token:tok(),sesion_id:s.sesion_id,nro:s.matches.length+1,
      bags_1:A.sel.bags[0]||"",bags_2:A.sel.bags[1]||"",resto_1:A.sel.resto[0]||"",resto_2:A.sel.resto[1]||"",hora},"POST");
    if(!r.ok){ S.err=r.error; g.disabled=false; pintar(); return; }
    s.matches.push({match_id:r.match_id,bags:A.sel.bags.slice(),resto:A.sel.resto.slice(),hora});
    A.hora=hora; A.cruce=false; A.sel={bags:[],resto:[]}; S.err=""; pintar();
  };
}

function base(t,x){ return Object.assign({paper_bgcolor:t.bg,plot_bgcolor:t.bg,font:{family:"Inter, system-ui, sans-serif",color:t.ink,size:12},

let plotlyP=null;
function plotly(){ if(window.Plotly) return Promise.resolve(); if(plotlyP) return plotlyP;
  plotlyP=new Promise((ok,ko)=>{ const go=i=>{ if(i>=FUENTES.length) return ko(); const s=document.createElement("script"); s.src=FUENTES[i];
    s.onload=()=>window.Plotly?ok():go(i+1); s.onerror=()=>go(i+1); document.head.appendChild(s); }; go(0); }); return plotlyP; }

const esInv = j => String(j).slice(0,4)==="INV:";
const nomAm = j => esInv(j) ? String(j).slice(4) : nom(+j);
function avAm(j,cls=""){ if(!esInv(j)) return av(+j,cls,true);
  const n=String(j).slice(4).trim().split(" "); const ini=((n[0]||"?")[0]+(n[1]?n[1][0]:"")).toUpperCase();
  return `<span class="av ${cls} ini inv">${ini}</span>`; }
const MODAL={MATCH:"Match 1 vs 1",P420:"4-2-0 (tres jugadores)",FOURBALL:"Fourball 2 vs 2",STABLEFORD:"Stableford (2 a 4 jugadores)",MEDAL:"Medal (2 a 4 jugadores)",LAGUNEADA:"Laguneada (cada línea es un equipo)"};
const INDIV=m=>m==="STABLEFORD"||m==="MEDAL";
const cupoAm=m=>m==="MATCH"?2:m==="P420"?3:4;
const listoAm=()=>INDIV(AM.modalidad)?AM.sel.length>=2:AM.sel.length===cupoAm(AM.modalidad);
let AM={pct:100, hcpEd:{}, editH:false, ed:null, hcpInv:{}, lista:null, nueva:false, sel:[], lados:{}, modalidad:"MATCH", cancha:"", hcp_modo:"DIFERENCIA", p_bola:1, p_suma:0, act:null, hoyo:1, canchaNueva:false, par:Array(18).fill(4), idx:Array(18).fill("")};

/* nombre corto para parejas: "Mato & Fran" (si dos se llaman igual, va el nombre completo) */
/* parejas: cada jugador en su renglón, con su foto y el nombre completo del Tour */
function nombresEq(ids,nombreFn){ return ids.map(j=>nombreFn(j)).join(" & "); }
const parejaHtml=(ids,nombreFn,avFn,cls="")=>`<div class="pareja">${ids.map(j=>`<div class="pp">${avFn(j,"sm")}<span class="${cls}">${esc(nombreFn(j))}</span></div>`).join("")}</div>`;
function ladoFila(ids,o){
  if(ids.length>1) return `<div class="pj par ${o.r?"r":""}">${parejaHtml(ids,o.nombre,o.av,o.cls)}${o.extra?`<small class="ex">${o.extra}</small>`:""}</div>`;
  return `<div class="pj ${o.r?"r":""}">${o.av(ids[0])}<div class="nm ${o.cls||""}">${esc(o.nombre(ids[0]))}${o.extra?`<small>${o.extra}</small>`:""}</div></div>`;
}
const grupoAv=(ids,avFn,cls="")=>`<span class="avs">${ids.map(j=>avFn(j,cls)).join("")}</span>`;
/* un lado del encabezado de un cruce: fotos arriba, nombre en una línea y un dato debajo */
function ladoHdr(ids,o){
  if(ids.length>1) return `<div class="lado ${o.lado}">${parejaHtml(ids,o.nombre,o.av,o.cls)}<div class="hc">${o.sub||""}</div></div>`;
  return `<div class="lado ${o.lado}">${grupoAv(ids,o.av)}<div class="nm ${o.cls||""}">${esc(o.nombre(ids[0]))}</div><div class="hc">${o.sub||""}</div></div>`;
}
/* color de cada jugador en un amistoso: azul contra rojo; en el 4-2-0 el tercero va en amarillo.
   (En la Ryder: Bags Boys azul, Resto del Mundo amarillo.) */
function colAm(p,id){
  const J=p.jugadores, i=J.findIndex(j=>String(j.id)===String(id));
  if(p.modalidad==="LAGUNEADA") return "b";
  if(p.modalidad==="FOURBALL") return (J[i]||{}).lado==="A"?"b":"o";
  return ["b","o","y","v"][i]||"b";
}
function baseAm(){ const b={}, h=(S.cat&&S.cat.hcp)||{};
  AM.sel.forEach(j=>b[j]=AM.hcpEd[j]!=null?AM.hcpEd[j]:(esInv(j)?(AM.hcpInv[j]||0):(h[String(j)]||0))); return b; }
function canAm(){ const cs=(S.cat&&S.cat.canchas)||[]; return cs.find(c=>String(c.id)===String(AM.cancha||(cs[0]||{}).id))||{}; }
async function traerAmistosos(){
  const r=await api("misAmistosos",{jugador_id:S.ses.jugador.id});
  AM.lista = (r&&r.ok) ? r.partidas : [];
  pintar();
}
async function traerAmistoso(pid){
  const r=await api("amistoso",{partida_id:pid});
  if(r&&r.ok){ AM.act=r.partida; }
  else if(AM.act && AM.act.partida_id===pid){ S.err=r&&r.red?"Sin señal: ves lo último que llegó; los golpes quedan en el teléfono":(r&&r.error||""); }
  else { AM.act=null; S.err=(r&&r.error)||""; }
  pintar();
}
function vistaAmistosos(){
  if(AM.nueva) return vistaNuevoAm();
  if(AM.act) return vistaAmistoso();
  if(AM.lista===null) return `<div class="load">Buscando tus partidas…</div>`;
  const abiertas=AM.lista.filter(p=>p.estado!=="CERRADA"), listas=AM.lista.filter(p=>p.estado==="CERRADA");
  const fila=p=>{
    const J=p.jugadores.map(j=>j.id), fin=p.estado==="CERRADA"?"fin":"";
    const lid = !p.lider ? "" : (p.modalidad==="FOURBALL" ? (p.lider==="A"?"b":"o") : colAm(p,p.lider));
    const sub=`${MODAL[p.modalidad]} · ${esc(p.cancha.nombre||"")}${p.jugados&&p.estado!=="CERRADA"?` · hoyo ${p.jugados}`:""}${p.estado==="CERRADA"?" · terminada":""}`;
    if(p.modalidad==="LAGUNEADA") return `<div class="mrow am am3" data-p="${p.partida_id}">
    <div class="lado"><div class="pj">${grupoAv(J,avAm,"sm")}<div class="nm nm3"><b>Línea ${p.linea||1}</b> <span class="vs">·</span> ${J.map(j=>`<span>${esc(apellido(nomAm(j)))}</span>`).join(' <span class="vs">·</span> ')}</div></div></div>
    <span class="est ${fin}">${esc(p.resumen||"—")}</span><div class="sub">${p.jugados?`${p.jugados} hoyo${p.jugados===1?"":"s"}`:"por salir"}</div></div>`;
  if(p.modalidad==="P420"||INDIV(p.modalidad)) return `<div class="mrow am am3" data-p="${p.partida_id}">
      <div class="lado"><div class="pj">${grupoAv(J,avAm,"sm")}<div class="nm nm3">${J.map(j=>`<span class="c-${colAm(p,j)}">${esc(nomAm(j))}</span>`).join(' <span class="vs">·</span> ')}</div></div></div>
      <span class="est ${lid} ${fin}">${esc(p.resumen||"—")}</span><div class="sub">${sub}</div></div>`;
    const A=p.jugadores.filter(j=>colAm(p,j.id)==="b").map(j=>j.id), B=p.jugadores.filter(j=>colAm(p,j.id)==="o").map(j=>j.id);
    const ld=(l,c,r)=>`<div class="lado ${r?"r":""}">${ladoFila(l,{nombre:nomAm,av:avAm,cls:"c-"+c,r})}</div>`;
    const lidK=(p.modalidad==="MATCH"||p.modalidad==="FOURBALL")&&p.lider&&p.jugados ? (colAm(p,p.lider==="A"?A[0]:p.lider==="B"?B[0]:p.lider)==="b"?"lidA f-b":"lidB f-o") : "";
  return `<div class="mrow am ${lidK}" data-p="${p.partida_id}">${ld(A,"b",false)}
      <span class="est ${lid} ${fin}">${esc(p.resumen||"—")}</span>${ld(B,"o",true)}<div class="sub">${sub}</div></div>`;
  };

  return `<h1>Amistosos</h1>
  <p class="lead">Las partidas de todos los días: match, 4-2-0 o fourball. Quedan guardadas en tu perfil.</p>
  <button class="btn" id="nuevaAm">+ Nueva partida</button>
  ${abiertas.length?`<h2>En juego</h2><div class="card">${abiertas.map(fila).join("")}</div>`:""}
  ${listas.length?`<h2>Terminadas</h2><div class="card">${listas.map(fila).join("")}</div>`:""}
  ${!AM.lista.length?`<div class="aviso" style="margin-top:12px">Todavía no jugaste ninguna. Creá la primera y quedará en tu historial.</div>`:""}`;
}
function vistaCanchaNueva(){
  if(!Array.isArray(AM.par)||AM.par.length!==18) AM.par=Array(18).fill(4);
  if(!Array.isArray(AM.idx)||AM.idx.length!==18) AM.idx=Array(18).fill("");
  const usados=new Set(AM.idx.filter(x=>x!=="").map(Number));
  const suma=(d,h)=>AM.par.slice(d,h).reduce((a,b)=>a+(+b||0),0);
  const ida=suma(0,9), vta=suma(9,18), cargados=usados.size;
  const fila=h=>{ const v=AM.idx[h];
    return `<div class="cn-row"><span class="h">${h+1}</span>
      <select data-par="${h}" class="par${AM.par[h]}" aria-label="Par del hoyo ${h+1}">${[3,4,5].map(n=>`<option value="${n}" ${+AM.par[h]===n?"selected":""}>${n}</option>`).join("")}</select>
      <select data-idx="${h}" class="${v===""?"sinidx":""}" aria-label="Hándicap (índice) del hoyo ${h+1}"><option value="">-</option>${[...Array(18)].map((_,k)=>k+1).filter(n=>!usados.has(n)||String(n)===String(v)).map(n=>`<option value="${n}" ${String(n)===String(v)?"selected":""}>${n}</option>`).join("")}</select></div>`; };
  const col=(t,d,h,tot)=>`<div class="cn-col"><h3>${t}</h3><div class="cn-hd"><span>Hoyo</span><span>Par</span><span>Hdc</span></div>
    ${[...Array(h-d)].map((_,k)=>fila(d+k)).join("")}<div class="cn-tot"><span>Par ${t.toLowerCase()}</span><b>${tot}</b></div></div>`;
  const estadoIdx = cargados===0 ? `Sin hándicap de hoyos: se estiman por el par al guardar.`
    : cargados===18 ? `Hándicap de los 18 hoyos completo.` : `Hándicap cargado en ${cargados} de 18 hoyos: completalos todos o dejalos todos vacíos.`;
  return `<button class="btn volver-vivo" id="volverCan">${ruta().r==="cancha-nueva"?"‹ Canchas":TN.canchaNueva?"‹ Torneo amistoso":"‹ Nueva partida"}</button>
  <h1>Nueva cancha</h1>
  <p class="lead">Elegí el par y el hándicap (índice) de cada hoyo. Queda guardada para todos.</p>
  <div class="card"><div class="row2"><div><label class="f">Nombre</label><input type="text" id="cnom" placeholder="Ej: Martindale"></div>
    <div><label class="f">Recorrido (opcional)</label><input type="text" id="crec" placeholder="Ej: Azules"></div></div></div>
  <div class="cn-grid">${col("Ida",0,9,ida)}${col("Vuelta",9,18,vta)}</div>
  <div class="cn-total"><div><span>Par de la cancha</span><small>Ida ${ida} + Vuelta ${vta}</small></div><b>${ida+vta}</b></div>
  <p class="small ${cargados>0&&cargados<18?"cn-aviso":"muted"}" style="margin:10px 2px 0">${estadoIdx}</p>
  <button class="btn" id="guardarCan" ${cargados>0&&cargados<18?"disabled":""}>Guardar la cancha</button>
  <div class="err">${esc(S.err)}</div>`;
}

  const jug=[...(S.cat?S.cat.jugadores:[])].sort((a,b)=>(hcp[String(a.id)]??99)-(hcp[String(b.id)]??99));

      return `<button class="elg" data-am="${esc(j)}" aria-label="Sacar a ${esc(nomAm(j))}">${avAm(j,"sm")}<span class="c-${c}">${esc(nomAm(j))}</span><i>×</i></button>`; }).join("")}</div>`:""}

    <div class="jgrid">${jug.map(j=>{ const on=AM.sel.includes(String(j.id));
      return `<button class="jchip ${on?"b":""}" data-am="${j.id}">${avAm(j.id)}<span class="jn">${esc(j.nombre)}</span><span class="jh">${hcp[String(j.id)]??"—"}</span></button>`; }).join("")}</div>
  </div>
  ${AM.sel.length>=2?`<div class="card"><h3>Handicaps de juego</h3><p class="small muted" style="margin:0 0 4px">Tocá el número para escribirlo. Se pueden cambiar también durante la partida.</p>
    ${editorHcp({ids:AM.sel,base:baseAm(),pct:AM.pct,modo:AM.hcp_modo,idx:canAm().idx,nombre:nomAm,pref:"n"})}</div>`:""}
  <button class="btn" id="crearAm" ${listoAm()?"":"disabled"}>Empezar la partida</button>

function vistaAmistoso(){
  const p=AM.act, par=p.cancha.par;
  const pdA=pendDe(p.partida_id), pkA=new Set(Object.keys(pdA));
  const J=p.jugadores.map(j=>Object.assign({},j,{golpes:j.golpes.map((g,h)=>pdA[j.id+"|"+(h+1)]!=null?pdA[j.id+"|"+(h+1)]:g)})), ids=J.map(j=>j.id);
  const puedo = ids.includes(String(S.ses.jugador.id)) || S.ses.jugador.rol==="admin";
  const cl=j=>colAm(p,j.id), color=j=>({b:"bags",o:"rojo2",y:"amar"})[cl(j)];
  const ladoA=J.filter(j=>cl(j)==="b"), ladoB=J.filter(j=>cl(j)==="o");
  const golpesTxt=l=>l.map(j=>j.recibe).every(x=>x===0)?"sin golpes":(l.length===1?`recibe ${l[0].recibe} golpe${l[0].recibe===1?"":"s"}`:"reciben "+l.map(j=>j.recibe).join(" y "));
  const stc=p.lider?(" "+colAm(p,p.lider==="A"?(J.find(j=>j.lado==="A")||{}).id:(p.lider==="B"?(J.find(j=>j.lado==="B")||{}).id:p.lider))):"";
  const tot=j=>j.golpes.filter(x=>x!=null).reduce((a,b)=>a+b,0);
  const minP=Math.min(...J.map(j=>p.puntos[j.id]||0));
  const ladoDe=k=>k==="A"?ladoA:ladoB;
  const lidAm=!p.jugados?"":(p.modalidad==="FOURBALL"?p.lider:(p.lider===(ladoA[0]||{}).id?"A":p.lider===(ladoB[0]||{}).id?"B":""));
  const lista3 = p.modalidad==="P420"||INDIV(p.modalidad);
  const fv=v=>v==null?"":(p.conteo==="STABLEFORD"?String(v):fmtRel(v));
  const sumaLag=(d,h,k)=>{ let t=null; for(let x=d-1;x<h;x++){ const r=p.lag&&p.lag[x]; if(r){ const v=k==null?r.reduce((a,b)=>a+b,0):r[k]; if(v!=null) t=(t||0)+v; } } return t; };
  const filasLag=(d,h)=>{ if(p.modalidad!=="LAGUNEADA") return ""; let out="";

    if(p.nBolas>1) out+=`<tr class="lagr tot"><td class="l">Total</td>${[...Array(h-d+1)].map((_,i)=>{ const r=p.lag[d-1+i]; return `<td>${r?fv(r.reduce((a,b)=>a+b,0)):""}</td>`; }).join("")}<td><b>${fv(sumaLag(d,h,null))}</b></td></tr>`;
    return out; };

       <div class="small muted" style="text-align:center">${p.jugados?("hoyo "+p.jugados):"por salir"} · ${p.modalidad==="P420"?"6 puntos por hoyo · entre paréntesis, la diferencia con el último":p.modalidad==="MEDAL"?"medal neto: golpes sobre el par":"puntos stableford neto"}</div></div>`
    : p.modalidad==="LAGUNEADA"
    ? `<div class="lagbox"><div><span>${p.nBolas>=J.length?"Todas las pelotas":p.nBolas===1?"La mejor pelota":"Las "+p.nBolas+" mejores pelotas"} · ${p.conteo==="STABLEFORD"?"stableford":"medal"} neto</span><small>Línea ${p.linea||1} · ${p.jugados} hoyo${p.jugados===1?"":"s"} completo${p.jugados===1?"":"s"}</small></div><b>${esc(p.resumen)}</b></div>`
    : hdrMatch({A:{ids:ladoA.map(j=>j.id),nombre:nomAm,col:"b",sub:golpesTxt(ladoA)},B:{ids:ladoB.map(j=>j.id),nombre:nomAm,col:"o",sub:golpesTxt(ladoB)},
        lider:lidAm, res:p.resumen, est:p.estado==="CERRADA"||p.cerrado?"final":(p.jugados?("hoyo "+p.jugados):"por salir")});
  const tramo=(d,h)=>`<div class="tw"><table class="tarjeta${p.modalidad==="LAGUNEADA"?" gbkt":""}"><thead>
    <tr><th class="l">Hoyo</th>${[...Array(h-d+1)].map((_,i)=>`<th>${d+i}</th>`).join("")}<th>${d===1?"Ida":"Vta"}</th></tr>
    <tr><th class="l">Par</th>${[...Array(h-d+1)].map((_,i)=>`<th>${par[d-1+i]}</th>`).join("")}<th>${par.slice(d-1,h).reduce((a,b)=>a+b,0)}</th></tr></thead><tbody>
    ${J.map(j=>`<tr><td class="l" style="font-weight:600;color:var(--${color(j)})">${esc(nomAm(j.id))}</td>
      ${[...Array(h-d+1)].map((_,i)=>{ const k=d-1+i, v=j.golpes[k];
        const hk=p.hoyos[k]==null?"":String(p.hoyos[k]);
        const gano = p.modalidad==="FOURBALL" ? hk===j.lado : (hk!=="=" && hk.split("+").includes(String(j.id)));   /* exacto: "1" no gana cuando ganó "12" */
        return `<td class="${pkA.has(j.id+"|"+(k+1))?"pdc":""} ${claseGolpe(j.rep,k)}">${v==null?"·":(p.modalidad==="LAGUNEADA"?`<span class="sc gbk ${formaGolpe(v,par[k])}">${v}</span>`:`<span class="sc2 ${formaGolpe(v,par[k])} ${gano?"w-"+cl(j):""}">${v}</span>`)}</td>`; }).join("")}
      <td><b>${j.golpes.slice(d-1,h).filter(x=>x!=null).reduce((a,b)=>a+b,0)||""}</b></td></tr>`).join("")}
    ${p.modalidad==="MATCH"?`<tr class="clas"><td class="l">Estado</td>${[...Array(h-d+1)].map((_,i)=>{
      const k=d-1+i; if(p.hoyos[k]==null) return "<td></td>";
      let ac=0; for(let x=0;x<=k;x++){ if(p.hoyos[x]===J[0].id) ac++; else if(p.hoyos[x]===J[1].id) ac--; }
      return `<td class="${ac>0?"b":ac<0?"o":""}">${ac===0?"AS":Math.abs(ac)+"UP"}</td>`; }).join("")}<td></td></tr>`:""}
    ${filasLag(d,h)}
    </tbody></table></div>`;
  const editAm = !(puedo && p.estado!=="CERRADA") ? "" : (AM.editH && AM.ed
    ? `<div class="card"><h3>Handicaps de juego</h3><p class="small muted" style="margin:0 0 4px">Al guardar se recalculan todos los hoyos ya cargados.</p>
        ${editorHcp({ids:p.jugadores.map(j=>j.id),base:AM.ed.base,pct:AM.ed.pct,modo:AM.ed.modo,idx:p.cancha.idx,nombre:nomAm,pref:"e"})}
        <div class="row2" style="margin-top:10px"><button class="btn sec" id="cancelH">Cancelar</button><button class="btn" id="guardarH">Guardar handicaps</button></div></div>`
    : `<button class="btn sec" id="editH" style="margin:4px 0 10px">✎ Golpes: ${p.jugadores.map(j=>esc(nomAm(j.id))+" "+j.recibe).join(" · ")}${pctN(p.porcentaje)!==100?" ("+pctN(p.porcentaje)+" %)":""}</button>`);

/* resumen de amistosos para el perfil */
function resumenAm(id){
  if(!AM.lista||!AM.lista.length) return "";
  const mias=AM.lista.filter(p=>!p.torneo_id&&p.jugadores.some(j=>String(j.id)===String(id)));
  const inv=mias.filter(p=>p.jugadores.some(j=>esInv(j.id))).length;
  if(!mias.length) return "";
  const cerradas=mias.filter(p=>p.estado==="CERRADA");
  let g=0,e=0,pd=0;
  cerradas.forEach(p=>{
    const yo=p.jugadores.find(j=>String(j.id)===String(id));
    const lider=p.modalidad==="FOURBALL"?p.lider:String(p.lider||"");
    if(!lider) e++;
    else if(p.modalidad==="FOURBALL") (lider===yo.lado)?g++:pd++;
    else (String(lider)===String(id))?g++:pd++;
  });
  return `<h2>Amistosos</h2>
  <div class="kpis kpi4"><div class="kpi"><div class="big">${cerradas.length}</div><div class="lb">jugada${cerradas.length===1?"":"s"}</div></div>
    <div class="kpi"><div class="big verde">${g}</div><div class="lb">ganadas</div></div>
    <div class="kpi"><div class="big">${e}</div><div class="lb">empatadas</div></div>
    <div class="kpi"><div class="big rojo">${pd}</div><div class="lb">perdidas</div></div></div>
  ${(mias.length-cerradas.length)||inv?`<p class="small muted" style="margin:8px 4px 0">${mias.length-cerradas.length?`${mias.length-cerradas.length} en juego ahora (no cuentan hasta que se terminan). `:""}${inv?`${inv} con invitados.`:""}</p>`:""}
  <div class="card" style="margin-top:10px">${mias.slice(0,8).map(filaAm).join("")}</div>
  ${mias.length>8?`<p class="small" style="margin:8px 4px 0"><a class="lk" href="#/partidas">Ver todos en Estadísticas → Amistosos</a></p>`:""}`;
}

/* la Pre Ryder: los puntos que aportó durante las fechas del Tour */
function resumenPreRyder(id){
  if(!DB || !DB.ry || !DB.ry.length) return "";
  const mios=DB.ry.filter(m=>m.a===+id||m.b===+id);
  if(!mios.length) return "";
  const porT={};
  mios.forEach(m=>{ const p=porT[m.t]=porT[m.t]||{pts:0,g:0,e:0,l:0,n:0};
    const mio=m.a===+id?m.pa:m.pb;
    p.pts+=mio; p.n++;
    if(m.def==="EMPATE") p.e++; else if(m.def==="PARTIDO"||m.def==="ABANDONO"){ mio===3?p.g++:p.l++; } });
  const eq=equipo(+id);
  return `<h2>Pre Ryder Cup</h2>
  <p class="lead">Los puntos que aportaste a ${eq?EQNOM[eq]:"tu equipo"} durante las fechas del Tour.</p>
  <div class="lb"><div class="tw"><table><thead><tr><th class="l">Año</th><th>Partidos</th><th>Ganados</th><th>Empatados</th><th>Perdidos</th><th>Puntos</th></tr></thead>
    <tbody>${Object.entries(porT).sort((a,b)=>b[0]-a[0]).map(([t,p])=>`<tr><td class="l"><a class="lk b" href="#/ryderhist">${t}</a></td>
      <td>${p.n}</td><td class="c-bi">${p.g}</td><td>${p.e}</td><td class="c-10">${p.l}</td><td class="pts">${fmt(p.pts)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

  let cuerpo="";
  try{
    if(tab==="vivo" && r==="torneo") cuerpo = vistaTorneo();
    else if(tab==="jugar" && r==="torneo-nuevo") cuerpo = TN.canchaNueva ? vistaCanchaNueva() : vistaNuevoTorneo();

    else if(tab==="jugar") cuerpo = r==="armar" ? ((!A.evento&&!A.nuevo&&!A.cruce)?`<a class="atras" href="#/jugar">‹ Jugar</a>`:"")+(A.cruce?vistaCruce():vistaArmar())
      : r==="amistosos" ? vistaNuevoAm() : vistaJugar();
    else if(tab==="perfil") cuerpo = DB ? V.jugador(r==="inicio"?"":a) : cargandoStats();
    else {
      const arg = a;
      if(r==="cancha-nueva"){ AM.cnDestino="stats"; cuerpo = vistaCanchaNueva(); } else
      cuerpo = DB ? ((S.hist===false?`<div class="aviso">Sin conexión con la planilla: estás viendo ${S.histHora?"la última copia que bajó este teléfono, del "+new Date(S.histHora).toLocaleDateString("es-AR",{day:"numeric",month:"numeric",year:"numeric"}):"la copia que viene con la app, del "+SNAPSHOT_FECHA}. Puede estar desactualizada.</div>`:"")+(V[r]?V[r](arg):V.estadisticas(""))) : cargandoStats();
    }
  }catch(e){ cuerpo=`<h1>No se pudo mostrar esta página</h1><p class="lead">${esc(e.message)}</p>`; console.error(e); }
  const enVivo = S.est && S.est.evento;
  const pend = pendientes().length;
  app().innerHTML=`
  <div class="top"><img src="${LOGO.tour}" alt=""><div class="t">Chaqueta Tour</div>
    ${tab==="vivo"?`<button class="icon" id="recargar">↻</button>`:""}<button class="icon" id="menu">☰</button></div>
  ${tab==="stats"?`<nav class="nav2">${NAVSTATS.map(([k,t])=>`<a href="#/${k}" class="${r===k||(k==="estadisticas"&&r==="records")?"on":""}">${t}</a>`).join("")}</nav>`:""}
  ${pend?`<div class="pend">📴 ${pend} ${pend===1?"hoyo guardado en el teléfono":"hoyos guardados en el teléfono"}: se mandan solos al volver la señal · <button id="reintentar">Reintentar ahora</button></div>`:""}
  <main>${cuerpo}</main>
  <nav class="tabbar" aria-label="Secciones">
    <button data-go="#/perfil" class="${tab==="perfil"?"on":""}" aria-label="Perfil">${ICO.perfil}Perfil</button>
    <button data-go="#/estadisticas" class="${tab==="stats"?"on":""}" aria-label="Estadísticas">${ICO.stats}Estadísticas</button>
    <button data-go="#/jugar" class="${tab==="jugar"?"on":""}" aria-label="Jugar">${ICO.golfista}Jugar</button>
    <button data-go="#/vivo" class="${tab==="vivo"?"on":""}" aria-label="Vivo">${ICO.vivo}Vivo${(enVivo||(S.amVivo&&S.amVivo.length)||(S.toVivo&&S.toVivo.length))?`<i class="punto"></i>`:""}</button>
  </nav>
  <div class="drawer" id="drawer"><div class="dpanel">
    <div class="dhead">${DB?av(+j.id,"lg",true):`<span class="av lg ini">${esc((j.nombre||"?")[0])}</span>`}<div><b>${esc(j.nombre)}</b><div class="small" style="color:var(--gold)">${admin?"ADMINISTRADOR":"JUGADOR"}</div></div></div>
    <button id="tema">◐ Modo claro / oscuro</button>
    <button id="salir" style="color:var(--red)">→ Cerrar sesión</button>
    <div class="small muted" style="padding:14px 16px">${S.est&&S.est.momento?"Datos en vivo al "+new Date(S.est.momento).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):""}</div>
  </div></div>`;
  ligarShell(tab,r,a);
}
const render = pintar;
function ligarShell(tab,r,a){
  document.getElementById("menu").onclick=()=>document.getElementById("drawer").classList.add("on");
  document.getElementById("drawer").onclick=e=>{ if(e.target.id==="drawer") e.currentTarget.classList.remove("on"); };
  document.getElementById("salir").onclick=()=>{ api("salir",{},"GET",false); S.ses=null; try{localStorage.removeItem("ct-ses")}catch(e){} pintar(); };
  document.getElementById("tema").onclick=()=>{ const t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("ct-tema",t)}catch(e){} temaMeta(); pintar(); };
  const rc=document.getElementById("recargar"); if(rc) rc.onclick=()=>refrescar(true);
  const n2=document.querySelector(".nav2");
  if(n2){ const on=n2.querySelector("a.on"); if(on) n2.scrollLeft=on.offsetLeft-(n2.clientWidth-on.offsetWidth)/2;
    const fin=()=>{ n2.classList.toggle("alfin",n2.scrollLeft+n2.clientWidth>=n2.scrollWidth-4); n2.classList.toggle("alini",n2.scrollLeft<=4); };
    fin(); n2.onscroll=fin; }
  const rt=document.getElementById("reintentar");
  if(rt) rt.onclick=async()=>{ rt.textContent="Enviando…"; const x=await enviarPendientes(); S.err=x.enviados?"":(x.errores[0]||"Todavía sin señal"); await refrescar(true); if(AM.act) traerAmistoso(AM.act.partida_id); };
  document.querySelectorAll(".tabbar button").forEach(b=>b.onclick=()=>{ S.match=null; S.err=""; if(location.hash===b.dataset.go){ pintar(); scrollTo(0,0); } else location.hash=b.dataset.go; });
  const im=document.getElementById("irMatch");
  if(im) im.onclick=()=>{ const m=document.querySelector(".mrow[data-m]"); const id=m.dataset.m;
    const mm=S.est.matches.find(x=>x.match_id===id); location.hash="#/vivo"; setTimeout(()=>{ S.match=id; S.hoyo=Math.min(18,(mm.jugados||0)+1); pintar(); },0); };
  document.querySelectorAll("[data-irp]").forEach(b=>b.onclick=()=>{ location.hash="#/partida/"+b.dataset.irp; });
  if(tab==="vivo" || tab==="jugar"){ ligar(); ligarAmistosos(); ligarJugar(); ligarTorneo(); }
  else if(tab==="perfil" && DB) V.jugador.after(r==="inicio"?"":a);
  else if(tab==="stats" && r==="cancha-nueva") ligarAmistosos();
  else if(tab==="stats" && DB && V[r] && V[r].after) V[r].after(a);
}
/* ligar() del módulo en vivo sin volver a dibujar la cáscara */
function ligar(){
  const {r}=ruta();
  if(r==="armar"){ ligarArmar(); ligarBorrarEv(); return; }
  document.querySelectorAll(".mrow[data-m]").forEach(row=>row.onclick=()=>{
    S.match=row.dataset.m; const m=S.est.matches.find(x=>x.match_id===S.match);
    S.hoyo=Math.min(18,(m.jugados||0)+1); pintar();
  });
  const v=document.getElementById("volverV"); if(v) v.onclick=()=>{ S.match=null; pintar(); };
  document.querySelectorAll("[data-otro]").forEach(b=>b.onclick=()=>{ S.match=b.dataset.otro; S.err=""; pintar(); window.scrollTo(0,0); });   /* mismo hoyo, otro cruce de la salida */
  const ha=document.getElementById("hcpArmar");
  if(ha) ha.onclick=async()=>{ A.cruce=false; await abrirEvento(S.est.evento.evento_id); location.hash="#/armar"; };
  const mAct=S.est&&S.est.matches&&S.match&&S.est.matches.find(x=>x.match_id===S.match);
  if(mAct){
    const jug=(mAct.una_bola?[mAct.bags[0],mAct.resto[0]]:mAct.bags.concat(mAct.resto)).map(String);
    const tarS={}; mAct.tarjeta.forEach(t=>tarS[String(t.jugador_id)]=t.golpes);
    const hrA=(mAct.hora||"").trim(), salidaA=hrA?S.est.matches.filter(x=>x.sesion_id===mAct.sesion_id&&(x.hora||"").trim()===hrA):[mAct];
    ligarCarga({mid:mAct.match_id, jug, hoyo:S.hoyo, par:S.est.cancha.par, guardado:(j,i)=>(tarS[String(j)]||[])[i],
      nombre:j=>nom(j), avatarDe:j=>avatar(j,"sm"), enviar:()=>refrescar(true),
      premiosEn:h=>premiosHoyo(S.est.evento,h), premios:()=>S.est.premios,
      linea:()=>[...new Set(salidaA.flatMap(x=>x.bags.concat(x.resto)).map(String))],
      /* con varios cruces en la misma salida: después de guardar, pasa al siguiente cruce que le falte ese hoyo;
         cuando la salida completó el hoyo, vuelve al primer cruce en el hoyo siguiente */
      avanzar:h=>{
        const hr=(mAct.hora||"").trim();
        const salida=hr?S.est.matches.filter(x=>x.sesion_id===mAct.sesion_id&&(x.hora||"").trim()===hr):[mAct];
        if(salida.length<2){ S.hoyo=h; return; }
        const actual=h-1;
        const falta=x=>{ const js=(x.una_bola?[x.bags[0],x.resto[0]]:x.bags.concat(x.resto)).map(String), t={}, pd=pendDe(x.match_id);
          x.tarjeta.forEach(tt=>t[String(tt.jugador_id)]=tt.golpes); return js.some(j=>(t[j]||[])[actual-1]==null && pd[j+"|"+actual]==null); };
        const i=salida.findIndex(x=>x.match_id===mAct.match_id);
        const sig=salida.slice(i+1).concat(salida.slice(0,i)).find(falta);
        if(sig){ S.match=sig.match_id; S.hoyo=actual; } else { S.match=salida[0].match_id; S.hoyo=h; }
      }});
  }
  const ce=document.getElementById("cerrarEv");
  if(ce) ce.onclick=async()=>{
    if(!await confirmar("¿Cerrar el evento?","Queda guardado y deja de aparecer en vivo.")) return;
    ce.disabled=true; ce.textContent="Cerrando…";
    const x=await api("cerrarEvento",{token:tok(),evento_id:S.est.evento.evento_id},"POST");
    if(!x.ok){ S.err=x.error; ce.disabled=false; pintar(); return; }
    avisar("Evento cerrado",x.marcador.bags+" a "+x.marcador.resto+" · "+x.ganador);
    A.evento=null; A.sesiones=[]; await refrescar(true);
  };
}
function ligarBorrarEv(){
  const be=document.getElementById("borrarEv");
  if(!be) return;
  be.onclick=async()=>{
    const ev=A.evento||((S.est&&S.est.evento)?{evento_id:S.est.evento.evento_id,nombre:S.est.evento.nombre}:null);
    if(!ev) return;
    if(!await confirmar(`¿Borrar "${ev.nombre}"?`,"Se borran todos sus cruces y golpes. No se puede deshacer.",{ok:"Borrar",peligro:true})) return;
    be.disabled=true; be.textContent="Borrando…";
    const x=await api("borrarEvento",{token:tok(),evento_id:ev.evento_id},"POST");
    if(!x.ok){ S.err=x.error; be.disabled=false; pintar(); return; }
    A.evento=null; A.sesiones=[]; S.err=""; await refrescar(true);
  };
}
/* ─── arranque ─── */
async function refrescar(forzar){
  if(S.cargando && !forzar) return;
  S.cargando=true;
  try{
    if(pendientes().length){ const x=await enviarPendientes(); if(x.errores.length) S.err="No se pudo guardar: "+x.errores[0]; }
    const [r,av,tv]=await Promise.all([api("estado",{token:tok()}), api("amistososEnJuego",{}), api("torneosEnJuego",{})]);
    if(tv && tv.ok) S.toVivo=tv.torneos;
    if(r && r.ok){ S.est=r; S.estHora=Date.now(); S.estFalla=false; } else S.estFalla=true;
    if(av && av.ok) S.amVivo=av.partidas;
  } finally { S.cargando=false; }
  repintar();
}
/* no se redibuja mientras alguien escribe en un campo: se cerraría el teclado */
function repintar(){ const a=document.activeElement; if(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return; pintar(); }
async function cargarHistorico(){
  const {data,vivo,hora}=await cargar();
  if(!data){ S.histErr=true; pintar(); return; }
  DB=modelar(data); S.hist=vivo; S.histHora=hora; S.histErr=false; pintar();
}
const cargandoStats=()=>S.histErr?`<div class="aviso">No se pudieron cargar las estadísticas. Revisá la conexión: se vuelve a intentar sola cuando vuelve la señal.</div>`:`<div class="load">Cargando estadísticas…</div>`;
async function arrancar(){
  pintar();
  cargarHistorico();
  await refrescar(true);                               /* primero lo urgente: el juego en vivo */
  const c=await api("catalogo"); if(c && c.ok) S.cat=c;
  repintar();
  sbTiempoReal();
  traerAmistosos();
  { const {r,a}=ruta(); if(r==="partida" && a && !AM.act) traerAmistoso(a); if(r==="torneo" && a) traerTorneo(a); }
  api("misEventos",{jugador_id:S.ses.jugador.id}).then(r=>{ if(r&&r.ok){ S.eventos=r.eventos; repintar(); } });
  if(!window.__timer) window.__timer=setInterval(()=>{ const r=ruta().r; if(S.ses && !document.hidden){ if(r==="vivo"||r==="match") refrescar(); if(r==="partida"&&AM.act) traerAmistoso(AM.act.partida_id); if(r==="torneo"&&TN.act) traerTorneo(TN.act.torneo_id); } },30000);
  if(!window.__oyentes){ window.__oyentes=true;
    addEventListener("online",()=>{ if(!DB||S.hist===false) cargarHistorico(); if(S.ses) refrescar(true).then(()=>{ if(AM.act) traerAmistoso(AM.act.partida_id); }); });
    document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.ses) refrescar(true); });
  }
}
addEventListener("hashchange",()=>{ const {r,a}=ruta(); S.match=null;
  if(r==="armar"){ A.eventos=null; A.evento=null; A.nuevo=false; A.cruce=false; }
  if(r==="torneo" && a){ if(!TN.act || TN.act.torneo_id!==a) TN.act=null; traerTorneo(a); }
  if(r==="torneo-nuevo" && !TN.lineas && S.ses) tnNuevo();
  if(r==="partida"){ if(a && (!AM.act || AM.act.partida_id!==a)){ AM.act=null; AM.hoyo=1; AM.editH=false; traerAmistoso(a); } }
  else AM.act=null;
  if(r!=="amistosos"){ AM.nueva=false; AM.canchaNueva=false; }
  pintar(); scrollTo(0,0); });
if("serviceWorker" in navigator && location.protocol!=="file:") addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(function(){
  try{ const t=localStorage.getItem("ct-tema"); document.documentElement.setAttribute("data-theme",t||"dark"); }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
  temaMeta();
  recuperar();
  if(S.ses) arrancar(); else pintar();
})();

</script>
