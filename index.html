<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaqueta Tour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chaqueta Tour">
<meta name="application-name" content="Chaqueta Tour">
<meta name="description" content="El Chaqueta Tour en tu bolsillo: resultados en vivo, estadísticas e historia.">
<meta name="theme-color" content="#0A1F3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#F2F4F7; --card:#FFFFFF; --soft:#F6F8FB; --navy:#0A1F3D; --navy2:#16325C;
  --ink:#0E1726; --ink2:#4A5568; --ink3:#8792A6; --line:#E3E7EE;
  --red:#C8102E; --gold:#B8912F; --goldbg:rgba(184,145,47,.13); --green:#0F7B4F;
  --blue:#1D4ED8; --yellow:#C99200; --shadow:0 1px 2px rgba(10,31,61,.06),0 4px 14px rgba(10,31,61,.05);
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
:root{ --verde:#0F7B4F; --azul:#1D4ED8; --rojo:#C8102E;
  --c-ea:#7C3AED; --c-bi:#0F7B4F; --c-pa:#0E1726; --c-bo:#0E8FB0; --c-db:#1D4ED8; --c-10:#C8102E; }
:root[data-theme="dark"]{
  --verde:#4CC98E; --azul:#7AA7FF; --rojo:#FF5C6F;
  --c-ea:#B98CFF; --c-bi:#4CC98E; --c-pa:#FFFFFF; --c-bo:#6FD3EF; --c-db:#7AA7FF; --c-10:#FF5C6F;
  --page:#070F1C; --card:#0E1A2E; --soft:#132339; --navy:#050C18; --navy2:#16325C;
  --ink:#EAF0F8; --ink2:#A9B6C9; --ink3:#6E7C92; --line:#1E2F48;
  --red:#FF5C6F; --gold:#E2BE62; --goldbg:rgba(226,190,98,.14); --green:#4CC98E;
  --blue:#7AA7FF; --yellow:#F2C230; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px 2px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--cond);font-weight:700;font-size:23px;letter-spacing:.01em}
.brand i{width:30px;height:30px;display:grid;place-items:center;font-style:normal;flex:none}
.brand i img{width:100%;height:100%;object-fit:contain;display:block}
.src{margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.62);white-space:nowrap}
.src b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC98E;margin-right:6px;vertical-align:1px}
.src.off b{background:#E2BE62}
.nav{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:4px 10px 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:10px 11px 11px;font-size:14px;font-weight:600;text-decoration:none;color:rgba(255,255,255,.66);border-bottom:3px solid transparent;white-space:nowrap}
.nav a.on{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px 16px 70px}

/* tipografía */
h1,h2,h3{margin:0;line-height:1.1}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(30px,7.5vw,44px);letter-spacing:.005em}
h2{font-family:var(--cond);font-weight:700;font-size:25px;margin:34px 0 4px}
h3{font-size:15px;font-weight:700}
.lead{color:var(--ink2);margin:6px 0 18px;max-width:62ch}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.big{font-family:var(--cond);font-weight:700;line-height:1}

/* avatar con iniciales */
.av{flex:none;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;letter-spacing:.02em}
.av{position:relative}
.av img.ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .bd{position:absolute;right:-5px;bottom:-4px;width:16px;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.av.lg .bd{width:24px;right:-6px}
.av.xl .bd{width:32px;right:-8px;bottom:-6px}
.crest{height:22px;width:auto;vertical-align:-5px;margin-right:8px}
.teamline{display:inline-flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px 4px 6px}
.teamline img{height:24px;width:auto}
.score .logo{height:74px;width:auto;display:block;margin:0 auto 8px}
.av.lg{width:64px;height:64px;font-size:22px}
.av.xl{width:84px;height:84px;font-size:29px;box-shadow:0 0 0 3px var(--gold)}
.pl{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.pl .n{font-weight:600;white-space:nowrap}
.pl .n small{display:block;font-weight:400;font-size:12px;color:var(--ink3);margin-top:1px}
a.pl:hover .n{text-decoration:underline}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 17px}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.chead a{font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;white-space:nowrap}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .r{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.rows .r small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.rk{width:20px;color:var(--ink3);font-weight:700;font-size:13px}

/* campeón (portada) */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:22px 20px;display:grid;gap:18px;overflow:hidden;position:relative}
@media(min-width:760px){.hero{grid-template-columns:1.25fr 1fr;align-items:center;padding:28px}}
.hero .who{display:flex;align-items:center;gap:16px}
.hero .yr{font-size:13px;color:rgba(255,255,255,.7);font-weight:600}
.hero .nm{font-family:var(--cond);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:.95;margin-top:3px}
.hero .meta{color:rgba(255,255,255,.75);font-size:13.5px;margin-top:6px}
.hero .past{display:grid;gap:8px}
.hero .past a{display:flex;align-items:center;gap:12px;text-decoration:none;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.hero .past .y{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--gold);width:48px}
.hero .past .p{margin-left:auto;font-weight:700}
.jacket{position:absolute;right:-30px;top:-30px;width:210px;opacity:.10;pointer-events:none}
.jacket img{width:100%;height:auto;display:block}
.footmark{height:26px;width:auto;vertical-align:-8px;margin-right:8px;opacity:.85}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .big{font-size:34px}
.kpi .lb{font-size:13px;color:var(--ink2);margin-top:4px}

/* marcas personales con contexto */
.marks{display:grid;gap:10px}
@media(min-width:640px){.marks{grid-template-columns:1fr 1fr}}
.mark{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;box-shadow:var(--shadow)}
.mark .lb{font-size:13px;color:var(--ink2);font-weight:600}
.mark .big{font-size:32px;grid-row:span 2;align-self:center;text-align:right}
.mark .ctx{font-size:13px;color:var(--ink)}
.mark .ctx span{color:var(--ink3)}
.under{color:var(--red)}

/* controles */
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;text-decoration:none;font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.pills a.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pills a.on{background:var(--gold);border-color:var(--gold);color:#050C18}}
select{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:16px 0 14px;overflow-x:auto}
.tabs button{font:inherit;font-size:14.5px;font-weight:600;border:0;background:none;color:var(--ink3);padding:9px 0 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}

/* leaderboard */
.lb{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:600;color:var(--ink3);background:var(--soft)}
td.l,th.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.lead1 td{background:var(--goldbg)}
.ps{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--ink2);width:34px;text-align:left}
.topar{font-family:var(--cond);font-weight:700;font-size:20px}
.stk{position:sticky;left:0;background:var(--card);z-index:1}
tr.lead1 .stk{background:linear-gradient(var(--goldbg),var(--goldbg)),var(--card)}
th.stk{background:var(--soft);z-index:2}
.pts{font-weight:700}
.neg{color:var(--red)}
.cnt{background:var(--goldbg);font-weight:700}
.fin{box-shadow:inset 3px 0 0 var(--gold)}
.aus{color:var(--ink3)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--ink2);margin-left:6px;vertical-align:1px}
.chip.r{background:rgba(200,16,46,.1);color:var(--red)}
.chip.g{background:var(--goldbg);color:var(--gold)}
.chip.b{background:rgba(29,78,216,.1);color:var(--blue)}
th a{text-decoration:none;color:inherit}

/* tarjeta con notación de golf */
.card-sc th,.card-sc td{padding:6px 3px;text-align:center;min-width:29px}
.card-sc td.l,.card-sc th.l{text-align:left;padding-left:12px;min-width:0}
.sc{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;font-weight:600;font-size:13px}
.sc.nd{color:var(--ink3)}
.card-sc .sep{border-left:2px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* barra de resultados por hoyo */
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--soft);margin:10px 0 12px}
.stack i{display:block}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:13.5px}
@media(min-width:640px){.keys{grid-template-columns:repeat(4,1fr)}}
.keys div{display:flex;align-items:center;gap:8px}
.keys b{margin-left:auto}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* perfil */
.prof{background:var(--navy);color:#fff;border-radius:18px;padding:22px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.prof h1{color:#fff}
.prof .meta{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:5px}
.prof .ttl{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.prof .ttl span{font-size:12px;font-weight:700;background:var(--gold);color:#0A1F3D;border-radius:999px;padding:3px 10px}

/* gráficos */
.chart{min-height:300px}
.load{padding:48px 16px;text-align:center;color:var(--ink3);font-size:13px}

/* ryder */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;padding:20px 14px}
.score .t{font-family:var(--cond);font-weight:700;font-size:20px}
.score .n{font-family:var(--cond);font-weight:700;font-size:56px;line-height:1}
.bags{color:var(--blue)} .resto{color:var(--yellow)}

.note{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px}

/* campeones */
.seasons{display:grid;gap:12px}
@media(min-width:900px){.seasons{grid-template-columns:repeat(3,1fr)}}
.season{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.syr{display:block;background:var(--navy);color:#fff;font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.02em;padding:9px 16px;text-decoration:none}
.pod{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.pod.p1{padding:16px;background:linear-gradient(180deg,var(--goldbg),transparent);border-top:0}
.pod .pn{min-width:0;flex:1}
.pod .pn b{display:block;font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.1}
.pod.p1 .pn b{font-size:27px}
.pod .pn small{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px}
.pod .pp{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink3)}
.pod.p1 .pp{font-size:30px;color:var(--gold)}
.pod .pp sup{font-size:.55em;top:-.5em;position:relative}
.star{position:absolute;left:-5px;top:-5px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#3b2a00;font-size:10.5px;line-height:17px;text-align:center;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.av.lg .star{width:22px;height:22px;line-height:22px;font-size:13px}
.av.xl .star{width:26px;height:26px;line-height:26px;font-size:15px;left:-6px;top:-6px}

/* kpis centrados */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}.kpis.kpi4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;box-shadow:var(--shadow);text-align:center}
.kpi .big{font-size:30px;letter-spacing:-.01em}
.kpi .lb{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.3}

/* secciones y rankings */
h2.sec{font-size:29px;margin-top:38px;padding-top:18px;border-top:2px solid var(--line)}
h3.sub2{font-family:var(--cond);font-weight:700;font-size:19px;margin:22px 0 10px;color:var(--ink2);letter-spacing:.02em}
.cnt2{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink3)}
.rows.scroll{max-height:290px;overflow-y:auto}
.rows li .rk{width:22px;flex:none}
.rec{display:flex;align-items:center;gap:14px}
.rec .rv{font-family:var(--cond);font-weight:700;font-size:40px;color:var(--red);line-height:1}
.rec .rows{flex:1}
.agr{display:block}
.agtop{display:flex;align-items:center;gap:10px}
.agd{margin:6px 0 0 32px;display:grid;gap:3px}
.agl{font-size:12.5px;color:var(--ink2)}
.jk{display:inline-flex;gap:3px;vertical-align:-4px}
.jk img{height:20px;width:auto}
.lk{color:var(--blue);text-decoration:none}
.lk.b{font-weight:700}
.lk:hover{text-decoration:underline}

/* estadísticas */
.pill{display:inline-block;min-width:44px;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12.5px}
.pill.ok{background:rgba(15,123,79,.14);color:var(--green)}
.pill.mid{background:var(--goldbg);color:var(--gold)}
.pill.bad{background:rgba(200,16,46,.12);color:var(--red)}
.pcell{display:flex;align-items:center;gap:8px}
.big2{font-family:var(--cond);font-weight:700;font-size:19px}
tr.avg td{background:var(--soft);font-weight:600}
.card.hl{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}

/* handicap por año */
.hcpline{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.hcpi{flex:none;min-width:92px;background:var(--soft);border-radius:12px;padding:10px 12px;text-align:center}
.hcpi .hy{font-size:12px;color:var(--ink3);font-weight:600}
.hcpi .hv{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1}
.hcpi .hd{font-size:12px;font-weight:600;color:var(--ink3)}
.hcpi .hd.good{color:var(--green)} .hcpi .hd.bad{color:var(--red)}

/* mano a mano */
.vs2{font-weight:600;color:var(--ink2)}
.h2h{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.h2hs{background:var(--soft);border-radius:12px;padding:12px 8px}
.h2hs b{display:block;font-family:var(--cond);font-size:30px;line-height:1}
.h2hs span{font-size:12px;color:var(--ink2)}
.h2hs.win3{background:var(--goldbg)}
td.win{font-weight:700;color:var(--ink)}

/* ryder */
.ryd .champ{text-align:center;font-weight:700;margin:0;padding:0 14px 16px;color:var(--ink2);font-size:13.5px}
.rydbar{display:flex;height:10px;margin:0 16px 12px;border-radius:999px;overflow:hidden;background:var(--soft)}
.rydbar i.bags{background:var(--blue)} .rydbar i.resto{background:var(--yellow)}
.mvp{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mvpn{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;text-align:right}
.mvpn small{display:block;font-family:Inter,sans-serif;font-size:11.5px;font-weight:500;color:var(--ink3)}
.slots{display:grid;gap:7px}
.slot{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:8px}
.slot .sn{font-size:12px;color:var(--ink3);text-align:center;font-weight:600}
.slot .sb,.slot .sr{display:flex;align-items:center;gap:6px}
.slot .sb{justify-content:flex-end}
.slot i{height:16px;border-radius:5px;display:block;flex:0 0 auto;min-width:3px}
.slot i.bags{background:var(--blue)} .slot i.resto{background:var(--yellow)}
.slot .sn{background:var(--soft);border-radius:8px;padding:3px 0;font-family:var(--cond);font-size:15px;color:var(--ink2)}
.slot:hover .sn{background:var(--goldbg);color:var(--gold)}
.slot b{font-family:var(--cond);font-weight:700;font-size:15px;width:20px}
.slots{margin-top:4px}
.slothd{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;margin-bottom:8px;font-size:12px;font-weight:600}
.slothd .a{text-align:right;color:var(--blue)} .slothd .b2{text-align:left;color:var(--yellow)}
.slot b{font-size:12.5px;width:18px;text-align:center}
.rivl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vsm{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--ink3)}
.vsm.bags{color:var(--blue)} .vsm.resto{color:var(--yellow)}

/* canchas */
.cgrid{display:grid;gap:12px}
@media(min-width:720px){.cgrid{grid-template-columns:repeat(2,1fr)}}

function parseCSV(txt){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const h=rows[0].map(x=>x.trim());
  return rows.slice(1).filter(r=>r.some(x=>x!=="")).map(r=>{ const o={}; h.forEach((k,i)=>{ if(k) o[k]=r[i]??""; }); return o; });
}
function num(v){
  if(v===null||v===undefined) return null;
  if(typeof v==="number") return v;
  let s=String(v).trim().replace("−","-");
  if(s==="") return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d+,\d+$/.test(s)) s=s.replace(",",".");
  const n=Number(s); return isNaN(n)?null:n;
}
const txt = v => (v===null||v===undefined) ? "" : String(v).trim();

async function cargar(){
  const url=h=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(h)}`;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  try{
    const out={};
    await Promise.all(HOJAS.map(async h=>{
      const r=await fetch(url(h),{signal:ctl.signal,cache:"no-store"});
      if(!r.ok) throw new Error(h);
      const d=parseCSV(await r.text());
      if(!d.length) throw new Error(h+" vacía");
      out[h]=d;
    }));
    clearTimeout(to);
    if(!("pts_total" in out.RESULTADOS[0])||!("h1" in out.TARJETAS[0])) throw new Error("estructura");
    return {data:out,vivo:true};
  }catch(e){
    clearTimeout(to);
    return {data:SNAPSHOT,vivo:false};
  }
}

function modelar(S){
  const jug=new Map(), can=new Map(), fechas=[], res=[], tar=new Map(), cfg={}, eq=[], ry=[];
  S.JUGADORES.forEach(r=>{ const id=num(r.jugador_id); if(id) jug.set(id,{id,nombre:txt(r.nombre),apellido:txt(r.apellido),apodo:txt(r.apodo),tour:txt(r.nombre_tour),mat:txt(r.matricula_aag)}); });
  S.CANCHAS.forEach(r=>{ const id=num(r.cancha_id); if(!id) return;
    const par=[],idx=[]; for(let h=1;h<=18;h++){ par.push(num(r["par_"+h])); idx.push(num(r["idx_"+h])); }
    can.set(id,{id,nombre:txt(r.nombre),rec:txt(r.recorrido),par,idx,parT:par.reduce((a,b)=>a+(b||0),0)}); });
  S.CONFIG.forEach(r=>{ const t=num(r.temporada); (cfg[t]=cfg[t]||{})[txt(r.parametro)]=num(r.valor); });
  S.FECHAS.forEach(r=>{ const t=num(r.temporada); if(!t) return;
    fechas.push({t,fid:txt(r.fecha_id),n:num(r.numero),dia:txt(r.dia),cid:num(r.cancha_id),final:txt(r.es_final).toUpperCase()==="SI"}); });
  fechas.sort((a,b)=>b.t-a.t||a.n-b.n);
  S.RESULTADOS.forEach(r=>{ const t=num(r.temporada); if(!t) return;
    res.push({t,fid:txt(r.fecha_id),jid:num(r.jugador_id),est:txt(r.estado).toUpperCase(),hcp:num(r.hcp_juego),gross:num(r.gross),
      neto:num(r.neto),medal:num(r.pts_medal)||0,ld:num(r.long_drive)||0,ba:num(r.best_approach)||0,h1:num(r.hoyo_en_uno)||0,
      bg:num(r.bonus_sin_detalle)||0,bonus:num(r.pts_bonus)||0,total:num(r.pts_total)||0,obs:txt(r.observaciones)}); });
  S.TARJETAS.forEach(r=>{ const g=[]; for(let h=1;h<=18;h++) g.push(num(r["h"+h])); tar.set(txt(r.fecha_id)+"|"+num(r.jugador_id),g); });
  S.EQUIPOS.forEach(r=>eq.push({t:num(r.temporada),jid:num(r.jugador_id),eq:txt(r.equipo)}));
  S.RYDER.forEach(r=>{ if(!num(r.temporada)) return; ry.push({t:num(r.temporada),fid:txt(r.fecha_id),s:num(r.puesto),a:num(r.bags_id),b:num(r.resto_id),pa:num(r.pts_bags)||0,pb:num(r.pts_resto)||0,def:txt(r.definicion)}); });
  const F=new Map(fechas.map(f=>[f.fid,f]));
  const temporadas=[...new Set(fechas.map(f=>f.t))].sort((a,b)=>b-a);
  const jugadas=fechas.filter(f=>res.some(r=>r.fid===f.fid&&r.est!=="AUSENTE"));
  return {jug,can,fechas,F,res,tar,cfg,eq,ry,temporadas,jugadas};
}

function equipo(id){ if(!DB) return null; if(!DB._eq){ DB._eq={}; const tmax=Math.max(0,...DB.eq.map(e=>e.t||0));

function av(id,cls="",star=false){
  if(!DB) return `<span class="av ${cls} ini">·</span>`;

function pl(id,sub="",star=true){ return `<a class="pl" href="#/jugador/${id}">${av(id,"",star)}<span class="n">${esc(nom(id))}${sub?`<small>${sub}</small>`:""}</span></a>`; }
const jacket = n => `<span class="jk">${`<img src="${LOGO.tour}" alt="">`.repeat(n)}</span>`;

function leaderboard(fid){
  const R=DB.res.filter(r=>r.fid===fid);
  R.sort((a,b)=>{ const g=r=>r.est==="JUGO"?0:r.est==="AUSENTE"?2:1;
    return g(a)-g(b) || b.medal-a.medal || (a.neto??999)-(b.neto??999) || nom(a.jid).localeCompare(nom(b.jid)); });
  let pos=0;
  R.forEach((r,i)=>{ if(r.est!=="JUGO"){ r.pos=null; return; } const p=R[i-1];
    if(!p||p.est!=="JUGO"||p.medal!==r.medal||p.neto!==r.neto) pos=i+1; r.pos=pos; });
  return R;
}
function tabla(t){
  const fs=DB.fechas.filter(f=>f.t===t).sort((a,b)=>a.n-b.n);
  const c=DB.cfg[t]||{}; const m=c.mejores_regulares||fs.length; const ffin=c.fecha_final||0;
  const ids=[...new Set(DB.res.filter(r=>r.t===t).map(r=>r.jid))];
  const filas=ids.map(jid=>{
    const R=fs.map(f=>DB.res.find(x=>x.fid===f.fid&&x.jid===jid));
    const pts=R.map(r=>r?r.total:0), est=R.map(r=>r?r.est:"AUSENTE");
    const reg=fs.map((f,i)=>({i,v:pts[i],fin:f.n===ffin})).filter(x=>!x.fin).sort((a,b)=>b.v-a.v||a.i-b.i).slice(0,m);
    const cuenta=new Set(reg.map(x=>x.i)); fs.forEach((f,i)=>{ if(f.n===ffin) cuenta.add(i); });
    return {jid,pts,est,cuenta,total:[...cuenta].reduce((a,i)=>a+pts[i],0),suma:pts.reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>b.total-a.total||b.suma-a.suma);
  let p=0; filas.forEach((f,i)=>{ if(i===0||Math.abs(filas[i-1].total-f.total)>1e-6) p=i+1; f.pos=p; });
  return {fs,filas,m,ffin};
}
function vueltas(){
  if(!DB) return [];
  if(DB._v) return DB._v;
  const V=[];
  DB.res.forEach(r=>{ if(r.est!=="JUGO") return; const g=DB.tar.get(r.fid+"|"+r.jid); if(!g||g.some(x=>x==null)) return;
    const f=DB.F.get(r.fid), c=DB.can.get(f.cid); if(!c) return; V.push({r,f,c,g,gross:g.reduce((a,b)=>a+b,0)}); });
  return DB._v=V;
}
function tipoHoyo(g,p){ if(g==null) return "nd"; const d=g-p; return d<=-2?"ea":d===-1?"bi":d===0?"pa":d===1?"bo":"db"; }
function ganadores(){ if(DB._w) return DB._w; const w=[]; DB.jugadas.forEach(f=>{ leaderboard(f.fid).filter(r=>r.pos===1).forEach(r=>w.push({f,r})); }); return DB._w=w; }
function campeones(){ if(!DB) return []; if(DB._c) return DB._c; return DB._c=DB.temporadas.map(t=>{ const T=tabla(t); return {t,T,top:T.filas.slice(0,3)}; }); }
function titulos(){ if(!DB) return {}; if(DB._t) return DB._t; const m={}; campeones().forEach(c=>c.top.filter(x=>x.pos===1).forEach(x=>m[x.jid]=(m[x.jid]||0)+1)); return DB._t=m; }
const cuenta = arr => { const m={}; arr.forEach(k=>m[k]=(m[k]||0)+1); return Object.entries(m).map(([k,v])=>[+k,v]).sort((a,b)=>b[1]-a[1]||nom(a[0]).localeCompare(nom(b[0]))); };
function fechasGanadas(jid,t){ return ganadores().filter(x=>x.r.jid===jid&&(!t||x.f.t===t)).length; }

function statsTemp(t){
  const key="_st"+t; if(DB[key]) return DB[key];
  const ids=[...new Set(DB.res.filter(r=>r.t===t).map(r=>r.jid))];
  const filas=ids.map(jid=>{
    const jug=DB.res.filter(r=>r.t===t&&r.jid===jid&&presente(r));
    const V=vueltas().filter(v=>v.r.t===t&&v.r.jid===jid);
    const c={ea:0,bi:0,pa:0,bo:0,db:0}; V.forEach(v=>v.g.forEach((g,h)=>c[tipoHoyo(g,v.c.par[h])]++));
    const gs=V.map(v=>v.gross).sort((a,b)=>a-b);
    const hc=DB.res.filter(r=>r.t===t&&r.jid===jid&&r.hcp!=null)
      .sort((a,b)=>DB.F.get(a.fid).n-DB.F.get(b.fid).n).map(r=>r.hcp);
    const mej=gs.slice(0,MEJ_GROSS);
    const prom=gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:null;
    const pm=mej.length?mej.reduce((a,b)=>a+b,0)/mej.length:null;
    const hcp=hc.length?hc[hc.length-1]:null;   /* el handicap con el que cerró el año */
    return {jid,fechas:jug.length,vueltas:V.length,hoyos:V.length*18,c,prom,pm,hcp,dif:(pm!=null&&hcp!=null)?pm-72-hcp:null};
  }).filter(x=>x.vueltas>0);
  return DB[key]=filas;
}
function h2h(a,b){
  const res={fechas:0,gana:0,pierde:0,empata:0,det:[]};
  DB.jugadas.forEach(f=>{
    const ra=DB.res.find(r=>r.fid===f.fid&&r.jid===a), rb=DB.res.find(r=>r.fid===f.fid&&r.jid===b);
    if(!ra||!rb||ra.est!=="JUGO"||rb.est!=="JUGO") return;
    res.fechas++; const d=ra.neto-rb.neto;
    if(d<0) res.gana++; else if(d>0) res.pierde++; else res.empata++;
    res.det.push({f,na:ra.neto,nb:rb.neto});
  });
  const ry=DB.ry.filter(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a));
  res.ryder=ry.length?{n:ry.length,pa:ry.reduce((s,m)=>s+(m.a===a?m.pa:m.pb),0),pb:ry.reduce((s,m)=>s+(m.a===b?m.pa:m.pb),0)}:null;
  return res;
}
function rankFilas(arr,fv){
  const out=[]; let p=1;
  for(let i=0;i<arr.length;){
    const n=arr[i][1], grupo=arr.filter(x=>x[1]===n);
    grupo.forEach(([j],k)=>out.push(`<li><span class="rk">${k===0?p:""}</span>${pl(j)}<span class="r">${fv(n)}</span></li>`));
    i+=grupo.length; p+=grupo.length;
  }
  return out.join("");
}

/* medallero: oro, plata y bronce de todas las temporadas */
function medallero(){
  const M={};
  campeones().forEach(c=>c.top.forEach(x=>{
    const m=M[x.jid]=M[x.jid]||{o:0,p:0,b:0,años:[]};
    if(x.pos===1){m.o++;m.años.push(`🥇 ${c.t}`);} else if(x.pos===2){m.p++;m.años.push(`🥈 ${c.t}`);} else {m.b++;m.años.push(`🥉 ${c.t}`);}
  }));
  const L=Object.entries(M).map(([j,m])=>({jid:+j,o:m.o,p:m.p,b:m.b,años:m.años,tot:m.o+m.p+m.b}))
    .sort((a,b)=>b.o-a.o||b.p-a.p||b.b-a.b||nom(a.jid).localeCompare(nom(b.jid)));
  let pos=0;
  return `<h2>Medallero</h2>
  <p class="lead">Los podios de cada temporada: quién ganó la chaqueta y quiénes lo escoltaron. Tocá un jugador para ver su ficha.</p>
  <div class="lb"><div class="tw"><table><thead><tr><th class="l">#</th><th class="l">Jugador</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Total</th><th class="l">Temporadas</th></tr></thead>
    <tbody>${L.map((x,i)=>{ if(i===0||L[i-1].o!==x.o||L[i-1].p!==x.p||L[i-1].b!==x.b) pos=i+1;
      return `<tr class="${pos===1?"lead1":""}"><td class="l ps">${pos}</td><td class="l">${pl(x.jid)}</td>
      <td class="med o">${x.o||""}</td><td class="med p">${x.p||""}</td><td class="med b">${x.b||""}</td><td class="pts">${x.tot}</td>
      <td class="l small muted">${x.años.join(" · ")}</td></tr>`; }).join("")}</tbody></table></div></div>`;
}
function kpisTour(){
  const V=vueltas(), hoyos=V.length*18;
  const c={ea:0,bi:0,pa:0,bo:0,db:0}; V.forEach(v=>v.g.forEach((g,h)=>c[tipoHoyo(g,v.c.par[h])]++));
  const K=[[DB.temporadas.length,"temporadas"],[DB.jugadas.length,"fechas jugadas"],[V.length,"vueltas completas"],
           [DB.can.size,"recorridos"],[hoyos.toLocaleString("es-AR"),"hoyos jugados"],[c.ea+c.bi,"birdies o mejor"]];
  return `<div class="kpis">${K.map(([v,l])=>`<div class="kpi"><div class="big">${v}</div><div class="lb">${l}</div></div>`).join("")}</div>`;
}
function bloqueRecords(){
  const V=vueltas();
  const donde=v=>`${v.f.t} · Fecha ${v.f.n} · ${canNom(v.f.cid)}`;
  const top3=(arr,val,dir,fv=v=>v,sub=donde)=>{
    const s=[...arr].sort((a,b)=>dir*(val(a)-val(b)));
    const out=[]; let p=1,i=0;
    while(i<s.length&&p<=3){ const n=val(s[i]), g=s.filter(x=>val(x)===n);
      g.forEach((x,k)=>out.push(`<li><span class="rk">${k===0?p:""}</span>${pl(x.r.jid,sub(x))}<span class="r">${fv(n)}</span></li>`));
      i+=g.length; p+=g.length; }
    return `<ul class="rows cmp fix3">${out.join("")}</ul>`;
  };
  const nine=[]; V.forEach(v=>{ nine.push({...v,val:v.g.slice(0,9).reduce((a,b)=>a+b,0),lado:"Primeros 9"}); nine.push({...v,val:v.g.slice(9).reduce((a,b)=>a+b,0),lado:"Últimos 9"}); });
  const bir=v=>v.g.filter((g,h)=>g<v.c.par[h]).length, par=v=>v.g.filter((g,h)=>g<=v.c.par[h]).length;
  const racha=v=>{ let b=0,c=0; v.g.forEach((g,h)=>{ c=g<=v.c.par[h]?c+1:0; b=Math.max(b,c); }); return b; };
  const uno=(arr,val,dir,fv=v=>v,sub=donde,col="")=>{ const m=dir<0?Math.max(...arr.map(val)):Math.min(...arr.map(val));
    const w=arr.filter(x=>val(x)===m);
    return `<div class="rec"><div class="rv ${col}">${fv(m)}</div><ul class="rows cmp">${w.map(x=>`<li>${pl(x.r.jid,sub(x))}</li>`).join("")}</ul></div>`; };
  const hoyos=[]; V.forEach(v=>v.g.forEach((g,h)=>hoyos.push({...v,h,g,p:v.c.par[h]})));
  const ag=hoyos.filter(x=>x.g<=x.p-2), ases=hoyos.filter(x=>x.g===1);
  const agPorJ=cuenta(ag.map(x=>x.r.jid));

  const W=ganadores(); const tops=[]; DB.jugadas.forEach(f=>leaderboard(f.fid).forEach(r=>{ if(r.pos&&r.pos<=3) tops.push(r.jid); }));

  return `
  <h3 class="sub2">Las mejores vueltas</h3>
  <div class="grid g3">
    <div class="card pad"><h3>Mejor gross</h3>${top3(V,v=>v.gross,1)}</div>
    <div class="card pad"><h3>Mejor neto</h3>${top3(V.filter(v=>v.r.neto!=null),v=>v.r.neto,1)}</div>
    <div class="card pad"><h3>Mejores 9 hoyos</h3>${top3(nine,v=>v.val,1,v=>v,x=>`${x.lado} · ${donde(x)}`)}</div>
  </div>
  <div class="grid g3" style="margin-top:12px">
    <div class="card pad"><h3>Más birdies en una vuelta</h3>${uno(V,bir,-1,v=>v,donde,"verde")}</div>
    <div class="card pad"><h3>Más pares o mejor en una vuelta</h3>${uno(V,par,-1,v=>v+"/18",donde,"cpar")}</div>
    <div class="card pad"><h3>Racha de pares o mejor</h3>${uno(V,racha,-1,v=>v+" hoyos",donde,"cpar")}</div>
  </div>
  <h3 class="sub2">Águilas y hoyos en uno</h3>
  <div class="card pad"><div class="chead"><h3>Águilas</h3><span class="cnt2">${ag.length}</span></div>
    <div class="agrid">${agPorJ.map(([j,n],i)=>`<div class="agc"><div class="agtop"><span class="rk">${i+1}</span>${pl(j)}<span class="agn">${n}</span></div><div class="agd">${agDet(j)}</div></div>`).join("")}</div></div>
  <div class="card pad h1card">${ases.length
      ?`<div class="chead"><h3>Hoyos en uno</h3><span class="cnt2">${ases.length}</span></div><ul class="rows cmp">${ases.map(x=>`<li>${pl(x.r.jid,`Hoyo ${x.h+1} · ${donde(x)}`)}</li>`).join("")}</ul>`

    ${cardRank("Cucharas de madera",cuenta(DB.res.filter(r=>presente(r)&&r.medal<0).map(r=>r.jid)),v=>`<span class="cuch">${v} 🥄</span>`,"Se la lleva el que juega y termina restando puntos.")}

      <ul class="rows scroll">${abw.map(r=>`<li>${pl(r.jid,ctx(DB.F.get(r.fid)))}<span class="r neg">${fmt(r.medal)}<small>${r.est==="WO"?"WO":"abandono"}</small></span></li>`).join("")}</ul></div>
  </div>`;
}

function reparto(hcp,idx){ const o=Array(18).fill(0); let r=hcp||0; while(r>0){ const t=Math.min(r,18); for(let i=0;i<18;i++) if(idx[i]<=t) o[i]++; r-=t; } return o; }
function gFecha(f){
  const c=DB.can.get(f.cid); const R=DB.res.filter(r=>r.fid===f.fid&&presente(r));
  const S=R.map(r=>{ const g=DB.tar.get(f.fid+"|"+r.jid)||[]; const rp=reparto(r.hcp,c.idx); let a=0,pa=0; const acc=[],tp=[];
    for(let h=0;h<18;h++){ pa+=c.par[h]; if(g[h]==null){acc.push(null);tp.push(null);continue;} a+=g[h]-rp[h]; acc.push(a); tp.push(a-pa); } return {r,acc,tp,g}; });
  const rk=S.map(()=>Array(18).fill(null));
  for(let h=0;h<18;h++){ const v=S.map((s,i)=>({i,v:s.acc[h]})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v); let p=0; v.forEach((x,k)=>{ if(k===0||x.v!==v[k-1].v) p=k+1; rk[x.i][h]=p; }); }
  const t=tema(), n=S.length; const fin=S.map((s,i)=>({i,p:rk[i][17]==null?99:rk[i][17]})).sort((a,b)=>a.p-b.p);
  Plotly.react("gF",fin.map(({i},k)=>({x:[...Array(18)].map((_,h)=>h+1),y:rk[i],name:nom(S[i].r.jid),type:"scatter",mode:"lines+markers",connectgaps:false,
    line:{width:k<3?3.2:1.6,color:k<3?[t.gold,t.navy,t.red][k]:t.pal[k%t.pal.length]},marker:{size:k<3?6:4},opacity:k<3?1:.7,
    customdata:S[i].tp.map((x,h)=>[x==null?"—":(x===0?"E":(x>0?"+":"")+x),S[i].g[h]==null?"—":S[i].g[h]]),
    hovertemplate:"<b>%{fullData.name}</b><br>Hoyo %{x} · puesto %{y}<br>Golpes: %{customdata[1]} · neto %{customdata[0]}<extra></extra>"})),
    base(t,{height:Math.max(420,200+n*16),margin:{l:34,r:10,t:10,b:40},xaxis:{dtick:1,gridcolor:t.grid,zeroline:false,title:{text:"Hoyo",font:{size:11}}},
      yaxis:{autorange:"reversed",dtick:1,gridcolor:t.grid,zeroline:false,range:[n+.5,.5]},legend:{orientation:"h",y:-.12,font:{size:11}}}),CFG);
}

/* ═══ Chaqueta Tour · en vivo ═══ */


const FORMATOS = {SINGLES:"Singles",FOURBALL:"Fourball (mejor bola)",FOURSOME:"Foursome (golpes alternos)",GREENSOME:"Greensome"};
let S = {ses:null, cat:null, est:null, tab:"vivo", match:null, hoyo:1, err:"", cargando:false};

/* ── llamadas al script ── */
/* si no hay señal, el golpe queda guardado en el teléfono y se reintenta solo */
function pendientes(){ try{ return JSON.parse(localStorage.getItem("ct-pend")||"[]"); }catch(e){ return []; } }
function guardarPend(l){ try{ localStorage.setItem("ct-pend",JSON.stringify(l)); }catch(e){} }
function encolar(g){ const l=pendientes(); const i=l.findIndex(x=>x.match_id===g.match_id&&String(x.jugador_id)===String(g.jugador_id)&&x.hoyo===g.hoyo);
  if(i>=0) l[i]=g; else l.push(g); guardarPend(l); }
async function enviarPendientes(){
  let l=pendientes(); if(!l.length) return 0;
  const quedan=[];
  for(const g of l){
    const r=await api("cargarGolpe",Object.assign({token:tok()},g),"POST");
    if(!r || !r.ok){ if(r && /Sin conexión/.test(r.error||"")) quedan.push(g); }
  }
  guardarPend(quedan);
  return l.length-quedan.length;
}
function sesionVencida(r){
  if(r && !r.ok && /Sesión vencida/i.test(r.error||"")){ S.ses=null; try{localStorage.removeItem("ct-ses")}catch(e){}
    S.err="Tu sesión venció, volvé a entrar"; pintar(); return true; }
  return false;
}
function apiURL(){ try{ return localStorage.getItem("ct-api")||API; }catch(e){ return API; } }
function fijarURL(u){ try{ localStorage.setItem("ct-api",u); }catch(e){} }
async function probarURL(u){
  try{
    const r=await fetch(u+"?accion=pinActivo",{cache:"no-store",redirect:"follow"});
    const t=await r.text();
    try{ const j=JSON.parse(t); return j.ok?{ok:true}:{ok:false,msg:"Responde, pero con error: "+(j.error||"")}; }
    catch(e){ return {ok:false,msg:/accounts\.google\.com|Sign in|Iniciar sesión/i.test(t)
      ? "Pide iniciar sesión: en la implementación, 'Quién tiene acceso' tiene que ser Cualquier usuario."
      : "Responde algo que no es JSON (HTTP "+r.status+"). Suele ser una implementación vieja o un error del script."}; }
  }catch(e){
    const j=await jsonp("pinActivo",{});          /* probamos la vía alternativa antes de dar por muerta la dirección */
    if(j.ok) return {ok:true,alt:true};
    return {ok:false,msg:"No contesta por ninguna vía: "+e.message+". Revisá que la dirección termine en /exec y esté publicada."};
  }
}
/* camino alternativo: trae la respuesta con una etiqueta <script>, que ningún navegador bloquea */
let _cbN=0;
function jsonp(accion,datos={},ms=12000){
  return new Promise(res=>{
    const cb="ctcb"+(++_cbN)+"_"+Date.now();
    const q=new URLSearchParams(Object.assign({accion,callback:cb},datos)).toString();
    const s=document.createElement("script");
    let listo=false;
    const limpiar=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); };
    window[cb]=j=>{ listo=true; limpiar(); res(j); };
    s.onerror=()=>{ if(!listo){ limpiar(); res({ok:false,error:"Sin conexión con el servidor",_via:"jsonp"}); } };
    setTimeout(()=>{ if(!listo){ limpiar(); res({ok:false,error:"El servidor tardó demasiado",_via:"jsonp"}); } },ms);
    s.src=apiURL()+"?"+q;
    document.head.appendChild(s);
  });
}
async function api(accion, datos={}, metodo="GET"){
  let r=null, txt="";
  try{
    if(metodo==="GET"){
      const q=new URLSearchParams(Object.assign({accion},datos)).toString();
      r=await fetch(apiURL()+"?"+q,{cache:"no-store",redirect:"follow"});
    } else {
      r=await fetch(apiURL(),{method:"POST",redirect:"follow",body:JSON.stringify(Object.assign({accion},datos)),
        headers:{"Content-Type":"text/plain;charset=utf-8"}});
    }
    txt=await r.text();
  }catch(e){
    S.diag=`La llamada directa falló (${e.message}). Probando por la vía alternativa…`;
    const j=await jsonp(accion,datos);           /* el navegador bloqueó la llamada: vamos por <script> */
    if(j.ok){ S.via="alternativa"; S.diag=`La llamada directa está bloqueada por el navegador (${e.message}); la app está usando la vía alternativa y funciona.`; }
    return j;
  }
  try{
    const j=JSON.parse(txt); sesionVencida(j);
    if(!j.ok) S.diag=`El servidor respondió: ${j.error||"error sin detalle"}`;
    return j;
  }catch(e){
    const alt=await jsonp(accion,datos);         /* respondió HTML: puede ser la redirección de Google */
    if(alt.ok){ S.via="alternativa"; return alt; }
    /* respondió algo que no es JSON: casi siempre una pantalla de Google (permisos) o un error del script */
    const pista = /accounts\.google\.com|Iniciar sesión|Sign in/i.test(txt) ? "La implementación pide iniciar sesión: en 'Quién tiene acceso' tiene que decir Cualquier usuario."
      : /Se ha producido un error|Error encountered|TypeError|ReferenceError/i.test(txt) ? "El script tiró un error al ejecutarse."
      : "El servidor respondió algo que no es JSON.";
    S.diag = `${pista} (HTTP ${r?r.status:"?"})\n\n${txt.replace(/<[^>]+>/g," ").replace(/\s+/g," ").slice(0,300)}`;
    return {ok:false,error:"El servidor respondió algo inesperado"};
  }
}

function ligarLogin(){
  const vc2=document.getElementById("verCfg");
  if(vc2) vc2.onclick=()=>{ S.cfgVisible=!S.cfgVisible; pintar(); };
  const pu=document.getElementById("probarUrl");
  if(pu) pu.onclick=async()=>{
    const u=document.getElementById("apiurl").value.trim().replace(/\/+$/,"");
    if(!/\/exec$/.test(u)){ S.cfgOk=false; S.cfgMsg="La dirección tiene que terminar en /exec"; pintar(); return; }
    pu.textContent="Probando…"; const r=await probarURL(u);
    S.cfgOk=r.ok; S.cfgMsg=r.ok?("Conexión correcta"+(r.alt?" (por la vía alternativa)":"")+", ya quedó guardada"):r.msg;
    if(r.ok){ fijarURL(u); S.err=""; }
    pintar();
  };
  const vd=document.getElementById("verDiag");
  if(vd) vd.onclick=()=>{ S.diagVisible=!S.diagVisible; pintar(); };
  if(L.paso===1){
    const i=document.getElementById("mat");
    const ir=async()=>{ L.matricula=i.value.trim(); if(!L.matricula) return;
      S.err="Entrando…"; pintar();
      const r=await api("buscar",{matricula:L.matricula});
      if(!r.ok){ S.err=r.error; pintar(); return; }
      L.jugador=r;
      const e=await api("login",{matricula:L.matricula,pin:""});   /* si el PIN está apagado, entra directo */
      if(e.ok){ S.ses={token:e.token,jugador:e.jugador}; guardar(); S.err=""; await arrancar(); return; }
      L.paso=2; L.pin=""; S.err=""; pintar(); };
    document.getElementById("seguir").onclick=ir;
    i.onkeydown=e=>{ if(e.key==="Enter") ir(); };
    i.focus();
  } else {
    document.querySelectorAll(".keys button").forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;
      if(k==="borrar") L.pin=L.pin.slice(0,-1);
      else if(k==="ok"||L.pin.length===4&&k!=="borrar"){ }
      else if(L.pin.length<4) L.pin+=k;
      if(L.pin.length===4 && k!=="borrar"){
        S.err="Entrando…"; pintar();
        const r=await api("login",{matricula:L.matricula,pin:L.pin});
        if(!r.ok){ S.err=r.error; L.pin=""; pintar(); return; }
        S.ses={token:r.token,jugador:r.jugador}; guardar(); S.err="";
        await arrancar(); return;
      }
      pintar();
    });
    document.getElementById("atras").onclick=()=>{ L.paso=1; L.pin=""; S.err=""; pintar(); };
  }
}

/* ═══ EN VIVO ═══ */
function estadoTxt(m){
  if(!m.jugados) return {t:"Por salir",c:""};
  const v=Math.abs(m.estado);
  if(m.cerrado){
    if(m.estado===0) return {t:"Empatado",c:"fin"};
    const rest=18-m.jugados;
    return {t:(rest>0? v+"&"+rest : v+" UP"),c:(m.estado>0?"b":"r")+" fin"};
  }
  if(m.estado===0) return {t:"AS",c:""};
  return {t:v+" UP",c:m.estado>0?"b":"r"};
}
function vistaVivo(){
  const e=S.est;
  if(!e||!e.evento) return `<h1>Todavía no hay nada en juego</h1>
    <p class="lead">Cuando el administrador arme la Ryder o una fecha, vas a verla acá en vivo.</p>
    <a class="btn sec" style="display:block;text-align:center;text-decoration:none;padding:14px" href="${HIST}">Ver las estadísticas históricas</a>`;
  const B=e.marcador.bags, R=e.marcador.resto, tot=Math.max(B+R,0.001);
  const porSes={};
  e.matches.forEach(m=>{ (porSes[m.sesion_id]=porSes[m.sesion_id]||[]).push(m); });
  return `
  <div class="marcador">
    <div class="n"><span class="b">${B}</span> <span class="muted" style="font-size:.45em">a</span> <span class="r">${R}</span></div>
    <div class="eq"><span class="b">Bags Boys</span><span class="r">Resto del Mundo</span></div>
    <div class="barra"><i class="b" style="width:${B/tot*100}%"></i><i class="r" style="width:${R/tot*100}%"></i></div>
    <div class="small muted" style="margin-top:8px">${esc(e.evento.nombre)} · ${esc(e.cancha.nombre||"")}${e.cancha.recorrido?" "+esc(e.cancha.recorrido):""}</div>
  </div>
  ${e.sesiones.map(s=>{
    const ms=(porSes[s.sesion_id]||[]).sort((a,b)=>Number(a.nro)-Number(b.nro));
    if(!ms.length) return "";
    return `<div class="sec-h"><span class="f">${esc(s.nombre)}</span><span class="pill">${FORMATOS[s.formato]||s.formato}</span></div>
    <div class="card">${ms.map(m=>{ const st=estadoTxt(m);
      return `<div class="mrow" data-m="${m.match_id}">
        <div class="lado"><div class="pj">${m.bags.map(j=>avatar(j)).join("")}<div class="nm">${m.bags.map(j=>esc(nom(j))).join("<br>")}<small>${m.hora?esc(m.hora):""}</small></div></div></div>
        <span class="est ${st.c}">${st.t}</span>
        <div class="lado r"><div class="pj r">${m.resto.map(j=>avatar(j)).join("")}<div class="nm">${m.resto.map(j=>esc(nom(j))).join("<br>")}<small>${m.jugados?("hoyo "+m.jugados):""}</small></div></div></div>
      </div>`; }).join("")}</div>`;
  }).join("")}
  <p class="small muted" style="margin-top:14px">Se actualiza solo cada 20 segundos. Tocá un cruce para ver la tarjeta y cargar golpes.</p>
  ${S.ses.jugador.rol==="admin"&&e.evento.estado==="EN_JUEGO"?`<button class="btn sec" id="cerrarEv" style="margin-top:8px">Cerrar el evento y guardarlo</button>`:""}
  ${S.ses.jugador.rol==="admin"&&e.evento.estado==="BORRADOR"?`<div class="aviso">Este evento todavía está en borrador: solo lo ves vos. Empezalo desde la pestaña Armar.</div>`:""}`;
}
function vistaMatch(){
  const e=S.est, m=e.matches.find(x=>x.match_id===S.match);
  if(!m) { S.match=null; return vistaVivo(); }
  const par=e.cancha.par, st=estadoTxt(m);
  const unaBola=m.una_bola;
  const jug=unaBola?[m.bags[0],m.resto[0]]:m.bags.concat(m.resto);
  const nombreLado=j=>unaBola?(String(j)===String(m.bags[0])?m.bags.map(nom).join(" / "):m.resto.map(nom).join(" / ")):nom(j);
  const tar={}; m.tarjeta.forEach(t=>tar[String(t.jugador_id)]=t.golpes);
  const aviso = unaBola?`<div class="aviso">En ${FORMATOS[m.formato]} la pareja juega una sola bola: se carga un resultado por equipo.</div>`:"";
  const puedo = S.ses.jugador.rol==="admin" || jug.map(String).includes(String(S.ses.jugador.id));
  const tramo=(desde,hasta)=>`<div class="tw"><table><thead>
    <tr><th class="l">Hoyo</th>${[...Array(hasta-desde+1)].map((_,i)=>`<th>${desde+i}</th>`).join("")}<th>${desde===1?"Ida":"Vuelta"}</th></tr>
    <tr><th class="l">Par</th>${[...Array(hasta-desde+1)].map((_,i)=>`<th>${par[desde-1+i]}</th>`).join("")}<th>${par.slice(desde-1,hasta).reduce((a,b)=>a+b,0)}</th></tr></thead><tbody>
    ${jug.map(j=>{ const g=tar[String(j)]||[]; const lado=m.bags.map(String).includes(String(j))?"b":"r";
      const suma=g.slice(desde-1,hasta).filter(x=>x!=null).reduce((a,b)=>a+b,0);
      return `<tr><td class="l" style="color:var(--${lado==="b"?"bags":"resto"});font-weight:600">${esc(nombreLado(j))}</td>
      ${[...Array(hasta-desde+1)].map((_,i)=>{ const h=desde-1+i, v=g[h];
        const gano = m.hoyos[h]===(lado==="b"?"A":"B");
        return `<td>${v==null?"·":(gano?`<span class="gb ${lado}">${v}</span>`:v)}</td>`; }).join("")}
      <td><b>${suma||""}</b></td></tr>`; }).join("")}
    <tr class="clas"><td class="l">Estado</td>${[...Array(hasta-desde+1)].map((_,i)=>{
      const h=desde-1+i; if(m.hoyos[h]==null) return "<td></td>";
      let ac=0; for(let k=0;k<=h;k++){ if(m.hoyos[k]==="A") ac++; else if(m.hoyos[k]==="B") ac--; }
      const txt=ac===0?"AS":Math.abs(ac)+"UP";
      return `<td class="${ac>0?"b":ac<0?"r":""}">${txt}</td>`; }).join("")}<td></td></tr>
    </tbody></table></div>`;
  const hoyoAct=S.hoyo;
  const carga = !puedo ? `<div class="aviso">Solo los jugadores de este cruce (o el administrador) pueden cargar golpes.</div>` : `
    <div class="card"><h3>Cargar el hoyo</h3>
      <div class="hoyosel">${[...Array(18)].map((_,i)=>{
        const hecho=jug.every(j=>(tar[String(j)]||[])[i]!=null);
        return `<button data-h="${i+1}" class="${hoyoAct===i+1?"on":""} ${hecho?"hecho":""}">${i+1}</button>`; }).join("")}</div>
      <div class="small muted">Hoyo ${hoyoAct} · par ${par[hoyoAct-1]}${(m.golpes_de&&Object.keys(m.golpes_de).length)?"":""}</div>
      ${jug.map(j=>{ const v=(tar[String(j)]||[])[hoyoAct-1];
        const rec=(m.golpes_de||{})[String(j)]||0;
        return `<div class="cargaj"><div class="cj">${avatar(j)}<div class="nm">${esc(nombreLado(j))}<span class="gp">${rec} golpe${rec===1?"":"s"}</span></div></div>
          <div class="step"><button data-j="${j}" data-d="-1">−</button><b id="g${j}">${v??par[hoyoAct-1]}</b><button data-j="${j}" data-d="1">+</button>
          <button class="btn ok2" data-guardar="${j}">${v!=null?"✓" : "Guardar"}</button></div></div>`; }).join("")}
      <div class="err">${esc(S.err)}</div></div>`;
  return `<button class="btn volver-vivo" id="volverV">← Volver al juego en vivo</button>
  <div class="mhead"><div class="mh">
    <div class="lado b"><div class="nm">${m.bags.map(j=>esc(nom(j))).join("<br>")}</div><div class="hc">Bags Boys</div></div>
    <div class="res"><b>${st.t}</b><span>${m.cerrado?"final":(m.jugados?"hoyo "+m.jugados:"por salir")}</span></div>
    <div class="lado r"><div class="nm">${m.resto.map(j=>esc(nom(j))).join("<br>")}</div><div class="hc">Resto del Mundo</div></div>
  </div></div>
  ${aviso}${tramo(1,9)}${tramo(10,18)}
  ${carga}`;
}

/* ═══ armado: enlaces ═══ */
function ligarArmar(){
  if(!S.cat) return;
  if(A.cruce){
    document.querySelectorAll(".jchip").forEach(b=>b.onclick=()=>{
      const l=b.dataset.l, j=b.dataset.j, cupo=A.sesiones[A.sesionAct].formato==="SINGLES"?1:2;
      const arr=A.sel[l], i=arr.indexOf(j);
      if(i>=0) arr.splice(i,1); else { if(arr.length>=cupo) arr.shift(); arr.push(j); }
      pintar();
    });
    document.getElementById("cancelarM").onclick=()=>{ A.cruce=false; A.sel={bags:[],resto:[]}; S.err=""; pintar(); };
    const hh=document.getElementById("hh"); if(hh) hh.onchange=()=>{ A.hora=hh.value; };
    const g=document.getElementById("guardarM");
    if(g) g.onclick=async()=>{
      const s=A.sesiones[A.sesionAct], hora=document.getElementById("hh").value;
      g.disabled=true; g.textContent="Guardando…";
      const r=await api("crearMatch",{token:tok(),sesion_id:s.sesion_id,nro:s.matches.length+1,
        bags_1:A.sel.bags[0]||"",bags_2:A.sel.bags[1]||"",resto_1:A.sel.resto[0]||"",resto_2:A.sel.resto[1]||"",hora},"POST");
      if(!r.ok){ S.err=r.error; g.disabled=false; pintar(); return; }
      s.matches.push({match_id:r.match_id,bags:A.sel.bags.slice(),resto:A.sel.resto.slice(),hora});
      A.hora=hora; A.cruce=false; A.sel={bags:[],resto:[]}; S.err=""; pintar();
    };
    return;
  }
  if(!A.evento){
    const c=document.getElementById("crear");
    if(c) c.onclick=async()=>{
      const nombre=document.getElementById("an").value.trim();
      const cid=document.getElementById("ac").value;
      c.disabled=true; c.textContent="Creando…";
      const r=await api("crearEvento",{token:tok(),temporada:new Date().getFullYear(),tipo:"RYDER",nombre,
        dia:document.getElementById("ad").value,cancha_id:cid,hcp_modo:document.getElementById("ah").value,
        pts_gana:document.getElementById("ap").value,pts_empata:document.getElementById("ae").value},"POST");
      if(!r.ok){ S.err=r.error; c.disabled=false; pintar(); return; }
      const can=S.cat.canchas.find(x=>String(x.id)===String(cid))||{};
      A.evento={evento_id:r.evento_id,nombre,hcp_modo:document.getElementById("ah").value,
        canchaNombre:can.nombre+(can.recorrido?" "+can.recorrido:"")};
      A.sesiones=[]; S.err=""; pintar();
    };
    return;
  }
  const a=document.getElementById("addses");
  if(a) a.onclick=async()=>{
    const nombre=document.getElementById("sn").value.trim()||("Sesión "+(A.sesiones.length+1));
    const formato=document.getElementById("sf").value;
    a.disabled=true; a.textContent="Agregando…";
    const r=await api("crearSesion",{token:tok(),evento_id:A.evento.evento_id,orden:A.sesiones.length+1,nombre,formato,hoyos:18},"POST");
    if(!r.ok){ S.err=r.error; a.disabled=false; pintar(); return; }
    A.sesiones.push({sesion_id:r.sesion_id,nombre,formato,matches:[]}); S.err=""; pintar();
  };
  document.querySelectorAll("[data-borrar]").forEach(b=>b.onclick=async()=>{
    if(!confirm("¿Borrar este cruce?")) return;
    const r=await api("borrarMatch",{token:tok(),match_id:b.dataset.borrar},"POST");
    if(!r.ok){ S.err=r.error; pintar(); return; }
    const s=A.sesiones[+b.dataset.s]; s.matches=s.matches.filter(x=>x.match_id!==b.dataset.borrar); pintar();
  });
  document.querySelectorAll("[data-auto]").forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.auto, s=A.sesiones[i], cupo=s.formato==="SINGLES"?1:2;
    const usados=new Set(); A.sesiones.forEach(x=>x.matches.forEach(m=>m.bags.concat(m.resto).forEach(j=>usados.add(String(j)))));
    const hcp=S.cat.hcp||{};
    const libres=l=>S.cat.jugadores.filter(j=>eqDe(j.id)===l&&!usados.has(String(j.id)))
      .sort((a,c)=>(hcp[String(a.id)]??99)-(hcp[String(c.id)]??99)).map(j=>String(j.id));
    const B=libres("bag"), Rr=libres("resto");
    const n=Math.floor(Math.min(B.length,Rr.length)/cupo);
    if(!n){ S.err="No quedan jugadores libres para armar más cruces"; pintar(); return; }
    const hora=prompt("Hora de salida del primer cruce (HH:MM)","09:00")||"09:00";
    if(!confirm(`Se van a armar ${n} cruces enfrentando por handicap, cada 10 minutos. ¿Seguimos?`)) return;
    b.disabled=true; b.textContent="Armando…";
    const [hh,mm]=hora.split(":").map(Number);
    for(let k=0;k<n;k++){
      const bg=B.slice(k*cupo,k*cupo+cupo), rs=Rr.slice(k*cupo,k*cupo+cupo);
      const t=new Date(2000,0,1,hh,(mm||0)+k*10);
      const h=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
      const r=await api("crearMatch",{token:tok(),sesion_id:s.sesion_id,nro:s.matches.length+1,
        bags_1:bg[0]||"",bags_2:bg[1]||"",resto_1:rs[0]||"",resto_2:rs[1]||"",hora:h},"POST");
      if(!r.ok){ S.err=r.error; break; }
      s.matches.push({match_id:r.match_id,bags:bg,resto:rs,hora:h});
    }
    pintar();
  });
  document.querySelectorAll("[data-ses]").forEach(b=>b.onclick=()=>{ A.sesionAct=+b.dataset.ses; A.cruce=true; A.sel={bags:[],resto:[]}; pintar(); });
  const act=document.getElementById("activar");
  if(act) act.onclick=async()=>{
    act.disabled=true; act.textContent="Empezando…";
    const r=await api("estadoEvento",{token:tok(),evento_id:A.evento.evento_id,estado:"EN_JUEGO"},"POST");
    if(!r.ok){ S.err=r.error; act.disabled=false; pintar(); return; }
    S.tab="vivo"; await refrescar(true);
  };
}

  const ai=document.getElementById("addInv");
  if(ai) ai.onclick=()=>{
    const cupo=AM.modalidad==="MATCH"?2:AM.modalidad==="P420"?3:4;
    if(AM.sel.length>=cupo){ S.err="Ya están todos los jugadores; sacá a alguno primero"; pintar(); return; }
    const n=prompt("Nombre del invitado"); if(!n||!n.trim()) return;
    const h=prompt("Handicap del invitado","18"); if(h===null) return;
    const id="INV:"+n.trim();
    AM.hcpInv[id]=Math.max(0,Math.min(54,+h||0)); AM.sel.push(id); S.err=""; pintar();
  };
  document.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{
    const j=b.dataset.am, cupo=AM.modalidad==="MATCH"?2:AM.modalidad==="P420"?3:4;
    const i=AM.sel.indexOf(j);
    if(i>=0) AM.sel.splice(i,1); else { if(AM.sel.length>=cupo) AM.sel.shift(); AM.sel.push(j); }
    pintar();
  });
  const cr=document.getElementById("crearAm");
  if(cr) cr.onclick=async()=>{
    cr.disabled=true; cr.textContent="Creando…";
    const lados = AM.modalidad==="FOURBALL" ? ["A","A","B","B"] : AM.modalidad==="MATCH" ? ["A","B"] : ["1","2","3"];
    const hcps=AM.sel.map(j=>esInv(j)?(AM.hcpInv[j]||0):((S.cat.hcp||{})[String(j)]||0)).join(",");
    const r=await api("crearAmistoso",{token:tok(),modalidad:AM.modalidad,cancha_id:AM.cancha||(S.cat.canchas[0]||{}).id,
      hcp_modo:AM.hcp_modo,p_bola:AM.p_bola,p_suma:AM.p_suma,jugadores:AM.sel.join(","),lados:lados.join(","),hcps},"POST");
    if(!r.ok){ S.err=r.error; cr.disabled=false; pintar(); return; }
    AM.nueva=false; AM.lista=null; AM.hoyo=1; await traerAmistoso(r.partida_id); traerAmistosos();
  };
  const v=document.getElementById("volverAm");
  if(v) v.onclick=()=>{ AM.act=null; traerAmistosos(); };
  document.querySelectorAll(".hoyosel button").forEach(b=>b.onclick=()=>{ AM.hoyo=+b.dataset.h; pintar(); });
  document.querySelectorAll(".step button[data-d]").forEach(b=>b.onclick=()=>{
    const el=document.getElementById("a"+b.dataset.j); if(el) el.textContent=Math.max(1,Math.min(15,+el.textContent+ +b.dataset.d)); });
  document.querySelectorAll("[data-guardaAm]").forEach(b=>b.onclick=async()=>{
    const j=b.dataset.guardaam||b.getAttribute("data-guardaAm"), g=+document.getElementById("a"+j).textContent;
    b.disabled=true; b.textContent="…";
    const r=await api("cargarGolpe",{token:tok(),match_id:AM.act.partida_id,jugador_id:j,hoyo:AM.hoyo,golpes:g},"POST");
    if(!r.ok){ S.err=r.error; b.disabled=false; pintar(); return; }
    S.err=""; await traerAmistoso(AM.act.partida_id);
  });
  const ca=document.getElementById("cerrarAm");
  if(ca) ca.onclick=async()=>{
    if(!confirm("¿Terminar la partida? Queda guardada en el historial.")) return;
    const r=await api("cerrarAmistoso",{token:tok(),partida_id:AM.act.partida_id},"POST");
    if(!r.ok){ S.err=r.error; pintar(); return; }
    AM.lista=null; await traerAmistoso(AM.act.partida_id); traerAmistosos();
  };
  const ba=document.getElementById("borrarAm");
  if(ba) ba.onclick=async()=>{
    if(!confirm("¿Borrar la partida y todos sus golpes?")) return;
    const r=await api("borrarAmistoso",{token:tok(),partida_id:AM.act.partida_id},"POST");
    if(!r.ok){ S.err=r.error; pintar(); return; }
    AM.act=null; AM.lista=null; traerAmistosos();
  };
}
/* resumen de amistosos para el perfil */
function resumenAm(id){
  if(!AM.lista||!AM.lista.length) return "";
  const mias=AM.lista.filter(p=>p.jugadores.some(j=>String(j.id)===String(id)));
  const inv=mias.filter(p=>p.jugadores.some(j=>esInv(j.id))).length;
  if(!mias.length) return "";
  const cerradas=mias.filter(p=>p.estado==="CERRADA");
  let g=0,e=0,pd=0;
  cerradas.forEach(p=>{
    const yo=p.jugadores.find(j=>String(j.id)===String(id));
    const lider=p.modalidad==="FOURBALL"?p.lider:String(p.lider||"");
    if(!lider) e++;
    else if(p.modalidad==="FOURBALL") (lider===yo.lado)?g++:pd++;
    else (String(lider)===String(id))?g++:pd++;
  });
  return `<h2>Amistosos</h2>
  <div class="kpis kpi4"><div class="kpi"><div class="big">${mias.length}</div><div class="lb">partidas</div></div>
    <div class="kpi"><div class="big verde">${g}</div><div class="lb">ganadas</div></div>
    <div class="kpi"><div class="big">${e}</div><div class="lb">empatadas</div></div>
    <div class="kpi"><div class="big rojo">${pd}</div><div class="lb">perdidas</div></div></div>
  ${inv?`<p class="small muted" style="margin:8px 4px 0">${inv} ${inv===1?"partida jugada":"partidas jugadas"} con invitados.</p>`:""}
  <div class="card pad" style="margin-top:10px"><ul class="rows">${mias.slice(0,5).map(p=>`<li><div class="small"><b>${MODAL[p.modalidad]}</b> · ${esc(p.cancha.nombre||"")}
    <div class="muted">${p.jugadores.map(j=>esc(nomAm(j.id))).join(" · ")}</div></div><span class="r">${esc(p.resumen||"—")}</span></li>`).join("")}</ul></div>`;
}

/* ═════════ CÁSCARA: ingreso, pestañas y ruteo ═════════ */
const NAVSTATS=[["estadisticas","Resumen"],["temporada","Temporadas"],["fecha","Fechas"],["jugador","Jugadores"],["ryderhist","Ryder"],["canchas","Canchas"]];
function ruta(){ const p=(location.hash||"#/inicio").split("/").filter(Boolean); return {r:(p[1]||"inicio"),a:decodeURIComponent(p[2]||""),b:decodeURIComponent(p[3]||"")}; }
const TABDE = r => ["vivo","match","armar","hcp"].includes(r) ? "vivo" : (r==="inicio"?"inicio":(r==="amistosos"?"amis":"stats"));

function vistaPerfil(){
  const id=S.ses.jugador.id;
  if(!DB) return `<div class="load">Cargando tus estadísticas…</div>`;
  const J=DB.jug.get(+id);
  if(!J) return `<h1>Hola</h1><p class="lead">Todavía no tenés estadísticas cargadas en el Tour.</p>`;
  const R=DB.res.filter(r=>r.jid===+id), P=R.filter(presente), VV=vueltas().filter(v=>v.r.jid===+id);
  const C=campeones(), tit=C.filter(c=>c.top[0]&&c.top[0].jid===+id).map(c=>c.t);
  const pod=C.map(c=>({t:c.t,f:c.T.filas.find(x=>x.jid===+id)})).filter(x=>x.f&&x.f.pos<=3&&x.f.pos>1);
  const wins=ganadores().filter(x=>x.r.jid===+id);
  const best=VV.length?VV.reduce((a,v)=>v.gross<a.gross?v:a):null;
  const bestN=VV.filter(v=>v.r.neto!=null).reduce((a,v)=>(!a||v.r.neto<a.r.neto)?v:a,null);
  const hcp=(S.est&&S.est.hcp&&S.est.hcp[String(id)])??(statsTemp(DB.temporadas[0]).find(x=>x.jid===+id)||{}).hcp;
  const prom=VV.length?VV.reduce((a,v)=>a+v.gross,0)/VV.length:null;
  const cuch=P.filter(r=>r.medal<0).length;
  const ultima5=[...VV].sort((a,b)=>b.f.t-a.f.t||b.f.n-a.f.n).slice(0,5);
  const miMatch=(S.est&&S.est.evento)?S.est.matches.find(m=>m.bags.concat(m.resto).map(String).includes(String(id))):null;
  return `
  <section class="prof">${av(+id,"xl",true)}<div><h1>${esc(J.tour)}</h1>
    <div class="meta">${esc(J.nombre)} ${esc(J.apellido)}${J.mat?` · matrícula ${esc(J.mat)}`:""}</div>
    ${equipo(+id)?`<div class="teamline"><img src="${LOGO[equipo(+id)]}" alt="">${EQNOM[equipo(+id)]}</div>`:""}
    ${tit.length||pod.length?`<div class="ttl">${tit.map(t=>`<span>Campeón ${t}</span>`).join("")}${pod.map(x=>`<span class="alt">${x.f.pos}° en ${x.t}</span>`).join("")}</div>`:""}</div></section>
  ${miMatch?`<div class="card hl" style="margin-top:12px"><div class="small muted">Estás jugando ahora</div>
    <div class="mrow" data-m="${miMatch.match_id}" style="border:0">
      <div class="lado"><div class="nm">${miMatch.bags.map(j=>esc(nom(j))).join("<br>")}</div></div>
      <span class="est ${estadoTxt(miMatch).c}">${estadoTxt(miMatch).t}</span>
      <div class="lado r"><div class="nm">${miMatch.resto.map(j=>esc(nom(j))).join("<br>")}</div></div></div>
    <button class="btn" id="irMatch">Cargar mi tarjeta →</button></div>`:""}
  <div class="kpis kpi4" style="margin-top:12px">
    <div class="kpi"><div class="big">${hcp!=null?fmt(hcp):"—"}</div><div class="lb">handicap</div></div>
    <div class="kpi"><div class="big">${wins.length}</div><div class="lb">fechas ganadas</div></div>
    <div class="kpi"><div class="big">${P.length}</div><div class="lb">fechas jugadas</div></div>
    <div class="kpi"><div class="big">${fmt(prom)}</div><div class="lb">gross promedio</div></div>
  </div>
  <h2>Tus mejores marcas</h2>
  <div class="marks">
    ${best?`<div class="mark"><div class="lb">Mejor vuelta</div><div class="big">${best.gross}</div><div class="ctx">${ctxLink(best.f)}</div></div>`:""}
    ${bestN?`<div class="mark"><div class="lb">Mejor neto</div><div class="big under">${bestN.r.neto}</div><div class="ctx">${ctxLink(bestN.f)}</div></div>`:""}
  </div>
  <h2>Tus últimas fechas</h2>
  <div class="lb"><div class="tw"><table><thead><tr><th class="l">Fecha</th><th class="l">Cancha</th><th>Gross</th><th>Neto</th><th>Puesto</th><th>Pts</th></tr></thead>
    <tbody>${ultima5.map(v=>{ const l=leaderboard(v.f.fid).find(x=>x.jid===+id);
      return `<tr><td class="l"><a class="lk b" href="#/fecha/${v.f.fid}">${v.f.t} F${v.f.n}</a></td><td class="l muted">${esc(canNom(v.f.cid))}</td>
      <td>${v.gross}</td><td>${v.r.neto??"—"}</td><td>${(l&&l.pos)?l.pos+"°":"—"}</td><td class="pts">${fmt(v.r.total)}</td></tr>`; }).join("")}</tbody></table></div></div>
  <div class="grid g2" style="margin-top:12px">
    <a class="card lkcard" href="#/jugador/${id}"><b>Ver tu ficha completa</b><span class="muted small">águilas, premios, mano a mano y todo tu historial</span></a>
    <a class="card lkcard" href="#/estadisticas"><b>Estadísticas del Tour</b><span class="muted small">medallero, récords, temporadas y canchas</span></a>
  </div>
  ${resumenAm(id)}
  ${cuch?`<p class="small muted" style="margin-top:12px">Tenés ${cuch} cuchara${cuch===1?"":"s"} de madera. Que no sume otra este año.</p>`:""}`;
}
V.inicio = vistaPerfil;
V.ryderhist = () => V.ryder();

/* ─── pintura general ─── */
function pintar(){
  try{ pintar_(); }
  catch(e){
    console.error(e);
    app().innerHTML=`<div style="padding:24px"><h1>Algo se rompió al dibujar la pantalla</h1>
      <p class="lead">${esc(e.message)}</p>
      <button class="btn" onclick="location.reload()">Recargar</button>
      <button class="btn sec" onclick="localStorage.clear();location.reload()">Salir y empezar de nuevo</button></div>`;
  }
}
function pintar_(){
  if(!S.ses){ app().innerHTML=vistaLogin(); ligarLogin(); return; }
  const {r,a}=ruta(), tab=TABDE(r), j=S.ses.jugador, admin=j.rol==="admin";
  let cuerpo="";
  try{
    if(tab==="amis") cuerpo = vistaAmistosos();
    else if(tab==="vivo") cuerpo = r==="armar" ? (A.cruce?vistaCruce():vistaArmar()) : r==="hcp" ? vistaHcp() : (S.match?vistaMatch():vistaVivo());
    else if(tab==="inicio") cuerpo = vistaPerfil();
    else cuerpo = DB ? (V[r]?V[r](a):V.estadisticas("")) : `<div class="load">Cargando estadísticas…</div>`;
  }catch(e){ cuerpo=`<h1>No se pudo mostrar esta página</h1><p class="lead">${esc(e.message)}</p>`; console.error(e); }
  const enVivo = S.est && S.est.evento;
  const pend = pendientes().length;
  app().innerHTML=`
  <div class="top"><img src="${LOGO.tour}" alt=""><div class="t">Chaqueta Tour</div>
    ${tab==="vivo"?`<button class="icon" id="recargar">↻</button>`:""}<button class="icon" id="menu">☰</button></div>
  ${tab==="stats"?`<nav class="nav2">${NAVSTATS.map(([k,t])=>`<a href="#/${k}" class="${r===k||(k==="estadisticas"&&r==="records")?"on":""}">${t}</a>`).join("")}</nav>`:""}
  ${tab==="vivo"&&admin?`<nav class="nav2">${[["vivo","En juego"],["armar","Armar"],["hcp","Handicaps"]].map(([k,t])=>`<a href="#/${k}" class="${r===k||(k==="vivo"&&r==="match")?"on":""}">${t}</a>`).join("")}</nav>`:""}
  ${pend?`<div class="pend">📴 ${pend} ${pend===1?"hoyo guardado en el teléfono":"hoyos guardados en el teléfono"}: se mandan solos al volver la señal · <button id="reintentar">Reintentar ahora</button></div>`:""}
  <main>${cuerpo}</main>
  <div class="tabs">
    <button data-go="#/vivo" class="${tab==="vivo"?"on":""}"><b>◉</b>Vivo${enVivo?`<i class="punto"></i>`:""}</button>
    <button data-go="#/inicio" class="${tab==="inicio"?"on":""}"><b>👤</b>Inicio</button>
    <button data-go="#/amistosos" class="${tab==="amis"?"on":""}"><b>⛳</b>Amistosos</button>
    <button data-go="#/estadisticas" class="${tab==="stats"?"on":""}"><b>📊</b>Estadísticas</button>
  </div>
  <div class="drawer" id="drawer"><div class="dpanel">
    <div class="dhead">${DB?av(+j.id,"lg",true):`<span class="av lg ini">${esc((j.nombre||"?")[0])}</span>`}<div><b>${esc(j.nombre)}</b><div class="small" style="color:var(--gold)">${admin?"ADMINISTRADOR":"JUGADOR"}</div></div></div>
    <a href="#/jugador/${j.id}">🏌 Mi ficha completa</a>
    <button id="tema">◐ Modo claro / oscuro</button>
    ${S.pin?`<button id="cpin">🔒 Cambiar mi PIN</button>`:""}
    <button id="salir" style="color:var(--red)">→ Cerrar sesión</button>
    <div class="small muted" style="padding:14px 16px">${S.est&&S.est.momento?"Datos en vivo al "+new Date(S.est.momento).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):""}</div>
  </div></div>`;
  ligarShell(tab,r,a);
}
const render = pintar;
function ligarShell(tab,r,a){
  document.getElementById("menu").onclick=()=>document.getElementById("drawer").classList.add("on");
  document.getElementById("drawer").onclick=e=>{ if(e.target.id==="drawer") e.currentTarget.classList.remove("on"); };
  document.getElementById("salir").onclick=()=>{ S.ses=null; try{localStorage.removeItem("ct-ses")}catch(e){} pintar(); };
  document.getElementById("tema").onclick=()=>{ const t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("ct-tema",t)}catch(e){} pintar(); };
  const cp=document.getElementById("cpin");
  if(cp) cp.onclick=async()=>{ const p=prompt("Nuevo PIN de 4 números"); if(!p) return;
    const x=await api("cambiarPin",{token:tok(),pin_nuevo:p},"POST"); alert(x.ok?"Listo, PIN cambiado":x.error); };
  const rc=document.getElementById("recargar"); if(rc) rc.onclick=()=>refrescar(true);
  const rt=document.getElementById("reintentar");
  if(rt) rt.onclick=async()=>{ rt.textContent="Enviando…"; const n=await enviarPendientes(); S.err=n?"":"Todavía sin señal"; await refrescar(true); };
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ S.match=null; S.err=""; location.hash=b.dataset.go; });
  const im=document.getElementById("irMatch");
  if(im) im.onclick=()=>{ const m=document.querySelector(".mrow[data-m]"); S.match=m.dataset.m;
    const mm=S.est.matches.find(x=>x.match_id===S.match); S.hoyo=Math.min(18,(mm.jugados||0)+1); location.hash="#/vivo"; };
  if(tab==="amis") ligarAmistosos();
  else if(tab==="vivo") ligar();
  else if(tab==="stats" && DB && V[r] && V[r].after) V[r].after(a);
}
/* ligar() del módulo en vivo sin volver a dibujar la cáscara */
function ligar(){
  const {r}=ruta();
  if(r==="armar"){ ligarArmar(); return; }
  if(r==="hcp"){ ligarHcp(); return; }
  document.querySelectorAll(".mrow[data-m]").forEach(row=>row.onclick=()=>{
    S.match=row.dataset.m; const m=S.est.matches.find(x=>x.match_id===S.match);
    S.hoyo=Math.min(18,(m.jugados||0)+1); pintar();
  });
  const v=document.getElementById("volverV"); if(v) v.onclick=()=>{ S.match=null; pintar(); };
  document.querySelectorAll(".hoyosel button").forEach(b=>b.onclick=()=>{ S.hoyo=+b.dataset.h; pintar(); });
  document.querySelectorAll(".step button[data-d]").forEach(b=>b.onclick=()=>{
    const el=document.getElementById("g"+b.dataset.j); el.textContent=Math.max(1,Math.min(15,+el.textContent+ +b.dataset.d)); });
  document.querySelectorAll("[data-guardar]").forEach(b=>b.onclick=async()=>{
    const j=b.dataset.guardar, g=+document.getElementById("g"+j).textContent;
    b.disabled=true; b.textContent="…";
    const datos={match_id:S.match,jugador_id:j,hoyo:S.hoyo,golpes:g};
    const x=await api("cargarGolpe",Object.assign({token:tok()},datos),"POST");
    if(!x.ok){
      if(/Sin conexión/.test(x.error||"")){ encolar(datos); S.err="Sin señal: el hoyo quedó guardado y se manda solo cuando vuelva"; }
      else S.err=x.error;
      b.disabled=false; pintar(); return; }
    S.err=""; await refrescar(true);
  });
  const ce=document.getElementById("cerrarEv");
  if(ce) ce.onclick=async()=>{
    if(!confirm("¿Cerrar el evento? Queda guardado y deja de aparecer en vivo.")) return;
    ce.disabled=true; ce.textContent="Cerrando…";
    const x=await api("cerrarEvento",{token:tok(),evento_id:S.est.evento.evento_id},"POST");
    if(!x.ok){ S.err=x.error; ce.disabled=false; pintar(); return; }
    alert("Evento cerrado: "+x.marcador.bags+" a "+x.marcador.resto+" · "+x.ganador);
    A.evento=null; A.sesiones=[]; await refrescar(true);
  };
}
function ligarHcp(){
  document.querySelectorAll(".step button[data-h]").forEach(b=>b.onclick=()=>{
    const el=document.getElementById("h"+b.dataset.j); el.textContent=Math.max(0,Math.min(36,+el.textContent+ +b.dataset.h)); });
  document.querySelectorAll("[data-fijar]").forEach(b=>b.onclick=async()=>{
    const j=b.dataset.fijar, v=+document.getElementById("h"+j).textContent;
    b.disabled=true; b.textContent="…";
    const x=await api("fijarHcp",{token:tok(),evento_id:S.est.evento.evento_id,jugador_id:j,hcp:v},"POST");
    if(!x.ok){ S.err=x.error; b.disabled=false; pintar(); return; }
    S.err=""; await refrescar(true);
  });
}

/* ─── arranque ─── */
async function refrescar(forzar){
  if(S.cargando && !forzar) return;
  S.cargando=true;
  if(pendientes().length) await enviarPendientes();
  const r=await api("estado",{token:tok()});
  if(r && r.ok) S.est=r;
  S.cargando=false; pintar();
}
async function cargarHistorico(){
  const {data,vivo}=await cargar();
  DB=modelar(data); S.hist=vivo; pintar();
}
async function arrancar(){
  pintar();
  cargarHistorico();
  traerAmistosos();
  const c=await api("catalogo"); if(c && c.ok) S.cat=c;
  const p=await api("pinActivo"); S.pin=!!(p&&p.pin);
  await refrescar(true);
  if(!window.__timer) window.__timer=setInterval(()=>{ if(S.ses && !document.hidden && TABDE(ruta().r)==="vivo") refrescar(); },45000);
  addEventListener("online",()=>{ if(S.ses) refrescar(true); });
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.ses) refrescar(true); });
}
addEventListener("hashchange",()=>{ S.match=null; if(TABDE(ruta().r)!=="amis"){ AM.act=null; AM.nueva=false; } pintar(); scrollTo(0,0); });
(function(){
  try{ const t=localStorage.getItem("ct-tema"); document.documentElement.setAttribute("data-theme",t||"dark"); }catch(e){ document.documentElement.setAttribute("data-theme","dark"); }
  recuperar();
  if(S.ses) arrancar(); else pintar();
})();

</script>
