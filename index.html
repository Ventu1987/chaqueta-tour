<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaqueta Tour</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chaqueta Tour">
<meta name="application-name" content="Chaqueta Tour">
<meta name="description" content="El Chaqueta Tour en tu bolsillo: resultados en vivo, estadísticas e historia.">
<meta name="theme-color" content="#0A1F3D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#F2F4F7; --card:#FFFFFF; --soft:#F6F8FB; --navy:#0A1F3D; --navy2:#16325C;
  --ink:#0E1726; --ink2:#4A5568; --ink3:#5E6A7D; --line:#E3E7EE;
  --red:#C8102E; --gold:#B8912F; --goldbg:rgba(184,145,47,.13); --green:#0F7B4F;
  --blue:#1D4ED8; --yellow:#C99200; --shadow:0 1px 2px rgba(10,31,61,.06),0 4px 14px rgba(10,31,61,.05);
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
:root{ --verde:#0F7B4F; --azul:#1D4ED8; --rojo:#C8102E;
  --c-ea:#7C3AED; --c-bi:#0F7B4F; --c-pa:#0E1726; --c-bo:#0E8FB0; --c-db:#1D4ED8; --c-10:#C8102E; }
:root[data-theme="dark"]{
  --verde:#4CC98E; --azul:#7AA7FF; --rojo:#FF5C6F;
  --c-ea:#B98CFF; --c-bi:#4CC98E; --c-pa:#FFFFFF; --c-bo:#6FD3EF; --c-db:#7AA7FF; --c-10:#FF5C6F;
  --page:#070F1C; --card:#0E1A2E; --soft:#132339; --navy:#050C18; --navy2:#16325C;
  --ink:#EAF0F8; --ink2:#A9B6C9; --ink3:#8D9AB0; --line:#1E2F48;
  --red:#FF5C6F; --gold:#E2BE62; --goldbg:rgba(226,190,98,.14); --green:#4CC98E;
  --blue:#7AA7FF; --yellow:#F2C230; --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 100px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.top .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px 2px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--cond);font-weight:700;font-size:23px;letter-spacing:.01em}
.brand i{width:30px;height:30px;display:grid;place-items:center;font-style:normal;flex:none}
.brand i img{width:100%;height:100%;object-fit:contain;display:block}
.src{margin-left:auto;font-size:11.5px;color:rgba(255,255,255,.62);white-space:nowrap}
.src b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC98E;margin-right:6px;vertical-align:1px}
.src.off b{background:#E2BE62}
.nav{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:4px 10px 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:10px 11px 11px;font-size:14px;font-weight:600;text-decoration:none;color:rgba(255,255,255,.66);border-bottom:3px solid transparent;white-space:nowrap}
.nav a.on{color:#fff;border-bottom-color:var(--gold)}
main{max-width:1080px;margin:0 auto;padding:20px 16px 70px}

/* tipografía */
h1,h2,h3{margin:0;line-height:1.1}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(30px,7.5vw,44px);letter-spacing:.005em}
h2{font-family:var(--cond);font-weight:700;font-size:25px;margin:34px 0 4px}
h3{font-size:15px;font-weight:700}
.lead{color:var(--ink2);margin:6px 0 18px;max-width:62ch}
.muted{color:var(--ink3)} .small{font-size:12.5px}
.big{font-family:var(--cond);font-weight:700;line-height:1}

/* avatar con iniciales */
.av{flex:none;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12.5px;color:#fff;letter-spacing:.02em}
.av{position:relative}
.av img.ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .bd{position:absolute;right:-5px;bottom:-4px;width:16px;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.av.lg .bd{width:24px;right:-6px}
.av.xl .bd{width:32px;right:-8px;bottom:-6px}
.crest{height:22px;width:auto;vertical-align:-5px;margin-right:8px}
.teamline{display:inline-flex;align-items:center;gap:8px;margin-top:9px;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px 4px 6px}
.teamline img{height:24px;width:auto}
.score .logo{height:74px;width:auto;display:block;margin:0 auto 8px}
.av.lg{width:64px;height:64px;font-size:22px}
.av.xl{width:84px;height:84px;font-size:29px;box-shadow:0 0 0 3px var(--gold)}
.pl{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.pl .n{font-weight:600;white-space:nowrap}
.pl .n small{display:block;font-weight:400;font-size:12px;color:var(--ink3);margin-top:1px}
a.pl:hover .n{text-decoration:underline}

/* tarjetas */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 17px}
.grid{display:grid;gap:12px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.chead a{font-size:13px;font-weight:600;color:var(--blue);text-decoration:none;white-space:nowrap}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .r{margin-left:auto;text-align:right;font-weight:700;white-space:nowrap}
.rows .r small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.rk{width:20px;color:var(--ink3);font-weight:700;font-size:13px}

/* campeón (portada) */
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:22px 20px;display:grid;gap:18px;overflow:hidden;position:relative}
@media(min-width:760px){.hero{grid-template-columns:1.25fr 1fr;align-items:center;padding:28px}}
.hero .who{display:flex;align-items:center;gap:16px}
.hero .yr{font-size:13px;color:rgba(255,255,255,.7);font-weight:600}
.hero .nm{font-family:var(--cond);font-weight:700;font-size:clamp(34px,9vw,52px);line-height:.95;margin-top:3px}
.hero .meta{color:rgba(255,255,255,.75);font-size:13.5px;margin-top:6px}
.hero .past{display:grid;gap:8px}
.hero .past a{display:flex;align-items:center;gap:12px;text-decoration:none;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.hero .past .y{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--gold);width:48px}
.hero .past .p{margin-left:auto;font-weight:700}
.jacket{position:absolute;right:-30px;top:-30px;width:210px;opacity:.10;pointer-events:none}
.jacket img{width:100%;height:auto;display:block}
.footmark{height:26px;width:auto;vertical-align:-8px;margin-right:8px;opacity:.85}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .big{font-size:34px}
.kpi .lb{font-size:13px;color:var(--ink2);margin-top:4px}

/* marcas personales con contexto */
.marks{display:grid;gap:10px}
@media(min-width:640px){.marks{grid-template-columns:1fr 1fr}}
.mark{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;box-shadow:var(--shadow)}
.mark .lb{font-size:13px;color:var(--ink2);font-weight:600}
.mark .big{font-size:32px;grid-row:span 2;align-self:center;text-align:right}
.mark .ctx{font-size:13px;color:var(--ink)}
.mark .ctx span{color:var(--ink3)}
.under{color:var(--red)}

/* controles */
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills a{flex:none;text-decoration:none;font-size:13.5px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}
.pills a.on{background:var(--navy);border-color:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pills a.on{background:var(--gold);border-color:var(--gold);color:#050C18}}
select{font:inherit;font-size:15px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;max-width:100%}

/* leaderboard */
.lb{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11.5px;font-weight:600;color:var(--ink3);background:var(--soft)}
td.l,th.l{text-align:left}
tbody tr:last-child td{border-bottom:0}
tr.lead1 td{background:var(--goldbg)}
.ps{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--ink2);width:34px;text-align:left}
.topar{font-family:var(--cond);font-weight:700;font-size:20px}
.stk{position:sticky;left:0;background:var(--card);z-index:1}
tr.lead1 .stk{background:linear-gradient(var(--goldbg),var(--goldbg)),var(--card)}
th.stk{background:var(--soft);z-index:2}
.pts{font-weight:700}
.neg{color:var(--red)}
.cnt{background:var(--goldbg);font-weight:700}
.fin{box-shadow:inset 3px 0 0 var(--gold)}
.aus{color:var(--ink3)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--ink2);margin-left:6px;vertical-align:1px}
.chip.r{background:rgba(200,16,46,.1);color:var(--red)}
.chip.g{background:var(--goldbg);color:var(--gold)}
.chip.b{background:rgba(29,78,216,.1);color:var(--blue)}
th a{text-decoration:none;color:inherit}

/* tarjeta con notación de golf */
.card-sc th,.card-sc td{padding:6px 3px;text-align:center;min-width:29px}
.card-sc td.l,.card-sc th.l{text-align:left;padding-left:12px;min-width:0}
.sc{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;font-weight:600;font-size:13px}
.sc.nd{color:var(--ink3)}
.card-sc .sep{border-left:2px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink2);margin:10px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* barra de resultados por hoyo */
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--soft);margin:10px 0 12px}
.stack i{display:block}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;font-size:13.5px}
@media(min-width:640px){.keys{grid-template-columns:repeat(4,1fr)}}
.keys div{display:flex;align-items:center;gap:8px}
.keys b{margin-left:auto}
.dot{width:10px;height:10px;border-radius:3px;flex:none}

/* perfil */
.prof{background:var(--navy);color:#fff;border-radius:18px;padding:22px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.prof h1{color:#fff}
.prof .meta{color:rgba(255,255,255,.72);font-size:13.5px;margin-top:5px}
.prof .ttl{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.prof .ttl span{font-size:12px;font-weight:700;background:var(--gold);color:#0A1F3D;border-radius:999px;padding:3px 10px}

/* gráficos */
.chart{min-height:300px}
.load{padding:48px 16px;text-align:center;color:var(--ink3);font-size:13px}

/* ryder */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;text-align:center;padding:20px 14px}
.score .t{font-family:var(--cond);font-weight:700;font-size:20px}
.score .n{font-family:var(--cond);font-weight:700;font-size:56px;line-height:1}
.bags{color:var(--blue)} .resto{color:var(--yellow)}

.note{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px}

/* campeones */
.seasons{display:grid;gap:12px}
@media(min-width:900px){.seasons{grid-template-columns:repeat(3,1fr)}}
.season{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.syr{display:block;background:var(--navy);color:#fff;font-family:var(--cond);font-weight:700;font-size:22px;letter-spacing:.02em;padding:9px 16px;text-decoration:none}
.pod{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.pod.p1{padding:16px;background:linear-gradient(180deg,var(--goldbg),transparent);border-top:0}
.pod .pn{min-width:0;flex:1}
.pod .pn b{display:block;font-family:var(--cond);font-weight:700;font-size:20px;line-height:1.1}
.pod.p1 .pn b{font-size:27px}
.pod .pn small{display:block;color:var(--ink2);font-size:12.5px;margin-top:3px}
.pod .pp{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink3)}
.pod.p1 .pp{font-size:30px;color:var(--gold)}
.pod .pp sup{font-size:.55em;top:-.5em;position:relative}
.star{position:absolute;left:-5px;top:-5px;width:17px;height:17px;border-radius:50%;background:var(--gold);color:#3b2a00;font-size:10.5px;line-height:17px;text-align:center;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.av.lg .star{width:22px;height:22px;line-height:22px;font-size:13px}
.av.xl .star{width:26px;height:26px;line-height:26px;font-size:15px;left:-6px;top:-6px}

/* kpis centrados */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}.kpis.kpi4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 10px;box-shadow:var(--shadow);text-align:center}
.kpi .big{font-size:30px;letter-spacing:-.01em}
.kpi .lb{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.3}

/* secciones y rankings */
h2.sec{font-size:29px;margin-top:38px;padding-top:18px;border-top:2px solid var(--line)}
h3.sub2{font-family:var(--cond);font-weight:700;font-size:19px;margin:22px 0 10px;color:var(--ink2);letter-spacing:.02em}
.cnt2{font-family:var(--cond);font-weight:700;font-size:20px;color:var(--ink3)}
.rows.scroll{max-height:290px;overflow-y:auto}
.rows li .rk{width:22px;flex:none}
.rec{display:flex;align-items:center;gap:14px}
.rec .rv{font-family:var(--cond);font-weight:700;font-size:40px;color:var(--red);line-height:1}
.rec .rows{flex:1}
.agr{display:block}
.agtop{display:flex;align-items:center;gap:10px}
.agd{margin:6px 0 0 32px;display:grid;gap:3px}
.agl{font-size:12.5px;color:var(--ink2)}
.jk{display:inline-flex;gap:3px;vertical-align:-4px}
.jk img{height:20px;width:auto}
.lk{color:var(--blue);text-decoration:none}
.lk.b{font-weight:700}
.lk:hover{text-decoration:underline}

/* estadísticas */
.pill{display:inline-block;min-width:44px;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12.5px}
.pill.ok{background:rgba(15,123,79,.14);color:var(--green)}
.pill.mid{background:var(--goldbg);color:var(--gold)}
.pill.bad{background:rgba(200,16,46,.12);color:var(--red)}
.pcell{display:flex;align-items:center;gap:8px}
.big2{font-family:var(--cond);font-weight:700;font-size:19px}
tr.avg td{background:var(--soft);font-weight:600}
.card.hl{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}

/* handicap por año */
.hcpline{display:flex;gap:10px;overflow-x:auto;padding:4px 0}
.hcpi{flex:none;min-width:92px;background:var(--soft);border-radius:12px;padding:10px 12px;text-align:center}
.hcpi .hy{font-size:12px;color:var(--ink3);font-weight:600}
.hcpi .hv{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1.1}
.hcpi .hd{font-size:12px;font-weight:600;color:var(--ink3)}
.hcpi .hd.good{color:var(--green)} .hcpi .hd.bad{color:var(--red)}

/* mano a mano */
.vs2{font-weight:600;color:var(--ink2)}
.h2h{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.h2hs{background:var(--soft);border-radius:12px;padding:12px 8px}
.h2hs b{display:block;font-family:var(--cond);font-size:30px;line-height:1}
.h2hs span{font-size:12px;color:var(--ink2)}
.h2hs.win3{background:var(--goldbg)}
td.win{font-weight:700;color:var(--ink)}

/* ryder */
.ryd .champ{text-align:center;font-weight:700;margin:0;padding:0 14px 16px;color:var(--ink2);font-size:13.5px}
.rydbar{display:flex;height:10px;margin:0 16px 12px;border-radius:999px;overflow:hidden;background:var(--soft)}
.rydbar i.bags{background:var(--blue)} .rydbar i.resto{background:var(--yellow)}
.mvp{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mvpn{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1;text-align:right}
.mvpn small{display:block;font-family:Inter,sans-serif;font-size:11.5px;font-weight:500;color:var(--ink3)}
.slots{display:grid;gap:7px}
.slot{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:8px}
.slot .sn{font-size:12px;color:var(--ink3);text-align:center;font-weight:600}
.slot .sb,.slot .sr{display:flex;align-items:center;gap:6px}
.slot .sb{justify-content:flex-end}
.slot i{height:16px;border-radius:5px;display:block;flex:0 0 auto;min-width:3px}
.slot i.bags{background:var(--blue)} .slot i.resto{background:var(--yellow)}
.slot .sn{background:var(--soft);border-radius:8px;padding:3px 0;font-family:var(--cond);font-size:15px;color:var(--ink2)}
.slot:hover .sn{background:var(--goldbg);color:var(--gold)}
.slot b{font-family:var(--cond);font-weight:700;font-size:15px;width:20px}
.slots{margin-top:4px}
.slothd{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;margin-bottom:8px;font-size:12px;font-weight:600}
.slothd .a{text-align:right;color:var(--blue)} .slothd .b2{text-align:left;color:var(--yellow)}
.slot b{font-size:12.5px;width:18px;text-align:center}
.rivl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vsm{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--ink3)}
.vsm.bags{color:var(--blue)} .vsm.resto{color:var(--yellow)}

/* canchas */
.cgrid{display:grid;gap:12px}
@media(min-width:720px){.cgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.cgrid{grid-template-columns:repeat(3,1fr)}}
.ccard{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;text-decoration:none;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--gold)}

.accs{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}
@media(min-width:520px){.accs{grid-template-columns:1fr 1fr}}
.accs .btn{margin:0}

/* solapas internas (leaderboard / tarjetas / hoyo a hoyo) */
.segs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 12px;padding-bottom:2px}
.segs button{flex:none;font:inherit;font-size:13.5px;font-weight:600;padding:9px 15px;border-radius:999px;
  background:var(--card);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.segs button.on{background:var(--gold);border-color:var(--gold);color:#0A1F3D}

/* lista de eventos */
.ev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-top:10px;box-shadow:var(--shadow)}
.ev.en_juego{box-shadow:inset 0 0 0 2px var(--gold),var(--shadow)}
.ev.cerrado{opacity:.75}
.evtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.evtop b{font-family:var(--cond);font-weight:700;font-size:20px}
.chipev{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.chipev.en_juego{background:var(--goldbg);color:var(--gold)}
.chipev.borrador{background:var(--soft);color:var(--ink3)}
.chipev.cerrado{background:rgba(76,201,142,.15);color:var(--green)}
.evacc{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.evacc .btn{width:auto;margin:0;padding:9px 13px;font-size:13px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--goldbg);color:var(--gold)}

/* ajustes propios del módulo en vivo, sin pisar al histórico */
.av img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.av.ini{background:var(--gold);color:#0A1F3D;font-weight:700}
.av.inv{background:var(--ink3);color:#fff}
.lcard .load, main .load{padding:36px 10px;text-align:center;color:var(--ink3);font-size:13.5px}

/* ── cáscara unificada ── */
body{padding-bottom:calc(74px + env(safe-area-inset-bottom,0px))}
.nav2{position:sticky;top:54px;z-index:15;display:flex;gap:4px;overflow-x:auto;background:var(--page);
  border-bottom:1px solid var(--line);padding:0 10px}
.nav2 a{flex:none;padding:11px 12px;font-size:13.5px;font-weight:600;color:var(--ink3);text-decoration:none;border-bottom:3px solid transparent}
.nav2 a.on{color:var(--ink);border-bottom-color:var(--gold)}
.tabbar-viejo i.punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:#FF5C6F;margin-left:5px;animation:lat 1.6s infinite}
.lkcard{display:block;text-decoration:none}
.lkcard b{display:block;font-family:var(--cond);font-size:19px}
main{max-width:1080px;margin:0 auto;padding:16px 14px calc(100px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.top img{height:30px}.top .t{font-family:var(--cond);font-weight:700;font-size:19px;flex:1}
footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:var(--ink3);font-size:12px}
/* ── carga de hoyos (v3) ── */
.stc{font-weight:600;font-size:11.5px;color:var(--ink3)} .stc.ok{color:var(--green)} .stc.pen{color:#8A5E00} .stc.edit{color:var(--red)}
:root[data-theme="dark"] .stc.pen{color:var(--yellow)}
.step b[data-v]{min-width:34px;cursor:pointer} .step b.gris{color:var(--ink3);opacity:.75}
.hoyosel button.pen{border-color:#8A5E00;color:#8A5E00;border-width:2px}
:root[data-theme="dark"] .hoyosel button.pen{border-color:var(--yellow);color:var(--yellow)}
.guardarhoyo{margin-top:14px;width:100%;padding:15px;font-size:16px}
td.pdc{box-shadow:inset 0 -3px 0 #C99200}
/* golpes de handicap en la tarjeta y editor (v3.1) */
:root{--golpe:rgba(71,85,105,.17);--golpe2:rgba(71,85,105,.55);
  --bags:#1D4ED8;--bagsbg:rgba(29,78,216,.10);--resto:#8A5E00;--restofill:#E0A800;--restobg:rgba(224,168,0,.15);
  --rojo2:#C8102E;--rojo2bg:rgba(200,16,46,.09);
  --amar:#8A5E00;--amarfill:#E0A800;--amarbg:rgba(224,168,0,.15)}
:root[data-theme="dark"]{--golpe:rgba(203,213,225,.17);--golpe2:rgba(203,213,225,.6);
  --bags:#7AA7FF;--bagsbg:rgba(122,167,255,.14);--resto:#F2C230;--restofill:#F2C230;--restobg:rgba(242,194,48,.14);
  --rojo2:#FF5C6F;--rojo2bg:rgba(255,92,111,.13);
  --amar:#F2C230;--amarfill:#F2C230;--amarbg:rgba(242,194,48,.14)}
.gb.b{background:var(--bags);color:#fff}.gb.r{background:var(--restofill);color:#241a00}.gb.y{background:var(--amarfill);color:#241a00}.gb.o{background:var(--rojo2);color:#fff}
:root[data-theme="dark"] .gb.b,:root[data-theme="dark"] .gb.o{color:#050C18}
.c-b{color:var(--bags)!important}.c-r{color:var(--resto)!important}.c-y{color:var(--amar)!important}.c-o{color:var(--rojo2)!important}
.est.y{background:var(--amarbg);color:var(--amar)}.est.o{background:var(--rojo2bg);color:var(--rojo2)}
.mh .lado.o{background:var(--rojo2bg);text-align:right}
tr.clas td.o{color:var(--rojo2)}
.mh .lado .hc{margin-top:3px}
.p4.b{background:var(--bagsbg)}.p4.o{background:var(--rojo2bg)}.p4.y{background:var(--amarbg)}
.p4.b span,.p4.b b{color:var(--bags)}.p4.o span,.p4.o b{color:var(--rojo2)}.p4.y span,.p4.y b{color:var(--amar)}
.p4.lider{outline:2px solid var(--gold)}
.mrow.am .nm .vs{color:var(--ink3);font-weight:400;margin:0 4px}
/* equipos de uno o dos jugadores, siempre en una sola línea (v3.2) */
.avs{display:inline-flex;flex:none;align-items:center}
.avs .av+.av{margin-left:-10px;box-shadow:0 0 0 2px var(--card)}
.av.sm{width:28px;height:28px;font-size:11px}.av.sm .bd{width:12px;right:-4px;bottom:-3px}.av.sm .star{display:none}
.mh .lado{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.mh .lado.r,.mh .lado.o{align-items:flex-end}
.mh .lado .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .lado .nm.dos{font-size:17px}
.mh .lado .hc{margin-top:0}
.mrow .pj .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .pj .nm.nm3{white-space:normal;line-height:1.35}
.pareja{display:flex;flex-direction:column;gap:5px;min-width:0;max-width:100%}
.pareja .pp{display:flex;align-items:center;gap:7px;min-width:0}
.pareja .pp span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13.5px}
.mh .pareja .pp span{font-family:var(--cond);font-size:15.5px}
.mh .lado.r .pareja,.mh .lado.o .pareja,.pj.r .pareja{align-items:flex-end}
.mh .lado.r .pareja .pp,.mh .lado.o .pareja .pp,.pj.r .pareja .pp{flex-direction:row-reverse}
.pj.par{flex-direction:column;align-items:flex-start;gap:3px}
.pj.par.r{align-items:flex-end}
.pj.par small.ex{font-size:11.5px;color:var(--ink3)}
.mrow.am{grid-template-columns:1fr auto 1fr;row-gap:2px}
.mrow.am3{grid-template-columns:1fr auto}
.mrow .sub{grid-column:1/-1;font-size:11.5px;color:var(--ink3)}
/* PIN */
.salida{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.salida button{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:36px}
.salida button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .salida button.on{background:var(--gold);color:#050C18;border-color:var(--gold)}
.salida .vsx{font-weight:400;opacity:.7}
/* Jugar, Vivo y Perfil (v4) */
.jugar-grid{display:grid;gap:10px;margin-top:6px}
.elegidos{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.elg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px 3px 3px;font:600 13.5px/1.2 inherit;cursor:pointer}
.elg i{font-style:normal;color:var(--ink3);font-size:15px;margin-left:2px}
.jcard{display:grid;grid-template-columns:48px 1fr 18px;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:14px;
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink);font:inherit;cursor:pointer}
.jcard .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--goldbg);color:var(--gold)}
.jcard .ic svg{width:26px;height:26px}
.jcard b{display:block;font-size:16px}
.jcard span{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.4}
.jcard i{font-style:normal;font-size:22px;color:var(--ink3)}
.jcard:disabled{opacity:.6;cursor:default}
.jcard .tag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:999px;padding:1px 7px;vertical-align:2px}
.sec-t{font-family:var(--cond);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:22px 2px 8px}
.sec-t:first-of-type{margin-top:8px}
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:34px 18px;margin-top:10px;border:1px dashed var(--line);border-radius:16px;color:var(--ink2)}
.vacio svg{width:40px;height:40px;color:var(--ink3)}
.vacio b{color:var(--ink);font-size:16px}
.vacio .btn{margin-top:8px;text-decoration:none;display:inline-block;padding:12px 22px;width:auto}
.selj{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.selj select{flex:1;min-width:0}
.selj a{white-space:nowrap;font-weight:600;font-size:13.5px;color:var(--gold);text-decoration:none}
.atras{display:inline-flex;align-items:center;gap:4px;margin:0 0 10px;color:var(--ink2);font-weight:600;font-size:14px;text-decoration:none}
.rows li.irp{cursor:pointer}
#editH{white-space:normal;line-height:1.35;text-align:center;width:100%}
/* nada se sale de la pantalla (si algo se sale, el teléfono achica todo y la barra cambia de tamaño) */
html,body{overflow-x:hidden}
main{overflow-x:clip}
.grid > *{min-width:0}
.score > *{min-width:0}
.score .t{white-space:nowrap}
@media (max-width:600px){
  .score{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;grid-template-areas:"a b" "n n";row-gap:8px;padding:18px 12px 10px}
  .score > div:first-child{grid-area:a} .score > div:last-child{grid-area:b} .score > .n{grid-area:n}
  .score .logo{height:62px;margin-bottom:6px}
  .score .t{font-size:17px}
  .score .n{font-size:58px}
}
.card > .mrow{padding-left:12px;padding-right:12px}
/* encabezado del match (estilo tarjeta de golf): el que va ganando, pintado del nombre al resultado */
.mh2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}
.mh2.la{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)} .mh2.lb{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.ms{display:flex;align-items:center;gap:10px;padding:14px 12px;min-width:0}
.ms.der{text-align:right}
.ms .who{flex:1;min-width:0}
.ms .nm{font-family:var(--cond);font-weight:700;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .hc{font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms .rs{flex:none;text-align:center;min-width:54px}
.ms .rs b{display:block;font-family:var(--cond);font-size:27px;line-height:1;font-weight:700}
.ms .rs span{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;opacity:.85}
.ms.lid{color:#fff} .ms.lid .hc{color:inherit;opacity:.85}
.ms.f-b{background:#1D4ED8} .ms.f-o{background:#C8102E} .ms.f-r,.ms.f-y{background:#E0A800;color:#1d1500}
.mh2-par{grid-column:1/-1;display:flex;justify-content:center;align-items:baseline;gap:8px;padding:8px;border-top:1px solid var(--line);background:var(--soft)}
.mh2-par b{font-family:var(--cond);font-size:19px}
.mh2-par span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
/* filas de match: mismo criterio, el que va ganando pintado hasta el resultado */
.mrow.lidA,.mrow.lidB{position:relative;isolation:isolate;row-gap:10px}
.mrow > .lado:first-child{grid-row:1;grid-column:1} .mrow > .est{grid-row:1;grid-column:2} .mrow > .lado.r{grid-row:1;grid-column:3} .mrow > .sub{grid-row:2;grid-column:1/-1}
.mrow.lidA::before,.mrow.lidB::before{content:"";grid-row:1;align-self:stretch;z-index:-1;border-radius:12px;margin:-6px 0}
.mrow.lidA::before{grid-column:1/3;margin-left:-8px;margin-right:-6px}
.mrow.lidB::before{grid-column:2/4;margin-left:-6px;margin-right:-8px}
.mrow.f-b::before{background:#1D4ED8} .mrow.f-o::before{background:#C8102E} .mrow.f-r::before{background:#E0A800}
.mrow.lidA > .lado:first-child, .mrow.lidB > .lado.r{color:#fff}
.mrow.lidA > .lado:first-child *, .mrow.lidB > .lado.r *{color:inherit!important}
.mrow.f-r.lidA > .lado:first-child, .mrow.f-r.lidB > .lado.r{color:#1d1500}
.mrow.lidA > .est, .mrow.lidB > .est{background:transparent!important;color:#fff!important;border-color:transparent!important;font-size:16px}
.mrow.f-r.lidA > .est, .mrow.f-r.lidB > .est{color:#1d1500!important}
.mrow.lidA > .est.fin, .mrow.lidB > .est.fin{box-shadow:none!important;outline:none!important;border:0!important}
.mrow.lidA > .sub, .mrow.lidB > .sub{position:relative}
/* 4-2-0: puntos y diferencia con el último */
.p4 span small{font-size:.55em;font-weight:600;opacity:.75;margin-left:4px}
/* long drive y best approach */
.premio{display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px 12px;border-radius:12px;background:var(--goldbg);border:1px solid var(--gold)}
.premio svg{width:26px;height:26px;color:var(--gold);flex:none}
.premio b{display:block;font-size:13.5px;letter-spacing:.03em}
.premio span{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.premios-linea{font-size:12.5px;color:var(--ink2);margin-top:6px}
.premios-linea b{color:var(--ink)}
.hoja{position:fixed;inset:0;z-index:60;background:rgba(5,12,24,.62);display:flex;align-items:flex-end;justify-content:center}
.hoja .caja{width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.hoja h3{margin:0 0 2px;font-size:18px} .hoja p{margin:0 0 12px;color:var(--ink2);font-size:13.5px}
.hoja .ops{display:grid;gap:8px}
.hoja .ops button{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font:600 15px/1.2 inherit;cursor:pointer;text-align:left}
.hoja .ops button.lider{border-color:var(--gold)}
.hoja .ops button.nadie{justify-content:center;background:none}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
/* nueva cancha: ida y vuelta, cada una con hoyo, par y hándicap */
.cn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.cn-col{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.cn-col h3{margin:0;padding:10px 12px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:var(--soft);border-bottom:1px solid var(--line)}
.cn-hd,.cn-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;padding:5px 8px}
.cn-hd{font-size:10.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;padding-top:8px;padding-bottom:3px}
.cn-hd span{text-align:center}
.cn-row{border-top:1px solid var(--line);height:46px;padding-top:0;padding-bottom:0}
.cn-row .h{font-family:var(--cond);font-weight:700;font-size:16px;text-align:center;color:var(--ink2)}
.cn-row select{width:100%;min-width:0;height:34px;line-height:normal;padding:0 2px;font:700 15px/1 inherit;text-align:center;text-align-last:center;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.cn-row select.par3{background:rgba(15,123,79,.14);border-color:rgba(15,123,79,.4)}
.cn-row select.par5{background:rgba(29,78,216,.14);border-color:rgba(29,78,216,.4)}
.cn-row select.sinidx{color:var(--ink3);font-weight:500}
.cn-tot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-top:2px solid var(--line);background:var(--soft);font-size:13px;font-weight:600;color:var(--ink2)}
.cn-tot b{font-family:var(--cond);font-size:22px;color:var(--ink)}
.cn-total{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--navy);color:#fff}
.cn-total span{display:block;font-weight:700;font-size:15px}
.cn-total small{display:block;font-size:12.5px;opacity:.75;margin-top:2px}
.cn-total b{font-family:var(--cond);font-size:38px;line-height:1;color:var(--gold)}
.cn-aviso{color:var(--red)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hrow h1{margin:0}
.btn.chico{width:auto;padding:9px 14px;font-size:13.5px;margin:0;text-decoration:none;display:inline-block}
.crec{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);min-width:0}
.crec .ct{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);width:74px;flex:none;line-height:1.2}
.crec b{font-family:var(--cond);font-size:20px}
.crec .cn{min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crec .cn small{display:block;font-weight:400;color:var(--ink2);font-size:11.5px}
.crec .vac{font-size:13px;color:var(--ink3);font-style:italic}
.pcts.anios{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pcts.anios button{flex:none;padding:8px 14px}
.pl-wrap{padding:0!important;overflow:hidden}
.pl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.pl-t{border-collapse:separate;border-spacing:0;font-size:13.5px;min-width:100%;white-space:nowrap}
table.pl-t th{position:sticky;top:0;background:var(--soft);padding:9px 10px;text-align:right;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);cursor:pointer;border-bottom:1px solid var(--line);vertical-align:bottom;user-select:none}
table.pl-t th span{display:block;font-weight:700}
table.pl-t th small{display:block;text-transform:none;letter-spacing:0;font-size:10px;color:var(--ink3);font-weight:500}
table.pl-t th.on{color:var(--gold)}
table.pl-t td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.pl-t td.on{font-weight:700;background:color-mix(in srgb,var(--gold) 9%,transparent)}

.sc2.eag{outline:1.6px solid var(--ln);outline-offset:-5px}

<div id="app"><div class="load">Cargando…</div></div>
<script>
let DB=null;
/* ════════════════════════════════════════════════════════════
   DATOS
   La app lee el Google Sheet en vivo. Si no puede (sin conexión o
   en una vista previa sin acceso a internet), usa la copia de abajo.
   ════════════════════════════════════════════════════════════ */
const SHEET_ID = "1kDlBZWe-q6FINjRar6-OWJ73I5M5bvlsuP6tO98lzFg";
const HOJAS = ["CONFIG","JUGADORES","EQUIPOS","CANCHAS","FECHAS","RESULTADOS","TARJETAS","RYDER"];
/* la copia de respaldo de la planilla está en snapshot.json */
const SNAPSHOT_FECHA = "24/9/2026";
const LOGO = {"bag": "img/logo-bag.webp", "resto": "img/logo-resto.webp", "tour": "img/logo-tour.webp"};
const FOTOS = {"6": "img/fotos/6.webp", "15": "img/fotos/15.webp", "16": "img/fotos/16.webp", "23": "img/fotos/23.webp", "3": "img/fotos/3.webp", "7": "img/fotos/7.webp", "13": "img/fotos/13.webp", "9": "img/fotos/9.webp", "14": "img/fotos/14.webp", "21": "img/fotos/21.webp", "10": "img/fotos/10.webp", "22": "img/fotos/22.webp", "5": "img/fotos/5.webp", "17": "img/fotos/17.webp", "11": "img/fotos/11.webp", "24": "img/fotos/24.webp", "2": "img/fotos/2.webp", "1": "img/fotos/1.webp", "18": "img/fotos/18.webp", "25": "img/fotos/25.webp", "12": "img/fotos/12.webp", "4": "img/fotos/4.webp", "19": "img/fotos/19.webp", "8": "img/fotos/8.webp", "20": "img/fotos/20.webp", "26": "img/fotos/26.webp"};

function parseCSV(txt){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&txt[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const h=rows[0].map(x=>x.trim());
  return rows.slice(1).filter(r=>r.some(x=>x!=="")).map(r=>{ const o={}; h.forEach((k,i)=>{ if(k) o[k]=r[i]??""; }); return o; });
}
function num(v){
  if(v===null||v===undefined) return null;
  if(typeof v==="number") return v;
  let s=String(v).trim().replace("−","-");
  if(s==="") return null;
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d+,\d+$/.test(s)) s=s.replace(",",".");
  const n=Number(s); return isNaN(n)?null:n;
}
const txt = v => (v===null||v===undefined) ? "" : String(v).trim();

async function cargar(){
  const url=h=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(h)}`;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),9000);
  try{
    const out={};
    await Promise.all(HOJAS.map(async h=>{
      const r=await fetch(url(h),{signal:ctl.signal,cache:"no-store"});
      if(!r.ok) throw new Error(h);
      const d=parseCSV(await r.text());
      if(!d.length) throw new Error(h+" vacía");
      out[h]=d;
    }));
    clearTimeout(to);
    if(!("pts_total" in out.RESULTADOS[0])||!("h1" in out.TARJETAS[0])) throw new Error("estructura");
    try{ localStorage.setItem("ct-datos",JSON.stringify({hora:Date.now(),data:out})); }catch(e){}
    return {data:out,vivo:true};
  }catch(e){
    clearTimeout(to);
    /* sin planilla: primero la última copia buena que bajó este teléfono, después la copia que viene con la app */
    try{ const c=JSON.parse(localStorage.getItem("ct-datos")||"null"); if(c&&c.data&&c.data.RESULTADOS) return {data:c.data,vivo:false,hora:c.hora}; }catch(e){}
    try{ const r=await fetch("snapshot.json"); if(r.ok) return {data:await r.json(),vivo:false,hora:null}; }catch(e){}
    return {data:null,vivo:false};
  }
}

/* ════════════════════════════════════════════════════════════
   MODELO
   ════════════════════════════════════════════════════════════ */

function modelar(S){
  const jug=new Map(), can=new Map(), fechas=[], res=[], tar=new Map(), cfg={}, eq=[], ry=[];
  S.JUGADORES.forEach(r=>{ const id=num(r.jugador_id); if(id) jug.set(id,{id,nombre:txt(r.nombre),apellido:txt(r.apellido),apodo:txt(r.apodo),tour:txt(r.nombre_tour),mat:""}); });
  S.CANCHAS.forEach(r=>{ const id=num(r.cancha_id); if(!id) return;
    const par=[],idx=[]; for(let h=1;h<=18;h++){ par.push(num(r["par_"+h])); idx.push(num(r["idx_"+h])); }
    can.set(id,{id,nombre:txt(r.nombre),rec:txt(r.recorrido),par,idx,parT:par.reduce((a,b)=>a+(b||0),0)}); });
  S.CONFIG.forEach(r=>{ const t=num(r.temporada); (cfg[t]=cfg[t]||{})[txt(r.parametro)]=num(r.valor); });
  S.FECHAS.forEach(r=>{ const t=num(r.temporada); if(!t) return;
    fechas.push({t,fid:txt(r.fecha_id),n:num(r.numero),dia:txt(r.dia),cid:num(r.cancha_id),final:txt(r.es_final).toUpperCase()==="SI"}); });
  fechas.sort((a,b)=>b.t-a.t||a.n-b.n);
  S.RESULTADOS.forEach(r=>{ const t=num(r.temporada); if(!t) return;
    res.push({t,fid:txt(r.fecha_id),jid:num(r.jugador_id),est:txt(r.estado).toUpperCase(),hcp:num(r.hcp_juego),gross:num(r.gross),
      neto:num(r.neto),medal:num(r.pts_medal)||0,ld:num(r.long_drive)||0,ba:num(r.best_approach)||0,h1:num(r.hoyo_en_uno)||0,
      bg:num(r.bonus_sin_detalle)||0,bonus:num(r.pts_bonus)||0,total:num(r.pts_total)||0,obs:txt(r.observaciones)}); });
  S.TARJETAS.forEach(r=>{ const g=[]; for(let h=1;h<=18;h++) g.push(num(r["h"+h])); tar.set(txt(r.fecha_id)+"|"+num(r.jugador_id),g); });
  S.EQUIPOS.forEach(r=>eq.push({t:num(r.temporada),jid:num(r.jugador_id),eq:txt(r.equipo)}));
  S.RYDER.forEach(r=>{ if(!num(r.temporada)) return; ry.push({t:num(r.temporada),fid:txt(r.fecha_id),s:num(r.puesto),a:num(r.bags_id),b:num(r.resto_id),pa:num(r.pts_bags)||0,pb:num(r.pts_resto)||0,def:txt(r.definicion)}); });
  const F=new Map(fechas.map(f=>[f.fid,f]));
  const temporadas=[...new Set(fechas.map(f=>f.t))].sort((a,b)=>b-a);
  const jugadas=fechas.filter(f=>res.some(r=>r.fid===f.fid&&r.est!=="AUSENTE"));
  return {jug,can,fechas,F,res,tar,cfg,eq,ry,temporadas,jugadas};
}

/* ── ayudas ── */
const nom = id => { const c=(typeof S!=="undefined"&&S&&S.cat&&S.cat.jugadores)?S.cat.jugadores.find(j=>String(j.id)===String(id)):null;
  return (c&&c.nombre) || (DB&&DB.jug.get(+id)?.tour) || ("#"+id); };
const canNom = cid => { const c=DB.can.get(cid); return c ? c.nombre+(c.rec?` ${c.rec}`:"") : "—"; };
const fmt = v => v==null ? "—" : (Math.round(v*10)/10).toLocaleString("es-AR",{maximumFractionDigits:1});
const sgn = v => v==null ? "—" : v===0 ? "E" : (v>0?"+":"")+fmt(v);
const pct = v => v==null ? "—" : Math.round(v)+"%";
const presente = r => r.est!=="AUSENTE";
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fTitulo = f => f.final ? `Fecha ${f.n}, la final` : `Fecha ${f.n}`;
const ctx = f => `${f.t} · Fecha ${f.n} · ${canNom(f.cid)}`;
const ctxLink = f => `<a href="#/fecha/${f.fid}" class="lk">${ctx(f)}</a>`;
const parF = f => DB.can.get(f.cid)?.parT ?? 72;
const ultima = () => [...DB.jugadas].sort((a,b)=>b.t-a.t||b.n-a.n)[0];
const MEJ_GROSS = 5;

function equipo(id){ if(!DB) return null; if(!DB._eq){ DB._eq={}; const tmax=Math.max(0,...DB.eq.map(e=>e.t||0));
    DB.eq.filter(e=>e.t===tmax).forEach(e=>DB._eq[e.jid]=e.eq.toUpperCase().startsWith("BAGS")?"bag":"resto"); } return DB._eq[id]||null; }
const EQNOM={bag:"Bags Boys",resto:"Resto del Mundo"};
const AVC=["#0A1F3D","#1D4ED8","#0F7B4F","#8B2E4F","#7C4D12","#3D3A8C","#0E6E73","#9A3412","#374151","#5B2C83","#1F6F43","#A16207"];
function av(id,cls="",star=false){
  if(!DB) return `<span class="av ${cls} ini">·</span>`;
  const j=DB.jug.get(+id); const s=(j?.tour||"?").split(" "); const ini=(s[0][0]+(s[1]?s[1][0]:"")).toUpperCase();
  const e=equipo(id); const bd=e?`<img class="bd" src="${LOGO[e]}" alt="">`:"";
  const st=(star&&titulos()[id])?`<span class="star" title="Campeón del Tour">★</span>`:"";
  const inner=FOTOS[id]?`<img class="ph" src="${FOTOS[id]}" alt="">`:ini;
  return `<span class="av ${cls}" ${FOTOS[id]?"":`style="background:${AVC[id%AVC.length]}"`}>${inner}${bd}${st}</span>`;
}
function pl(id,sub="",star=true){ return `<a class="pl" href="#/jugador/${id}">${av(id,"",star)}<span class="n">${esc(nom(id))}${sub?`<small>${sub}</small>`:""}</span></a>`; }
const jacket = n => `<span class="jk">${`<img src="${LOGO.tour}" alt="">`.repeat(n)}</span>`;

function leaderboard(fid){
  const R=DB.res.filter(r=>r.fid===fid);
  R.sort((a,b)=>{ const g=r=>r.est==="JUGO"?0:r.est==="AUSENTE"?2:1;
    return g(a)-g(b) || b.medal-a.medal || (a.neto??999)-(b.neto??999) || nom(a.jid).localeCompare(nom(b.jid)); });
  let pos=0;
  R.forEach((r,i)=>{ if(r.est!=="JUGO"){ r.pos=null; return; } const p=R[i-1];
    if(!p||p.est!=="JUGO"||p.medal!==r.medal||p.neto!==r.neto) pos=i+1; r.pos=pos; });
  return R;
}
function tabla(t){
  const fs=DB.fechas.filter(f=>f.t===t).sort((a,b)=>a.n-b.n);
  const c=DB.cfg[t]||{}; const m=c.mejores_regulares||fs.length; const ffin=c.fecha_final||0;
  const ids=[...new Set(DB.res.filter(r=>r.t===t).map(r=>r.jid))];
  const filas=ids.map(jid=>{
    const R=fs.map(f=>DB.res.find(x=>x.fid===f.fid&&x.jid===jid));
    const pts=R.map(r=>r?r.total:0), est=R.map(r=>r?r.est:"AUSENTE");
    const reg=fs.map((f,i)=>({i,v:pts[i],fin:f.n===ffin})).filter(x=>!x.fin).sort((a,b)=>b.v-a.v||a.i-b.i).slice(0,m);
    const cuenta=new Set(reg.map(x=>x.i)); fs.forEach((f,i)=>{ if(f.n===ffin) cuenta.add(i); });
    return {jid,pts,est,cuenta,total:[...cuenta].reduce((a,i)=>a+pts[i],0),suma:pts.reduce((a,b)=>a+b,0)};
  }).sort((a,b)=>b.total-a.total||b.suma-a.suma);
  let p=0; filas.forEach((f,i)=>{ if(i===0||Math.abs(filas[i-1].total-f.total)>1e-6) p=i+1; f.pos=p; });
  return {fs,filas,m,ffin};
}
function vueltas(){
  if(!DB) return [];
  if(DB._v) return DB._v;
  const V=[];
  DB.res.forEach(r=>{ if(r.est!=="JUGO") return; const g=DB.tar.get(r.fid+"|"+r.jid); if(!g||g.some(x=>x==null)) return;

function tipoHoyo(g,p){ if(g==null) return "nd"; const d=g-p; return d<=-2?"ea":d===-1?"bi":d===0?"pa":d===1?"bo":"db"; }
function ganadores(){ if(DB._w) return DB._w; const w=[]; DB.jugadas.forEach(f=>{ leaderboard(f.fid).filter(r=>r.pos===1).forEach(r=>w.push({f,r})); }); return DB._w=w; }

function statsTemp(t){
  const key="_st"+t; if(DB[key]) return DB[key];
  const ids=[...new Set(DB.res.filter(r=>r.t===t).map(r=>r.jid))];
  const filas=ids.map(jid=>{
    const jug=DB.res.filter(r=>r.t===t&&r.jid===jid&&presente(r));
    const V=vueltas().filter(v=>v.r.t===t&&v.r.jid===jid);
    const c={ea:0,bi:0,pa:0,bo:0,db:0}; V.forEach(v=>v.g.forEach((g,h)=>c[tipoHoyo(g,v.c.par[h])]++));
    const gs=V.map(v=>v.gross).sort((a,b)=>a-b);
    const hc=DB.res.filter(r=>r.t===t&&r.jid===jid&&r.hcp!=null)
      .sort((a,b)=>DB.F.get(a.fid).n-DB.F.get(b.fid).n).map(r=>r.hcp);
    /* las mejores tarjetas se eligen por golpes sobre el par de cada cancha (no todas son par 72) */
    const mej=V.map(v=>({g:v.gross,s:v.gross-v.c.parT})).sort((a,b)=>a.s-b.s).slice(0,MEJ_GROSS);
    const prom=gs.length?gs.reduce((a,b)=>a+b,0)/gs.length:null;
    const pm=mej.length?mej.reduce((a,x)=>a+x.g,0)/mej.length:null;
    const spm=mej.length?mej.reduce((a,x)=>a+x.s,0)/mej.length:null;
    const hcp=hc.length?hc[hc.length-1]:null;   /* el handicap con el que cerró el año */
    return {jid,fechas:jug.length,vueltas:V.length,hoyos:V.length*18,c,prom,pm,hcp,dif:(spm!=null&&hcp!=null)?spm-hcp:null};
  }).filter(x=>x.vueltas>0);
  return DB[key]=filas;
}
/* match play hipotético entre dos jugadores en una fecha, hoyo por hoyo */
function matchHipotetico(f,a,b,ra,rb){
  const c=DB.can.get(f.cid); const ga=DB.tar.get(f.fid+"|"+a), gb=DB.tar.get(f.fid+"|"+b);
  if(!c||!ga||!gb||ga.some(x=>x==null)||gb.some(x=>x==null)) return null;
  const base=Math.min(ra.hcp||0,rb.hcp||0);
  const pa=reparto((ra.hcp||0)-base,c.idx), pb=reparto((rb.hcp||0)-base,c.idx);
  let up=0, jugados=0, cerrado=0;
  for(let h=0;h<18;h++){
    const na=ga[h]-pa[h], nb=gb[h]-pb[h];
    if(na<nb) up++; else if(nb<na) up--;
    jugados=h+1;
    if(Math.abs(up)>18-jugados){ cerrado=18-jugados; break; }
  }
  const v=Math.abs(up);
  return {up, txt: up===0?"AS" : (cerrado>0? `${v}&${cerrado}` : `${v} UP`)};
}
function h2h(a,b){
  const res={fechas:0,gana:0,pierde:0,empata:0,det:[]};
  let acum=0;
  [...DB.jugadas].sort((x,y)=>x.t-y.t||x.n-y.n).forEach(f=>{
    const ra=DB.res.find(r=>r.fid===f.fid&&r.jid===a), rb=DB.res.find(r=>r.fid===f.fid&&r.jid===b);
    if(!ra||!rb||ra.est!=="JUGO"||rb.est!=="JUGO") return;
    res.fechas++; const d=ra.neto-rb.neto;
    if(d<0){ res.gana++; acum++; } else if(d>0){ res.pierde++; acum--; } else res.empata++;
    res.det.push({f,na:ra.neto,nb:rb.neto,acum,match:matchHipotetico(f,a,b,ra,rb)});
  });
  const ry=DB.ry.filter(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a));
  res.ryder=ry.length?{n:ry.length,pa:ry.reduce((s,m)=>s+(m.a===a?m.pa:m.pb),0),pb:ry.reduce((s,m)=>s+(m.a===b?m.pa:m.pb),0)}:null;
  return res;
}

}

function reparto(hcp,idx){ const o=Array(18).fill(0); let r=hcp||0; while(r>0){ const t=Math.min(r,18); for(let i=0;i<18;i++) if(idx[i]<=t) o[i]++; r-=t; } return o; }

    for(let h=0;h<18;h++){ pa+=c.par[h]; if(g[h]==null){acc.push(null);tp.push(null);continue;} a+=g[h]-rp[h]; acc.push(a); tp.push(a-pa); } return {r,acc,tp,g}; });

const COLS_PLANTEL=[

function datosPlantel(anio){
  const VV=vueltas().filter(v=>!anio||v.f.t===anio), R=DB.res.filter(r=>r.est==="JUGO"&&(!anio||r.t===anio));
  const W=ganadores().filter(x=>!anio||x.f.t===anio), T=[];
  DB.jugadas.filter(f=>!anio||f.t===anio).forEach(f=>leaderboard(f.fid).forEach(r=>{ if(r.pos&&r.pos<=3) T.push(r.jid); }));
  const ptsDe=jid=>DB.res.filter(r=>r.jid===jid&&(!anio||r.t===anio)).reduce((a,r)=>a+(+r.total||0),0);
  const ids=[...new Set(R.map(r=>r.jid))];
  return ids.map(jid=>{
    const v=VV.filter(x=>x.r.jid===jid), rr=R.filter(r=>r.jid===jid);
    const t={eag:0,bir:0,par:0,bog:0,dbl:0}, tipo={3:[],4:[],5:[]}; let hoyos=0;
    v.forEach(x=>x.g.forEach((g,h)=>{ const d=g-x.c.par[h]; hoyos++; if(d<=-2)t.eag++; else if(d===-1)t.bir++; else if(d===0)t.par++; else if(d===1)t.bog++; else t.dbl++;
      (tipo[x.c.par[h]]||[]).push(d); }));
    const prom=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const ult=v.slice().sort((a,b)=>b.f.t-a.f.t||b.f.n-a.f.n).slice(0,20).map(x=>x.gross-x.c.parT).sort((a,b)=>a-b).slice(0,8);
    const netos=rr.map(r=>r.neto).filter(x=>x!=null);
    const fOrd=r=>{ const f=DB.F.get(r.fid)||{}; return (f.t||r.t)*100+(f.n||0); };
    const ultR=rr.filter(r=>r.hcp!=null).sort((a,b)=>fOrd(b)-fOrd(a))[0];
    return {jid, nombre:nom(jid), fechas:rr.length, gan:W.filter(x=>x.r.jid===jid).length, top3:T.filter(x=>x===jid).length, pts:ptsDe(jid),
      gprom:prom(v.map(x=>x.gross)), gmej:v.length?Math.min(...v.map(x=>x.gross)):null, nprom:prom(netos), hch:prom(ult),
      ult:ultR?ultR.hcp:null, dif:(prom(ult)!=null&&ultR)?prom(ult)-ultR.hcp:null, vueltas:v.length,
      ...t, pctpar:hoyos?(t.eag+t.bir+t.par)/hoyos*100:null, p3:prom(tipo[3]), p4:prom(tipo[4]), p5:prom(tipo[5])};
  });
}

/* radar: compara los perfiles de juego de dos jugadores */
function perfilRadar(id){
  const V=vueltas().filter(v=>v.r.jid===id);
  if(!V.length) return null;
  const c={ea:0,bi:0,pa:0,bo:0,db:0}; V.forEach(v=>v.g.forEach((g,h)=>c[tipoHoyo(g,v.c.par[h])]++));
  const n=V.length*18;
  const sp=V.map(v=>v.gross-v.c.parT);            /* golpes sobre el par de cada cancha */
  const prom=sp.reduce((a,b)=>a+b,0)/sp.length;
  const desvio=Math.sqrt(sp.reduce((a,x)=>a+(x-prom)**2,0)/sp.length);
  const cortos=[],largos=[];
  V.forEach(v=>v.g.forEach((g,h)=>{ const p=v.c.par[h]; (p===3?cortos:p===5?largos:[]).push(g-p); }));
  const m=l=>l.length?l.reduce((a,b)=>a+b,0)/l.length:0;
  return {
    "Birdies o mejor":(c.ea+c.bi)/n*100,
    "Pares":c.pa/n*100,
    "Regularidad":V.length>1?Math.max(0,100-desvio*10):50,   /* cuánto varían sus vueltas: una sola mala no lo hunde */
    "Constancia (gross)":Math.max(0,100-prom*2),
    "Par 3":Math.max(0,100-m(cortos)*40),
    "Par 5":Math.max(0,100-m(largos)*40)
  };
}

/* récord de amistosos por cancha: la mejor vuelta gross completa (18 hoyos) de un jugador del Tour en una partida guardada */
function recordsAmistosos(){
  const H=S.amHist; const out={};
  if(!H){ if(!S.amHistCargando){ S.amHistCargando=true; api("historialAmistosos",{}).then(r=>{ S.amHistCargando=false; S.amHist=r&&r.ok?r:{partidas:[],torneos:[]}; S.amHistHora=Date.now(); pintar(); }); } return out; }
  const todas=H.partidas.concat(...(H.torneos||[]).map(t=>t.lineas));
  todas.forEach(p=>p.jugadores.forEach(j=>{ if(esInv(j.id)||!j.golpes||j.golpes.length!==18||j.golpes.some(g=>g==null)) return;
    const gross=j.golpes.reduce((a,b)=>a+b,0), cid=+(p.cancha&&p.cancha.id);
    if(!out[cid]||gross<out[cid].gross) out[cid]={jid:+j.id,gross,dia:String(p.dia||"").slice(0,10),pid:p.partida_id}; }));
  return out;
}

/* ═══ COLA DE GOLPES ═══
   Todo golpe se guarda PRIMERO en el teléfono y después se manda. Solo se saca de la cola
   lo que el servidor confirmó; si mientras tanto se cargó otro valor, ese queda. */
const kP = g => g.match_id+"|"+g.jugador_id+"|"+g.hoyo;
function pendientes(){ try{ return JSON.parse(localStorage.getItem("ct-pend")||"[]"); }catch(e){ return []; } }
function guardarPend(l){ try{ localStorage.setItem("ct-pend",JSON.stringify(l)); }catch(e){} }
function encolar(lista){ if(!Array.isArray(lista)) lista=[lista]; const l=pendientes();
  lista.forEach(g=>{ const i=l.findIndex(x=>kP(x)===kP(g)); if(i>=0) l[i]=g; else l.push(g); }); guardarPend(l); }
function quitarPend(items){ const m=new Map(items.map(g=>[kP(g),g.t]));
  guardarPend(pendientes().filter(x=>!(m.has(kP(x)) && x.t===m.get(kP(x))))); }
let _envio=null;
function enviarPendientes(){ if(_envio) return _envio;
  _envio=(async()=>{ try{ return await enviar_(); } finally { _envio=null; } })(); return _envio; }
async function enviar_(){
  const l=pendientes(); const out={enviados:0,errores:[]};

function dialogo({titulo,texto="",campo=null,ok="Aceptar",cancelar=null,peligro=false}){

    const inp=d.querySelector("input"), vacio=campo?null:false;
    const fin=v=>{ d.remove(); document.removeEventListener("keydown",tec,true); res(v); };
    const si=()=>{ if(!campo) return fin(true);
      const m=campo.validar?campo.validar(inp.value):""; if(m){ d.querySelector(".dlg-err").textContent=m; inp.focus(); return; } fin(inp.value); };
    const tec=e=>{ if(e.key==="Escape"&&cancelar){ e.preventDefault(); fin(vacio); } else if(e.key==="Enter"){ e.preventDefault(); si(); } };
    d.querySelector('[data-r="si"]').onclick=si;
    const no=d.querySelector('[data-r="no"]'); if(no) no.onclick=()=>fin(vacio);
    d.onclick=e=>{ if(e.target===d&&cancelar) fin(vacio); };
    document.addEventListener("keydown",tec,true);
    document.body.appendChild(d); if(inp){ inp.focus(); inp.select(); }
  });
}

function armarPartida(a){
  const jug = a.jugadores || [], cancha = a.cancha || { par:[], idx:[] }, par = cancha.par || [], idx = cancha.idx || [];
  const gm = {}; (a.golpes || []).forEach(g => gm[g.j + "|" + g.h] = Number(g.g));
  jug.forEach(j => (j.g || []).forEach((v, h) => { if (v != null) gm[j.id + "|" + (h + 1)] = Number(v); }));
  const pct = pctN(a.porcentaje), base = {}; jug.forEach(j => base[j.id] = Number(j.hcp) || 0);
  const hcps = golpesJuego(base, pct, a.hcp_modo);
  const rep = {}; jug.forEach(j => rep[j.id] = calcReparto(hcps[j.id], idx));
  const neto = (j, h) => { const g = gm[j + "|" + (h + 1)]; return g == null ? null : g - rep[j][h]; };
  const ids = jug.map(j => j.id), pts = {}; ids.forEach(j => pts[j] = 0);
  const lado = j => String((jug.find(x => x.id === j) || {}).lado || "");
  const A = ids.filter(j => lado(j) === "A"), B = ids.filter(j => lado(j) === "B");
  const pb = Number(a.p_bola ?? 1), psu = Number(a.p_suma || 0), des = !!a.desempate;
  if (a.modalidad === "FOURBALL"){ pts.A = 0; pts.B = 0; }
  const lagN = Math.min(Number(a.bolas) || ids.length, ids.length), lagMed = a.conteo !== "STABLEFORD", lag = [];
  if (a.modalidad === "LAGUNEADA") pts.T = 0;
  let up = 0, hoyos = [], jugados = 0, parado = false, cerrado = false, falta = null;
  for (let h = 0; h < 18; h++){
    const n = {}; let incompleto = false;
    ids.forEach(j => { const v = neto(j, h); n[j] = v; if (v == null) incompleto = true; });
    if (a.modalidad === "MATCH"){
      if (parado || cerrado || incompleto){ if (incompleto && !parado && !cerrado){ parado = true; falta = h + 1; } hoyos.push(null); continue; }
      if (n[ids[0]] < n[ids[1]]){ up++; hoyos.push(ids[0]); } else if (n[ids[1]] < n[ids[0]]){ up--; hoyos.push(ids[1]); } else hoyos.push("=");
      jugados = h + 1; if (Math.abs(up) > 18 - jugados) cerrado = true; continue;
    }
    if (a.modalidad === "MEDAL"){
      /* medal neto: golpes netos sobre el par, hoyo por hoyo */
      ids.forEach(j => { if (n[j] != null) pts[j] += n[j] - Number(par[h]); });
      if (!incompleto) jugados++; hoyos.push(null); continue;
    }
    if (a.modalidad === "LAGUNEADA"){
      /* laguneada: la línea es un equipo; cuentan las N mejores pelotas netas del hoyo (medal o stableford) */
      if (incompleto){ lag.push(null); hoyos.push(null); continue; }
      const vals = ids.map(j => lagMed ? n[j] - Number(par[h]) : Math.max(0, 2 + Number(par[h]) - n[j])).sort((x, y) => lagMed ? x - y : y - x);
      const sel = vals.slice(0, lagN); lag.push(sel); pts.T += sel.reduce((x, y) => x + y, 0);
      jugados++; hoyos.push(null); continue;
    }
    if (a.modalidad !== "LAGUNEADA") lag.push(null);
    if (a.modalidad === "STABLEFORD"){
      /* stableford neto: 2 puntos el par, uno más por cada golpe abajo, uno menos por cada golpe arriba (mínimo 0) */
      ids.forEach(j => { if (n[j] != null) pts[j] += Math.max(0, 2 + Number(par[h]) - n[j]); });
      if (!incompleto) jugados++; hoyos.push(null); continue;
    }
    if (incompleto){ hoyos.push(null); continue; }
    jugados++;
    if (a.modalidad === "P420"){
      const orden = [...ids].sort((x, y) => n[x] - n[y]), v = orden.map(j => n[j]);
      if (v[0] === v[1] && v[1] === v[2]){ ids.forEach(j => pts[j] += 2); hoyos.push("="); }
      else if (v[0] === v[1]){ pts[orden[0]] += 3; pts[orden[1]] += 3; hoyos.push(orden[0] + "+" + orden[1]); }
      else if (v[1] === v[2]){ pts[orden[0]] += 4; pts[orden[1]] += 1; pts[orden[2]] += 1; hoyos.push(orden[0]); }
      else { pts[orden[0]] += 4; pts[orden[1]] += 2; hoyos.push(orden[0]); }
    } else {
      /* mejor pelota; si empata y está el desempate, la segunda pelota. Empate: nadie suma */
      const mejor = l => Math.min(...l.map(j => n[j])), segunda = l => Math.max(...l.map(j => n[j])), suma = l => l.reduce((s, j) => s + n[j], 0);
      let ma = mejor(A), mb = mejor(B);
      if (ma === mb && des){ ma = segunda(A); mb = segunda(B); }
      if (ma < mb) pts.A += pb; else if (mb < ma) pts.B += pb;
      if (psu > 0){ const sa = suma(A), sb = suma(B); if (sa < sb) pts.A += psu; else if (sb < sa) pts.B += psu; }
      hoyos.push(ma < mb ? "A" : (mb < ma ? "B" : "="));
    }
  }
  let resumen = "", lider = "";
  if (a.modalidad === "MATCH"){ const rest = 18 - jugados, v = Math.abs(up);
    resumen = jugados === 0 ? "Sin empezar" : (cerrado && rest > 0 ? v + "&" + rest : (v === 0 ? (jugados === 18 ? "Empatados" : "AS") : v + " UP"));
    lider = up > 0 ? ids[0] : (up < 0 ? ids[1] : ""); }
  else if (a.modalidad === "P420" || a.modalidad === "STABLEFORD"){ const orden = ids.slice().sort((x, y) => pts[y] - pts[x]); resumen = orden.map(j => pts[j]).join(" - "); lider = (orden.length > 1 && pts[orden[0]] === pts[orden[1]]) ? "" : orden[0]; }
  else if (a.modalidad === "MEDAL"){ const orden = ids.slice().sort((x, y) => pts[x] - pts[y]); resumen = orden.map(j => fmtRel(pts[j])).join(" · "); lider = (orden.length > 1 && pts[orden[0]] === pts[orden[1]]) ? "" : orden[0]; }
  else if (a.modalidad === "LAGUNEADA"){ resumen = !jugados ? "—" : (lagMed ? fmtRel(pts.T) : pts.T + " pts"); }
  else { resumen = pts.A + " a " + pts.B; lider = pts.A > pts.B ? "A" : (pts.B > pts.A ? "B" : ""); }
  return { partida_id:a.partida_id, modalidad:a.modalidad, estado:a.estado, dia:a.dia, creador:a.creador, hcp_modo:a.hcp_modo, porcentaje:pct,
    desempate:des, ld_hoyo:a.ld_hoyo || null, ba_hoyo:a.ba_hoyo || null, premios:a.premios || [],
    torneo_id:a.torneo_id || null, linea:a.linea || null, bolas:Number(a.bolas) || 0, conteo:a.conteo || null, lag, nBolas:lagN,
    p_bola:pb, p_suma:psu, cancha:{ id:cancha.id, nombre:cancha.nombre, recorrido:cancha.recorrido, par, idx },
    jugadores: jug.map(j => ({ id:j.id, lado:String(j.lado || ""), hcp:Number(j.hcp) || 0, recibe:hcps[j.id], rep:rep[j.id],
      golpes:[...Array(18)].map((_, h) => gm[j.id + "|" + (h + 1)] ?? null) })),
    puntos:pts, up, hoyos, jugados, cerrado, falta_hoyo:falta, resumen, lider };
}

      L.paso=2; L.pin=""; S.err=/Ingresá tu PIN/.test(e.error||"")?"":(e.error||""); pintar(); };
    document.getElementById("seguir").onclick=ir;
    i.onkeydown=e=>{ if(e.key==="Enter") ir(); };
    i.focus();
  } else {
    const tecla=async k=>{
      if(L.enviando) return;
      L.mal=false;
      if(k==="borrar") L.pin=L.pin.slice(0,-1);
      else if(k==="ok"||L.pin.length===4&&k!=="borrar"){ }
      else if(L.pin.length<4) L.pin+=k;
      if(L.pin.length===4 && k!=="borrar"){
        S.err="Entrando…"; L.enviando=true; pintar();
        const r=await api("login",{matricula:L.matricula,pin:L.pin});
        L.enviando=false;
        if(!r.ok){ S.err=r.error; L.pin=""; L.mal=true; pintar(); return; }
        S.ses={token:r.token,jugador:r.jugador,mat:L.matricula}; guardar(); S.err=""; document.onkeydown=null;
        await arrancar(); return;
      }
      S.err=""; pintar();
    };
    document.querySelectorAll(".pinpad button").forEach(b=>b.onclick=()=>tecla(b.dataset.k));
    document.onkeydown=e=>{ if(L.paso!==2||S.ses) return;
      if(/^[0-9]$/.test(e.key)) tecla(e.key); else if(e.key==="Backspace") tecla("borrar"); };
    document.getElementById("atras").onclick=()=>{ L.paso=1; L.pin=""; L.mal=false; S.err=""; document.onkeydown=null; pintar(); };
  }
}

const hcpEv=j=>{ const k=String(j); return (A.hcpEv&&A.hcpEv[k]!=null)?A.hcpEv[k]:((S.cat&&S.cat.hcp||{})[k]??0); };
function golpesCruce(bags,resto,formato){
  const pct=pctN(A.evento&&A.evento.porcentaje), modo=(A.evento&&A.evento.hcp_modo)||"DIFERENCIA";
  if(formato==="FOURSOME"||formato==="GREENSOME"){
    const prom=l=>l.reduce((a,j)=>a+(+hcpEv(j)||0)*pct/100,0)/l.length, o={};
    let ga,gb; if(modo==="DIFERENCIA"){ const d=prom(resto)-prom(bags); ga=d<0?Math.round(-d):0; gb=d>0?Math.round(d):0; }
    else { ga=Math.round(prom(bags)); gb=Math.round(prom(resto)); }
    bags.forEach(j=>o[j]=ga); resto.forEach(j=>o[j]=gb); return o;
  }
  const b={}; bags.concat(resto).forEach(j=>b[j]=hcpEv(j)); return golpesJuego(b,pct,modo);
}

    return {t:(rest>0? v+"&"+rest : v+" UP"),c:(m.estado>0?"b":"r")+" fin"};

}

async function traerTorneo(id){
  const r=await api("torneo",{torneo_id:id});
  if(r&&r.ok) TN.act=r.torneo; else if(!TN.act||TN.act.torneo_id!==id){ TN.act=null; S.err=(r&&r.error)||""; }
  pintar();
}
/* tabla del torneo: laguneada por equipo; stableford y medal por jugador */
function tablaTorneo(t){
  const md=t.modalidad;
  if(md!=="LAGUNEADA" && !INDIV(md)) return null;
  const med = md==="MEDAL" || (md==="LAGUNEADA" && t.conteo!=="STABLEFORD");
  const filas = md==="LAGUNEADA"
    ? t.lineas.map(p=>({p, nombre:"Línea "+p.linea, sub:p.jugadores.map(j=>apellido(nomAm(j.id))).join(" · "), pts:p.puntos.T||0, hoyos:p.jugados}))
    : t.lineas.flatMap(p=>p.jugadores.map(j=>({p, id:j.id, nombre:nomAm(j.id), sub:"Línea "+p.linea, pts:p.puntos[j.id]||0, hoyos:j.golpes.filter(g=>g!=null).length})));
  filas.sort((a,b)=>(!a.hoyos)-(!b.hoyos) || (med?a.pts-b.pts:b.pts-a.pts) || b.hoyos-a.hoyos || (a.p.linea-b.p.linea));
  let pos=0; filas.forEach((f,i)=>{ if(i===0||f.pts!==filas[i-1].pts||!f.hoyos) pos=i+1; f.pos=f.hoyos?pos:"–"; });
  return {filas, med, col:med?"Score":"Puntos", fmt:v=>med?fmtRel(v):String(v)};
}
function lineaTorneo(t){
  return t.modalidad==="LAGUNEADA"?(t.bolas?(t.bolas===1?"la mejor pelota":"las "+t.bolas+" mejores pelotas"):"todas las pelotas")+" · "+(t.conteo==="STABLEFORD"?"stableford":"medal")+" neto"
    :MODAL[t.modalidad].replace(/ \(.*\)$/,"");
}
/* mi puesto en el torneo (mi línea en la laguneada; yo en stableford y medal) */
function miPuesto(t,tb){
  const yo=String(S.ses.jugador.id);
  const f=tb.filas.find(x=>t.modalidad==="LAGUNEADA"?x.p.jugadores.some(j=>String(j.id)===yo):String(x.id)===yo);
  if(!f) return "";
  const conJuego=tb.filas.filter(x=>x.hoyos).length;
  return `<div class="mipuesto"><span>${t.modalidad==="LAGUNEADA"?"Tu línea":"Vos"}</span><b>${f.hoyos?f.pos+"°":"–"}</b><small>${f.hoyos?`de ${tb.filas.length} · ${tb.fmt(f.pts)} en ${f.hoyos} hoyo${f.hoyos===1?"":"s"}`:`todavía sin hoyos completos · ${conJuego} de ${tb.filas.length} ya empezaron`}</small></div>`;
}
function tablaTorneoHtml(t,tb){
  const yo=String(S.ses.jugador.id);
  const esMia=f=>t.modalidad==="LAGUNEADA"?f.p.jugadores.some(j=>String(j.id)===yo):String(f.id)===yo;
  return `<div class="card tt"><table class="tabla-t"><thead><tr><th>#</th><th>${t.modalidad==="LAGUNEADA"?"Equipo":"Jugador"}</th><th>${tb.col}</th><th>Hoyos</th></tr></thead><tbody>
    ${tb.filas.map(f=>`<tr data-irp="${f.p.partida_id}" class="${esMia(f)?"mia":""}"><td class="pos">${f.pos}</td><td class="eq"><b>${esc(f.nombre)}</b><small>${esc(f.sub)}</small></td><td class="pts">${f.hoyos?tb.fmt(f.pts):"–"}</td><td class="hy">${f.hoyos}</td></tr>`).join("")}
    </tbody></table></div>`;
}

/* una fila de amistoso (Vivo y perfil) */
function filaAm(p){
  const J=p.jugadores.map(j=>j.id), fin=p.estado==="CERRADA"?"fin":"";
  const lid = !p.lider ? "" : (p.modalidad==="FOURBALL" ? (p.lider==="A"?"b":"o") : colAm(p,p.lider));
  const sub=`${MODAL[p.modalidad]} · ${esc(p.cancha.nombre||"")}${p.jugados&&p.estado!=="CERRADA"?` · hoyo ${p.jugados}`:""}${p.estado==="CERRADA"?" · terminada":""}`;
  if(p.modalidad==="LAGUNEADA") return `<div class="mrow am am3" data-p="${p.partida_id}">
    <div class="lado"><div class="pj">${grupoAv(J,avAm,"sm")}<div class="nm nm3"><b>Línea ${p.linea||1}</b> <span class="vs">·</span> ${J.map(j=>`<span>${esc(apellido(nomAm(j)))}</span>`).join(' <span class="vs">·</span> ')}</div></div></div>
    <span class="est ${fin}">${esc(p.resumen||"—")}</span><div class="sub">${p.jugados?`${p.jugados} hoyo${p.jugados===1?"":"s"}`:"por salir"}</div></div>`;
  if(p.modalidad==="P420"||INDIV(p.modalidad)) return `<div class="mrow am am3" data-p="${p.partida_id}">
    <div class="lado"><div class="pj">${grupoAv(J,avAm,"sm")}<div class="nm nm3">${J.map(j=>`<span class="c-${colAm(p,j)}">${esc(nomAm(j))}</span>`).join(' <span class="vs">·</span> ')}</div></div></div>
    <span class="est ${lid} ${fin}">${esc(p.resumen||"—")}</span><div class="sub">${sub}</div></div>`;
  const A=p.jugadores.filter(j=>colAm(p,j.id)==="b").map(j=>j.id), B=p.jugadores.filter(j=>colAm(p,j.id)==="o").map(j=>j.id);
  const ld=(l,c,r)=>`<div class="lado ${r?"r":""}">${ladoFila(l,{nombre:nomAm,av:avAm,cls:"c-"+c,r})}</div>`;
  const lidK=(p.modalidad==="MATCH"||p.modalidad==="FOURBALL")&&p.lider&&p.jugados ? (colAm(p,p.lider==="A"?A[0]:p.lider==="B"?B[0]:p.lider)==="b"?"lidA f-b":"lidB f-o") : "";
  return `<div class="mrow am ${lidK}" data-p="${p.partida_id}">${ld(A,"b",false)}
    <span class="est ${lid} ${fin}">${esc(p.resumen||"—")}</span>${ld(B,"o",true)}<div class="sub">${sub}</div></div>`;
}

function vistaVivo(){
  const e=S.est;
  if(!e||!e.evento) return `<h1>Todavía no hay nada en juego</h1>
    <p class="lead">Cuando el administrador arme la Ryder o una fecha, vas a verla acá en vivo.</p>
    <a class="btn sec" style="display:block;text-align:center;text-decoration:none;padding:14px" href="${HIST}">Ver las estadísticas históricas</a>`;
  /* así va: los cerrados con sus puntos, y cada match en juego suma para el que lo va ganando */
  const pg=Number(e.evento.pts_gana)||1; let B=0,R=0, vivos=0;
  e.matches.forEach(m=>{ if(m.cerrado){ B+=m.puntos.bags; R+=m.puntos.resto; } else if(m.jugados){ vivos++; if(m.estado>0) B+=pg; else if(m.estado<0) R+=pg; } });
  const tot=Math.max(B+R,0.001);
  const porSes={};
  e.matches.forEach(m=>{ (porSes[m.sesion_id]=porSes[m.sesion_id]||[]).push(m); });
  return `
  <div class="marcador">
    <div class="marc2">
      <div class="mside a ${B>R?"lid f-b":""}"><span class="eq">Bags Boys</span><b>${fmt(B)}</b></div>
      <div class="mside b ${R>B?"lid f-r":""}"><b>${fmt(R)}</b><span class="eq">Resto del Mundo</span></div>
    </div>
    <div class="barra"><i class="b" style="width:${B/tot*100}%"></i><i class="r" style="width:${R/tot*100}%"></i></div>
    ${vivos?`<div class="small muted" style="margin-top:6px">Así va: cada match en juego suma para el que lo va ganando · definidos ${fmt(e.marcador.bags)} a ${fmt(e.marcador.resto)}</div>`:""}
    <div class="small muted" style="margin-top:8px">${esc(e.evento.nombre)} · ${esc(e.cancha.nombre||"")}${e.cancha.recorrido?" "+esc(e.cancha.recorrido):""}</div>
    ${lineaPremios(Object.assign({premios:e.premios},e.evento),nom)}
  </div>
  ${frescura()}
  ${e.otros_en_juego&&S.ses.jugador.rol==="admin"?`<div class="aviso rojo">Hay ${e.otros_en_juego} evento(s) más en juego que no se ven acá. Cerrá o pasá a borrador el que no corresponda.</div>`:""}
  ${e.sesiones.map(s=>{
    const ms=(porSes[s.sesion_id]||[]).sort((a,b)=>Number(a.nro)-Number(b.nro));
    if(!ms.length) return "";

  <p class="small muted" style="margin-top:10px">Se actualiza al instante. Tocá un cruce para ver la tarjeta y cargar golpes.</p>

}
function vistaMatch(){
  const e=S.est, m=e&&e.matches&&e.matches.find(x=>x.match_id===S.match);
  if(!m) { S.match=null; return vistaVivoTodo(); }   /* el cruce o el evento ya no están (se cerró o se borró) */
  const par=e.cancha.par, st=estadoTxt(m);
  const unaBola=m.una_bola;
  const jug=unaBola?[m.bags[0],m.resto[0]]:m.bags.concat(m.resto);
  const nombreLado=j=>unaBola?(String(j)===String(m.bags[0])?m.bags.map(nom).join(" / "):m.resto.map(nom).join(" / ")):nom(j);
  const tarS={}; m.tarjeta.forEach(t=>tarS[String(t.jugador_id)]=t.golpes);
  const pdM=pendDe(m.match_id), pk=new Set(Object.keys(pdM));
  const tar={}; Object.keys(tarS).forEach(j=>tar[j]=tarS[j].map((g,h)=>pdM[j+"|"+(h+1)]!=null?pdM[j+"|"+(h+1)]:g));
  const aviso = unaBola?`<div class="aviso">En ${FORMATOS[m.formato]} la pareja juega una sola bola: se carga un resultado por equipo.</div>`:"";
  /* misma salida: misma sesión y mismo horario. Un teléfono por línea carga todos sus cruces */
  const yoId=String(S.ses.jugador.id), juegaEn=x=>x.bags.concat(x.resto).map(String).includes(yoId);
  const salida=(m.hora||"").trim()?e.matches.filter(x=>x.sesion_id===m.sesion_id&&(x.hora||"").trim()===(m.hora||"").trim()):[m];
  const puedo = S.ses.jugador.rol==="admin" || juegaEn(m) || salida.some(juegaEn);
  const otrosSalida = salida.filter(x=>x.match_id!==m.match_id);
  const selSalida = otrosSalida.length && puedo ? `<div class="salida"><span class="small muted">Misma salida${m.hora?" ("+esc(m.hora)+")":""}:</span>${salida.map(x=>`<button class="${x.match_id===m.match_id?"on":""}" data-otro="${x.match_id}">${esc(x.bags.map(nom).join(" / "))} <span class="vsx">vs</span> ${esc(x.resto.map(nom).join(" / "))}</button>`).join("")}</div>` : "";
  const tramo=(desde,hasta)=>`<div class="tw"><table class="tarjeta gbkt"><thead>
    <tr><th class="l">Hoyo</th>${[...Array(hasta-desde+1)].map((_,i)=>`<th>${desde+i}</th>`).join("")}<th>${desde===1?"Ida":"Vta"}</th></tr>
    <tr><th class="l">Par</th>${[...Array(hasta-desde+1)].map((_,i)=>`<th>${par[desde-1+i]}</th>`).join("")}<th>${par.slice(desde-1,hasta).reduce((a,b)=>a+b,0)}</th></tr></thead><tbody>
    ${jug.map(j=>{ const g=tar[String(j)]||[]; const lado=m.bags.map(String).includes(String(j))?"b":"r";
      const suma=g.slice(desde-1,hasta).filter(x=>x!=null).reduce((a,b)=>a+b,0);
      return `<tr><td class="l" style="color:var(--${lado==="b"?"bags":"resto"});font-weight:600">${esc(nombreLado(j))}</td>
      ${[...Array(hasta-desde+1)].map((_,i)=>{ const h=desde-1+i, v=g[h];
        const gano = m.hoyos[h]===(lado==="b"?"A":"B");
        return `<td class="${pk.has(String(j)+"|"+(h+1))?"pdc":""} ${claseGolpe((m.recibe_hoyo||{})[String(j)],h)}">${v==null?"·":`<span class="sc gbk ${formaGolpe(v,par[h])}">${v}</span>`}</td>`; }).join("")}
      <td><b>${suma||""}</b></td></tr>`; }).join("")}
    <tr class="clas"><td class="l">Estado</td>${[...Array(hasta-desde+1)].map((_,i)=>{
      const h=desde-1+i; if(m.hoyos[h]==null) return "<td></td>";
      let ac=0; for(let k=0;k<=h;k++){ if(m.hoyos[k]==="A") ac++; else if(m.hoyos[k]==="B") ac--; }
      const txt=ac===0?"AS":Math.abs(ac)+"UP";
      return `<td class="${ac>0?"b":ac<0?"r":""}">${txt}</td>`; }).join("")}<td></td></tr>
    </tbody></table></div>`;
  const cerradoEv = e.evento.estado==="CERRADO";
  const carga = !puedo ? `<div class="aviso">Solo los jugadores de este cruce (o el administrador) pueden cargar golpes.</div>`
    : (cerradoEv ? "" : bloqueCarga({mid:m.match_id, jug:jug.map(String), hoyo:S.hoyo, par, guardado:(j,i)=>(tarS[String(j)]||[])[i],
        premiosEn:h=>premiosHoyo(e.evento,h), premios:()=>e.premios,
        nombre:nombreLado, avatarDe:j=>avatar(j), color:j=>m.bags.map(String).includes(String(j))?"b":"r", recibe:j=>(m.golpes_de||{})[String(j)]||0,
        golpeEn:(j,i)=>((m.recibe_hoyo||{})[String(j)]||[])[i]||0,
        hechoHoyo:i=>jug.every(j=>(tarS[String(j)]||[])[i]!=null)}));
  const falta = m.falta_hoyo ? `<div class="aviso rojo">Falta cargar el hoyo ${m.falta_hoyo}: el match se cuenta hasta ahí.</div>` : "";
  const pctM=pctN(m.porcentaje);
  const hcpInfo=`<div class="small muted" style="margin:0 0 10px">Golpes${pctM!==100?" al "+pctM+"\u00a0%":""}${e.evento.hcp_modo==="COMPLETO"?" (handicap completo)":""}: ${jug.map(j=>esc(nombreLado(j))+" <b>"+((m.golpes_de||{})[String(j)]||0)+"</b>").join(" · ")}${S.ses.jugador.rol==="admin"&&!cerradoEv?` · <a class="lk" id="hcpArmar" style="cursor:pointer">✎ cambiar</a>`:""}</div>`;
  return `<button class="btn volver-vivo" id="volverV">‹ Vivo</button>
  <div class="mhead">${hdrMatch({A:{ids:m.bags,nombre:nom,col:"b",sub:"Bags Boys"},B:{ids:m.resto,nombre:nom,col:"r",sub:"Resto del Mundo"},
      lider:m.jugados&&m.estado>0?"A":m.jugados&&m.estado<0?"B":"", res:st.t, est:m.cerrado?"final":(m.jugados?"hoyo "+m.jugados:"por salir")})}<div style="display:none">
  </div></div>
  ${selSalida}${falta}${aviso}${tramo(1,9)}${tramo(10,18)}${leyenda(pk.size>0,"gbk")}${m.una_bola?"":lineaStb(jug.map(j=>({nombre:nombreLado(j),golpes:tar[String(j)]||[],rep:(m.recibe_hoyo||{})[String(j)],cls:m.bags.map(String).includes(String(j))?"c-b":"c-r"})),par)}
  ${hcpInfo}${carga}`;
}

/* cambiar el handicap de un jugador para el evento abierto en Armar */
async function fijarHcpEv(j,v){
  const r=await api("fijarHcp",{token:tok(),evento_id:A.evento.evento_id,jugador_id:j,hcp:v},"POST");
  if(!r.ok){ S.err=r.error; pintar(); return false; }
  A.hcpEv=A.hcpEv||{}; A.hcpAj=A.hcpAj||{}; A.hcpEv[String(j)]=v; A.hcpAj[String(j)]=v; S.err="";
  if(S.est&&S.est.evento&&S.est.evento.evento_id===A.evento.evento_id) refrescar(true);
  return true;
}
function ligarHcpArmar(){
  document.querySelectorAll("[data-epr]").forEach(sel=>sel.onchange=async()=>{
    const campo=sel.dataset.epr, x=await api("premiosEvento",{evento_id:A.evento.evento_id,[campo]:sel.value},"POST");
    if(!x.ok){ S.err=x.error; pintar(); return; }
    A.evento[campo]=sel.value?+sel.value:null; S.err="";
    if(S.est&&S.est.evento&&S.est.evento.evento_id===A.evento.evento_id) refrescar(true); });
  document.querySelectorAll("[data-epct],[data-emodo]").forEach(b=>b.onclick=async()=>{
    const ev=A.evento; document.querySelectorAll("[data-epct],[data-emodo]").forEach(x=>x.disabled=true);
    const pc=b.dataset.epct?+b.dataset.epct:pctN(ev.porcentaje), md=b.dataset.emodo||ev.hcp_modo||"DIFERENCIA";
    const x=await api("fijarPorcentaje",{token:tok(),evento_id:ev.evento_id,porcentaje:pc,hcp_modo:md},"POST");
    if(!x.ok){ S.err=x.error; pintar(); return; }
    ev.porcentaje=pc; ev.hcp_modo=md; S.err=""; pintar();
    if(S.est&&S.est.evento&&S.est.evento.evento_id===ev.evento_id) refrescar(true); });
  document.querySelectorAll("[data-hed]").forEach(b=>b.onclick=async e=>{ e.stopPropagation();
    const j=b.dataset.hed, v=await pedirHcp("Handicap de "+nom(j)+" para este evento",fmtH(hcpEv(j)));
    if(v===null) return;
    if(await fijarHcpEv(j,v)) pintar(); });

function ligarArmar(){
  if(!S.cat) return;

  const c=document.getElementById("crear");

      dia:document.getElementById("ad").value,cancha_id:cid,hcp_modo:document.getElementById("ah").value,porcentaje:document.getElementById("apct").value,ld_hoyo:document.getElementById("ald").value,ba_hoyo:document.getElementById("aba").value,
      pts_gana:document.getElementById("ap").value,pts_empata:document.getElementById("ae").value},"POST");

    A.nuevo=false; await abrirEvento(r.evento_id);
  };
  const a=document.getElementById("addses");
  if(a) a.onclick=async()=>{
    const nombre=document.getElementById("sn").value.trim()||("Sesión "+(A.sesiones.length+1));
    const formato=document.getElementById("sf").value;
    a.disabled=true; a.textContent="Agregando…";
    const r=await api("crearSesion",{token:tok(),evento_id:A.evento.evento_id,orden:A.sesiones.length+1,nombre,formato,hoyos:18},"POST");
    if(!r.ok){ S.err=r.error; a.disabled=false; pintar(); return; }
    A.sesiones.push({sesion_id:r.sesion_id,nombre,formato,matches:[]}); delete S.form.sn; S.err=""; pintar();
  };
  document.querySelectorAll("[data-borrar]").forEach(b=>b.onclick=async()=>{
    if(!await confirmar("¿Borrar este cruce?","",{ok:"Borrar",peligro:true})) return;
    const r=await api("borrarMatch",{token:tok(),match_id:b.dataset.borrar},"POST");
    if(!r.ok){ S.err=r.error; pintar(); return; }
