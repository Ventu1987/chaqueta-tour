<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaqueta Tour · En vivo</title>
<meta name="theme-color" content="#050C18">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
  --page:#070F1C;--card:#0E1A2E;--soft:#132339;--navy:#050C18;--ink:#EAF0F8;--ink2:#A9B6C9;--ink3:#6E7C92;--line:#1E2F48;
  --gold:#E2BE62;--goldbg:rgba(226,190,98,.14);--red:#FF5C6F;--green:#4CC98E;
  --bags:#4F8FF7;--bagsbg:rgba(79,143,247,.16);--resto:#E8B93A;--restobg:rgba(232,185,58,.16);
  --cond:"Barlow Condensed",Arial,sans-serif;--shadow:none}
:root[data-theme="light"]{--page:#F2F4F7;--card:#fff;--soft:#F6F8FB;--navy:#0A1F3D;--ink:#0E1726;--ink2:#4A5568;--ink3:#8792A6;--line:#E3E7EE;
  --gold:#B8912F;--goldbg:rgba(184,145,47,.13);--red:#C8102E;--green:#0F7B4F;--bags:#1D4ED8;--bagsbg:rgba(29,78,216,.1);
  --resto:#9A7400;--restobg:rgba(232,185,58,.22);--shadow:0 1px 2px rgba(10,31,61,.06),0 4px 14px rgba(10,31,61,.05)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
a{color:inherit}button{font:inherit}
h1{font-family:var(--cond);font-weight:700;font-size:clamp(26px,6.5vw,36px);margin:0;line-height:1.05}
h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:24px 0 6px}
h3{font-size:15px;margin:0}
.lead{color:var(--ink2);margin:6px 0 14px}
.small{font-size:12.5px}.muted{color:var(--ink3)}
main{max-width:900px;margin:0 auto;padding:16px 14px 20px}

/* ── ingreso ── */
.login{min-height:100svh;display:grid;place-items:center;padding:20px;background:var(--navy)}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
.lcard img.esc{width:88px;height:auto;margin:0 auto 14px;display:block}
.lcard .tt{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.02em}
.lcard .st{color:var(--gold);font-weight:600;font-size:13px;letter-spacing:.14em;margin-top:2px}
.lcard label{display:block;color:var(--ink2);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:22px 0 8px}
.lcard input{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font-family:var(--cond);font-size:26px;text-align:center;padding:12px;letter-spacing:.06em}
.btn{width:100%;margin-top:14px;background:var(--gold);color:#0A1F3D;border:0;border-radius:12px;padding:14px;
  font-weight:700;font-size:15px;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.pinbox{display:flex;justify-content:center;gap:14px;margin:18px 0 6px}
.pinbox i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink3);display:block}
.pinbox i.on{background:var(--gold);border-color:var(--gold)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.keys button{background:var(--soft);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:16px 0;
  font-family:var(--cond);font-size:26px;font-weight:700;cursor:pointer}
.keys button:active{background:var(--goldbg)}
.err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px}
.volver{margin-top:16px;background:none;border:0;color:var(--ink2);font-size:13.5px;cursor:pointer}

/* ── barra ── */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top img{height:30px}
.top .t{font-family:var(--cond);font-weight:700;font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{background:rgba(255,255,255,.12);border:0;color:#fff;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--navy);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:rgba(255,255,255,.55);font-size:11px;font-weight:600;padding:6px 2px;cursor:pointer}
.tabs button b{display:block;font-size:19px;font-weight:400;line-height:1.3}
.tabs button.on{color:var(--gold)}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none}
.drawer.on{display:block}
.dpanel{width:min(320px,86vw);height:100%;background:var(--card);border-right:1px solid var(--line);padding:0 0 20px}
.dhead{background:var(--navy);color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px}
.dhead .av{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#0A1F3D;display:grid;place-items:center;font-weight:700}
.dpanel a,.dpanel button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);
  padding:15px 16px;color:var(--ink);font-size:15px;font-weight:600;text-align:left;text-decoration:none;cursor:pointer}

/* ── tarjetas ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.marcador{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.marcador .n{font-family:var(--cond);font-weight:700;font-size:54px;line-height:1}
.marcador .n .b{color:var(--bags)}.marcador .n .r{color:var(--resto)}
.marcador .eq{display:flex;justify-content:space-between;font-family:var(--cond);font-weight:700;font-size:16px;margin-top:6px}
.marcador .eq .b{color:var(--bags)}.marcador .eq .r{color:var(--resto)}
.barra{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--soft);margin-top:10px}
.barra i.b{background:var(--bags)}.barra i.r{background:var(--resto)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.mrow:first-of-type{border-top:0}
.mrow .lado{min-width:0}
.mrow .lado.r{text-align:right}
.mrow .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm small{display:block;font-weight:400;color:var(--ink3);font-size:11.5px}
.est{font-family:var(--cond);font-weight:700;font-size:17px;padding:4px 10px;border-radius:8px;background:var(--soft);white-space:nowrap}
.est.b{background:var(--bagsbg);color:var(--bags)}.est.r{background:var(--restobg);color:var(--resto)}
.est.fin{outline:2px solid var(--gold)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 8px}
.sec-h .f{font-family:var(--cond);font-weight:700;font-size:20px}

/* ── tarjeta del match ── */
.mhead{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.mh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.mh .lado{padding:14px 12px}
.mh .lado.b{background:var(--bagsbg)}.mh .lado.r{background:var(--restobg);text-align:right}
.mh .nm{font-family:var(--cond);font-weight:700;font-size:19px;line-height:1.15}
.mh .hc{font-size:11.5px;color:var(--ink2)}
.mh .res{padding:10px 12px;text-align:center}
.mh .res b{font-family:var(--cond);font-size:26px;display:block;line-height:1}
.mh .res span{font-size:11px;color:var(--ink3)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--soft);color:var(--ink3);font-size:11px;font-weight:600}
td.l,th.l{text-align:left;padding-left:10px}
tbody tr:last-child td{border-bottom:0}
.gb{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:50%;font-weight:700}
.gb.b{background:var(--bags);color:#fff}.gb.r{background:var(--resto);color:#241a00}
tr.clas td{font-family:var(--cond);font-weight:700;font-size:12.5px;background:var(--soft)}
tr.clas td.b{color:var(--bags)}tr.clas td.r{color:var(--resto)}
.cargar{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));margin-top:14px}
.hoyosel{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.hoyosel button{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}
.hoyosel button.on{background:var(--gold);color:#0A1F3D;border-color:var(--gold)}
.hoyosel button.hecho{border-color:var(--green);color:var(--green)}
.cargaj{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.cargaj .nm{flex:1;font-weight:600;font-size:14px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer}
.step b{font-family:var(--cond);font-size:24px;min-width:28px;text-align:center}
.ok{color:var(--green);font-size:12px;font-weight:600}

/* ── admin ── */
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 5px}
select,input[type=text],input[type=date],input[type=time]{width:100%;background:var(--soft);border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:11px;font:inherit;font-size:14.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chips button.b{border-color:var(--bags);color:var(--bags);background:var(--bagsbg)}
.chips button.r{border-color:var(--resto);color:var(--resto);background:var(--restobg)}
.aviso{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);margin-top:10px}
.load{padding:40px 10px;text-align:center;color:var(--ink3);font-size:13.5px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--goldbg);color:var(--gold)}
</style>
</head>

const FORMATOS = {SINGLES:"Singles",FOURBALL:"Fourball (mejor bola)",FOURSOME:"Foursome (golpes alternos)",GREENSOME:"Greensome"};
let S = {ses:null, cat:null, est:null, tab:"vivo", match:null, hoyo:1, err:"", cargando:false};

/* ── llamadas al script ── */
function sesionVencida(r){
  if(r && !r.ok && /Sesión vencida/i.test(r.error||"")){ S.ses=null; try{localStorage.removeItem("ct-ses")}catch(e){}
    S.err="Tu sesión venció, volvé a entrar"; pintar(); return true; }
  return false;
}
async function api(accion, datos={}, metodo="GET"){
  try{
    if(metodo==="GET"){
      const q=new URLSearchParams(Object.assign({accion},datos)).toString();
      const r=await fetch(API+"?"+q,{cache:"no-store"});
      const j=await r.json(); sesionVencida(j); return j;
    }
    const r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({accion},datos)),
      headers:{"Content-Type":"text/plain;charset=utf-8"}});
    const j=await r.json(); sesionVencida(j); return j;
  }catch(e){ return {ok:false,error:"Sin conexión con el servidor"}; }
}
const tok = () => S.ses ? S.ses.token : "";
function guardar(){ try{ localStorage.setItem("ct-ses",JSON.stringify(S.ses)); }catch(e){} }
function recuperar(){ try{ const v=localStorage.getItem("ct-ses"); if(v) S.ses=JSON.parse(v); }catch(e){} }
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nom = id => { const j=(S.cat?.jugadores||[]).find(x=>String(x.id)===String(id)); return j?j.nombre:("#"+id); };
const eqDe = id => (S.cat?.equipos||{})[String(id)] || null;   /* sin equipo = no juega la Ryder */
const app = () => document.getElementById("app");

    <button class="volver" id="atras">← Cambiar matrícula</button>`;
  return `<div class="login"><div class="lcard">
    <img class="esc" src="${LOGO}" alt="">
    <div class="tt">Chaqueta Tour</div><div class="st">EN VIVO</div>
    ${L.paso===1?p1:p2}
    <div class="err">${esc(S.err)}</div>
  </div></div>`;
}
function ligarLogin(){
  if(L.paso===1){
    const i=document.getElementById("mat");
    const ir=async()=>{ L.matricula=i.value.trim(); if(!L.matricula) return;
      S.err="Buscando…"; pintar();
      const r=await api("buscar",{matricula:L.matricula});
      if(!r.ok){ S.err=r.error; pintar(); return; }
      L.jugador=r; L.paso=2; L.pin=""; S.err=""; pintar(); };
    document.getElementById("seguir").onclick=ir;
    i.onkeydown=e=>{ if(e.key==="Enter") ir(); };
    i.focus();
  } else {
    document.querySelectorAll(".keys button").forEach(b=>b.onclick=async()=>{
      const k=b.dataset.k;
      if(k==="borrar") L.pin=L.pin.slice(0,-1);
      else if(k==="ok"||L.pin.length===4&&k!=="borrar"){ }
      else if(L.pin.length<4) L.pin+=k;
      if(L.pin.length===4 && k!=="borrar"){
        S.err="Entrando…"; pintar();
        const r=await api("login",{matricula:L.matricula,pin:L.pin});
        if(!r.ok){ S.err=r.error; L.pin=""; pintar(); return; }
        S.ses={token:r.token,jugador:r.jugador}; guardar(); S.err="";
        await arrancar(); return;
      }
      pintar();
    });
    document.getElementById("atras").onclick=()=>{ L.paso=1; L.pin=""; S.err=""; pintar(); };
  }
}

/* ═══ EN VIVO ═══ */
function estadoTxt(m){
  if(!m.jugados) return {t:"Por salir",c:""};
  const v=Math.abs(m.estado);
  if(m.cerrado){
    if(m.estado===0) return {t:"Empatado",c:"fin"};
    const rest=18-m.jugados;
    return {t:(rest>0? v+"&"+rest : v+" UP"),c:(m.estado>0?"b":"r")+" fin"};
  }
  if(m.estado===0) return {t:"AS",c:""};
  return {t:v+" UP",c:m.estado>0?"b":"r"};
}
function vistaVivo(){
  const e=S.est;
  if(!e||!e.evento) return `<h1>Todavía no hay nada en juego</h1>
    <p class="lead">Cuando el administrador arme la Ryder o una fecha, vas a verla acá en vivo.</p>
    <a class="btn sec" style="display:block;text-align:center;text-decoration:none;padding:14px" href="${HIST}">Ver las estadísticas históricas</a>`;
  const B=e.marcador.bags, R=e.marcador.resto, tot=Math.max(B+R,0.001);
  const porSes={};
  e.matches.forEach(m=>{ (porSes[m.sesion_id]=porSes[m.sesion_id]||[]).push(m); });
  return `
  <div class="marcador">
    <div class="n"><span class="b">${B}</span> <span class="muted" style="font-size:.45em">a</span> <span class="r">${R}</span></div>
    <div class="eq"><span class="b">Bags Boys</span><span class="r">Resto del Mundo</span></div>
    <div class="barra"><i class="b" style="width:${B/tot*100}%"></i><i class="r" style="width:${R/tot*100}%"></i></div>
    <div class="small muted" style="margin-top:8px">${esc(e.evento.nombre)} · ${esc(e.cancha.nombre||"")}${e.cancha.recorrido?" "+esc(e.cancha.recorrido):""}</div>
  </div>
  ${e.sesiones.map(s=>{
    const ms=(porSes[s.sesion_id]||[]).sort((a,b)=>Number(a.nro)-Number(b.nro));
    if(!ms.length) return "";
    return `<div class="sec-h"><span class="f">${esc(s.nombre)}</span><span class="pill">${FORMATOS[s.formato]||s.formato}</span></div>
    <div class="card">${ms.map(m=>{ const st=estadoTxt(m);
      return `<div class="mrow" data-m="${m.match_id}">
        <div class="lado"><div class="nm">${m.bags.map(j=>esc(nom(j))).join("<br>")}<small>${m.hora?esc(m.hora):""}</small></div></div>
        <span class="est ${st.c}">${st.t}</span>
        <div class="lado r"><div class="nm">${m.resto.map(j=>esc(nom(j))).join("<br>")}<small>${m.jugados?("hoyo "+m.jugados):""}</small></div></div>
      </div>`; }).join("")}</div>`;
  }).join("")}
  <p class="small muted" style="margin-top:14px">Se actualiza solo cada 20 segundos. Tocá un cruce para ver la tarjeta y cargar golpes.</p>
  ${S.ses.jugador.rol==="admin"&&e.evento.estado==="EN_JUEGO"?`<button class="btn sec" id="cerrarEv" style="margin-top:8px">Cerrar el evento y guardarlo</button>`:""}
  ${S.ses.jugador.rol==="admin"&&e.evento.estado==="BORRADOR"?`<div class="aviso">Este evento todavía está en borrador: solo lo ves vos. Empezalo desde la pestaña Armar.</div>`:""}`;
}
function vistaMatch(){
  const e=S.est, m=e.matches.find(x=>x.match_id===S.match);
  if(!m) { S.match=null; return vistaVivo(); }
  const par=e.cancha.par, st=estadoTxt(m);
  const unaBola=m.una_bola;
  const jug=unaBola?[m.bags[0],m.resto[0]]:m.bags.concat(m.resto);
  const nombreLado=j=>unaBola?(String(j)===String(m.bags[0])?m.bags.map(nom).join(" / "):m.resto.map(nom).join(" / ")):nom(j);
  const tar={}; m.tarjeta.forEach(t=>tar[String(t.jugador_id)]=t.golpes);
  const aviso = unaBola?`<div class="aviso">En ${FORMATOS[m.formato]} la pareja juega una sola bola: se carga un resultado por equipo.</div>`:"";
  const puedo = S.ses.jugador.rol==="admin" || jug.map(String).includes(String(S.ses.jugador.id));
  const tramo=(desde,hasta)=>`<div class="tw"><table><thead>
    <tr><th class="l">Hoyo</th>${[...Array(hasta-desde+1)].map((_,i)=>`<th>${desde+i}</th>`).join("")}<th>${desde===1?"Ida":"Vuelta"}</th></tr>
    <tr><th class="l">Par</th>${[...Array(hasta-desde+1)].map((_,i)=>`<th>${par[desde-1+i]}</th>`).join("")}<th>${par.slice(desde-1,hasta).reduce((a,b)=>a+b,0)}</th></tr></thead><tbody>
    ${jug.map(j=>{ const g=tar[String(j)]||[]; const lado=m.bags.map(String).includes(String(j))?"b":"r";
      const suma=g.slice(desde-1,hasta).filter(x=>x!=null).reduce((a,b)=>a+b,0);
      return `<tr><td class="l" style="color:var(--${lado==="b"?"bags":"resto"});font-weight:600">${esc(nombreLado(j))}</td>
      ${[...Array(hasta-desde+1)].map((_,i)=>{ const h=desde-1+i, v=g[h];
        const gano = m.hoyos[h]===(lado==="b"?"A":"B");
        return `<td>${v==null?"·":(gano?`<span class="gb ${lado}">${v}</span>`:v)}</td>`; }).join("")}
      <td><b>${suma||""}</b></td></tr>`; }).join("")}
    <tr class="clas"><td class="l">Estado</td>${[...Array(hasta-desde+1)].map((_,i)=>{
      const h=desde-1+i; if(m.hoyos[h]==null) return "<td></td>";
      let ac=0; for(let k=0;k<=h;k++){ if(m.hoyos[k]==="A") ac++; else if(m.hoyos[k]==="B") ac--; }
      const txt=ac===0?"AS":Math.abs(ac)+"UP";
      return `<td class="${ac>0?"b":ac<0?"r":""}">${txt}</td>`; }).join("")}<td></td></tr>
    </tbody></table></div>`;
  const hoyoAct=S.hoyo;
  const carga = !puedo ? `<div class="aviso">Solo los jugadores de este cruce (o el administrador) pueden cargar golpes.</div>` : `
    <div class="card cargar"><h3>Cargar el hoyo</h3>
      <div class="hoyosel">${[...Array(18)].map((_,i)=>{
        const hecho=jug.every(j=>(tar[String(j)]||[])[i]!=null);
        return `<button data-h="${i+1}" class="${hoyoAct===i+1?"on":""} ${hecho?"hecho":""}">${i+1}</button>`; }).join("")}</div>
      <div class="small muted">Hoyo ${hoyoAct} · par ${par[hoyoAct-1]}${(m.golpes_de&&Object.keys(m.golpes_de).length)?"":""}</div>
      ${jug.map(j=>{ const v=(tar[String(j)]||[])[hoyoAct-1];
        const rec=(m.golpes_de||{})[String(j)]||0;
        return `<div class="cargaj"><div class="nm">${esc(nombreLado(j))}<div class="small muted">${unaBola?"la pareja recibe":"recibe"} ${rec} golpe${rec===1?"":"s"} en la vuelta</div></div>
          <div class="step"><button data-j="${j}" data-d="-1">−</button><b id="g${j}">${v??par[hoyoAct-1]}</b><button data-j="${j}" data-d="1">+</button>
          <button class="btn" style="width:auto;margin:0;padding:10px 14px" data-guardar="${j}">${v!=null?"Cambiar":"Guardar"}</button></div></div>`; }).join("")}
      <div class="err">${esc(S.err)}</div></div>`;
  return `<button class="btn sec" id="volverV" style="width:auto;padding:8px 14px;margin:0 0 12px">← Volver</button>
  <div class="mhead"><div class="mh">
    <div class="lado b"><div class="nm">${m.bags.map(j=>esc(nom(j))).join("<br>")}</div><div class="hc">Bags Boys</div></div>
    <div class="res"><b>${st.t}</b><span>${m.cerrado?"final":(m.jugados?"hoyo "+m.jugados:"por salir")}</span></div>
    <div class="lado r"><div class="nm">${m.resto.map(j=>esc(nom(j))).join("<br>")}</div><div class="hc">Resto del Mundo</div></div>
  </div></div>
  ${aviso}${tramo(1,9)}${tramo(10,18)}
  ${carga}`;
}

/* ═══ armado del cuerpo ═══ */
function vistaTab(){
  if(S.tab==="vivo") return S.match?vistaMatch():vistaVivo();
  if(S.tab==="armar") return A.cruce?vistaCruce():vistaArmar();
  if(S.tab==="hcp") return vistaHcp();
  return "";
}
/* handicaps del día: arrancan con los de la base y el admin puede corregirlos */
function vistaHcp(){
  const e=S.est;
  if(!e||!e.evento) return `<h1>Handicaps del día</h1><p class="lead">Primero armá el evento.</p>`;
  const ids=[]; e.matches.forEach(m=>m.bags.concat(m.resto).forEach(j=>{ if(!ids.includes(String(j))) ids.push(String(j)); }));
  if(!ids.length) return `<h1>Handicaps del día</h1><p class="lead">Todavía no hay cruces armados.</p>`;
  const aj=e.hcp_ajustado||{};
  const fila=j=>{ const v=(e.hcp||{})[j]; const tocado=aj[j]!==undefined;
    return `<div class="cargaj"><div class="nm">${esc(nom(j))}<div class="small ${tocado?"ok":"muted"}">${tocado?"ajustado para este evento":"viene de la base"}</div></div>
      <div class="step"><button data-h="-1" data-j="${j}">−</button><b id="h${j}">${v}</b><button data-h="1" data-j="${j}">+</button>
      <button class="btn" style="width:auto;margin:0;padding:10px 14px" data-fijar="${j}">Guardar</button></div></div>`; };
  const lado=(t,cls)=>`<div class="card"><h3 style="color:var(--${cls})">${t}</h3>
    ${ids.filter(j=>eqDe(j)===(cls==="bags"?"bag":"resto")).map(fila).join("")}</div>`;
  return `<h1>Handicaps del día</h1>
  <p class="lead">Se toman de la base, del último handicap que figura. Si alguno está desactualizado, corregilo acá: vale solo para este evento y recalcula los matches al instante.</p>
  ${lado("Bags Boys","bags")}${lado("Resto del Mundo","resto")}
  <div class="err">${esc(S.err)}</div>`;
}
function pintar(){
  if(!S.ses){ app().innerHTML=vistaLogin(); ligarLogin(); return; }
  const j=S.ses.jugador, admin=j.rol==="admin";
  app().innerHTML=`
  <div class="top"><img src="${LOGO}" alt=""><div class="t">Chaqueta Tour</div>
    <button class="icon" id="recargar">↻</button><button class="icon" id="menu">☰</button></div>
  <main>${vistaTab()}</main>
  <div class="tabs">
    <button data-t="vivo" class="${S.tab==="vivo"?"on":""}"><b>◉</b>En vivo</button>
    ${admin?`<button data-t="armar" class="${S.tab==="armar"?"on":""}"><b>⚑</b>Armar</button>`:""}
    ${admin?`<button data-t="hcp" class="${S.tab==="hcp"?"on":""}"><b>⚖</b>Handicaps</button>`:""}
    <button data-t="hist"><b>≡</b>Historia</button>
  </div>
  <div class="drawer" id="drawer"><div class="dpanel">
    <div class="dhead"><div class="av">${esc((j.nombre||"?")[0])}</div><div><b>${esc(j.nombre)}</b><div class="small" style="color:var(--gold)">${admin?"ADMINISTRADOR":"JUGADOR"}</div></div></div>
    <a href="${HIST}">🏆 Estadísticas históricas</a>
    <button id="cpin">🔒 Cambiar mi PIN</button>
    <button id="tema">◐ Modo claro / oscuro</button>
    <button id="salir" style="color:var(--red)">→ Cerrar sesión</button>
  </div></div>`;
  ligar();
}
function ligar(){
  document.getElementById("menu").onclick=()=>document.getElementById("drawer").classList.add("on");
  document.getElementById("drawer").onclick=e=>{ if(e.target.id==="drawer") e.currentTarget.classList.remove("on"); };
  document.getElementById("recargar").onclick=()=>refrescar(true);
  document.getElementById("salir").onclick=()=>{ S.ses=null; try{localStorage.removeItem("ct-ses")}catch(e){} pintar(); };
  document.getElementById("tema").onclick=()=>{ const t=document.documentElement.getAttribute("data-theme")==="light"?"dark":"light";
    document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("ct-tema2",t)}catch(e){} };
  document.getElementById("cpin").onclick=async()=>{
    const p=prompt("Nuevo PIN de 4 números"); if(!p) return;
    const r=await api("cambiarPin",{token:tok(),pin_nuevo:p},"POST");
    alert(r.ok?"Listo, PIN cambiado":r.error);
  };
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
    if(b.dataset.t==="hist"){ location.href=HIST; return; }
    S.tab=b.dataset.t; S.match=null; S.err=""; pintar();
  });
  if(S.tab==="vivo"){
    document.querySelectorAll(".mrow[data-m]").forEach(r=>r.onclick=()=>{
      S.match=r.dataset.m; const m=S.est.matches.find(x=>x.match_id===S.match);
      S.hoyo=Math.min(18,(m.jugados||0)+1); pintar();
    });
    const v=document.getElementById("volverV"); if(v) v.onclick=()=>{ S.match=null; pintar(); };
    document.querySelectorAll(".hoyosel button").forEach(b=>b.onclick=()=>{ S.hoyo=+b.dataset.h; pintar(); });
    document.querySelectorAll(".step button[data-d]").forEach(b=>b.onclick=()=>{
      const el=document.getElementById("g"+b.dataset.j); el.textContent=Math.max(1,Math.min(15,+el.textContent+ +b.dataset.d));
    });
    document.querySelectorAll("[data-guardar]").forEach(b=>b.onclick=async()=>{
      const j=b.dataset.guardar, g=+document.getElementById("g"+j).textContent;
      b.disabled=true; b.textContent="…";
      const r=await api("cargarGolpe",{token:tok(),match_id:S.match,jugador_id:j,hoyo:S.hoyo,golpes:g},"POST");
      if(!r.ok){ S.err=r.error; b.disabled=false; pintar(); return; }
      S.err=""; await refrescar(true);
    });
  }
  if(S.tab==="armar") ligarArmar();
  if(S.tab==="hcp"){
    document.querySelectorAll(".step button[data-h]").forEach(b=>b.onclick=()=>{
      const el=document.getElementById("h"+b.dataset.j);
      el.textContent=Math.max(0,Math.min(36,+el.textContent+ +b.dataset.h));
    });
    document.querySelectorAll("[data-fijar]").forEach(b=>b.onclick=async()=>{
      const j=b.dataset.fijar, v=+document.getElementById("h"+j).textContent;
      b.disabled=true; b.textContent="…";
      const r=await api("fijarHcp",{token:tok(),evento_id:S.est.evento.evento_id,jugador_id:j,hcp:v},"POST");
      if(!r.ok){ S.err=r.error; b.disabled=false; pintar(); return; }
      S.err=""; await refrescar(true);
    });
  }
  const ce=document.getElementById("cerrarEv");
  if(ce) ce.onclick=async()=>{
    if(!confirm("¿Cerrar el evento? Queda guardado y deja de aparecer en vivo.")) return;
    ce.disabled=true; ce.textContent="Cerrando…";
    const r=await api("cerrarEvento",{token:tok(),evento_id:S.est.evento.evento_id},"POST");
    if(!r.ok){ S.err=r.error; ce.disabled=false; pintar(); return; }
    alert("Evento cerrado: "+r.marcador.bags+" a "+r.marcador.resto+" · "+r.ganador);
    A.evento=null; A.sesiones=[]; await refrescar(true);
  };
}

/* ═══ armado: enlaces ═══ */
function ligarArmar(){
  if(!S.cat) return;
  if(A.cruce){
    document.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{
      const l=b.dataset.l, j=b.dataset.j, cupo=A.sesiones[A.sesionAct].formato==="SINGLES"?1:2;
      const arr=A.sel[l], i=arr.indexOf(j);
      if(i>=0) arr.splice(i,1); else { if(arr.length>=cupo) arr.shift(); arr.push(j); }
      pintar();
    });
    document.getElementById("cancelarM").onclick=()=>{ A.cruce=false; A.sel={bags:[],resto:[]}; pintar(); };
    const g=document.getElementById("guardarM");
    if(g) g.onclick=async()=>{
      const s=A.sesiones[A.sesionAct], hora=document.getElementById("hh").value;
      g.disabled=true; g.textContent="Guardando…";
      const r=await api("crearMatch",{token:tok(),sesion_id:s.sesion_id,nro:s.matches.length+1,
        bags_1:A.sel.bags[0]||"",bags_2:A.sel.bags[1]||"",resto_1:A.sel.resto[0]||"",resto_2:A.sel.resto[1]||"",hora},"POST");
      if(!r.ok){ S.err=r.error; g.disabled=false; pintar(); return; }
      s.matches.push({match_id:r.match_id,bags:A.sel.bags.slice(),resto:A.sel.resto.slice(),hora});
      A.cruce=false; A.sel={bags:[],resto:[]}; S.err=""; pintar();
    };
    return;
  }
  if(!A.evento){
    const c=document.getElementById("crear");
    if(c) c.onclick=async()=>{
      const nombre=document.getElementById("an").value.trim();
      const cid=document.getElementById("ac").value;
      c.disabled=true; c.textContent="Creando…";
      const r=await api("crearEvento",{token:tok(),temporada:new Date().getFullYear(),tipo:"RYDER",nombre,
        dia:document.getElementById("ad").value,cancha_id:cid,hcp_modo:document.getElementById("ah").value,
        pts_gana:document.getElementById("ap").value,pts_empata:document.getElementById("ae").value},"POST");
      if(!r.ok){ S.err=r.error; c.disabled=false; pintar(); return; }
      const can=S.cat.canchas.find(x=>String(x.id)===String(cid))||{};
      A.evento={evento_id:r.evento_id,nombre,hcp_modo:document.getElementById("ah").value,
        canchaNombre:can.nombre+(can.recorrido?" "+can.recorrido:"")};
      A.sesiones=[]; S.err=""; pintar();
    };
    return;
  }
  const a=document.getElementById("addses");
  if(a) a.onclick=async()=>{
    const nombre=document.getElementById("sn").value.trim()||("Sesión "+(A.sesiones.length+1));
    const formato=document.getElementById("sf").value;
    a.disabled=true; a.textContent="Agregando…";
    const r=await api("crearSesion",{token:tok(),evento_id:A.evento.evento_id,orden:A.sesiones.length+1,nombre,formato,hoyos:18},"POST");
    if(!r.ok){ S.err=r.error; a.disabled=false; pintar(); return; }
    A.sesiones.push({sesion_id:r.sesion_id,nombre,formato,matches:[]}); S.err=""; pintar();
  };
  document.querySelectorAll("[data-borrar]").forEach(b=>b.onclick=async()=>{
    if(!confirm("¿Borrar este cruce?")) return;
    const r=await api("borrarMatch",{token:tok(),match_id:b.dataset.borrar},"POST");
    if(!r.ok){ S.err=r.error; pintar(); return; }
    const s=A.sesiones[+b.dataset.s]; s.matches=s.matches.filter(x=>x.match_id!==b.dataset.borrar); pintar();
  });
  document.querySelectorAll("[data-ses]").forEach(b=>b.onclick=()=>{ A.sesionAct=+b.dataset.ses; A.cruce=true; A.sel={bags:[],resto:[]}; pintar(); });
  const act=document.getElementById("activar");
  if(act) act.onclick=async()=>{
    act.disabled=true; act.textContent="Empezando…";
    const r=await api("estadoEvento",{token:tok(),evento_id:A.evento.evento_id,estado:"EN_JUEGO"},"POST");
    if(!r.ok){ S.err=r.error; act.disabled=false; pintar(); return; }
    S.tab="vivo"; await refrescar(true);
  };
}

/* ═══ ciclo ═══ */
async function refrescar(forzar){
  if(S.cargando && !forzar) return;
  S.cargando=true;
  const r=await api("estado");
  if(r && r.ok) S.est=r;
  S.cargando=false; pintar();
}
async function arrancar(){
  pintar();
  const c=await api("catalogo");
  if(c && c.ok) S.cat=c;
  await refrescar(true);
  if(!window.__timer) window.__timer=setInterval(()=>{ if(S.ses && !document.hidden) refrescar(); },20000);
}
(function(){
  try{ const t=localStorage.getItem("ct-tema2"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
  recuperar();
  if(S.ses) arrancar(); else pintar();
})();

</script>
